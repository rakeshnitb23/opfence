# Generated by `opfence export --target openshell --environment production`.
# Merge network_policies into your sandbox policy. Checked against the OpenShell
# policy schema reference on 2026-10-16; run `openshell policy validate` after merging.
version: 1
network_policies:
  # GQ: 8 catalog rules, decisions for production
  opfence_gq:
    name: opfence_gq
    endpoints:
      - host: api.gq.example
        port: 443
        path: /graphql
        protocol: graphql
        enforcement: enforce
        rules:
          - allow:
              operation_type: query
          - allow:
              operation_type: mutation
              fields: [thingCreate]
        deny_rules:
          - operation_type: query
            fields: [secret]
          - operation_type: mutation
            fields: [tokenCreate]
      - host: api.gq.example
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
          - allow:
              method: HEAD
              path: /**
          - allow:
              method: OPTIONS
              path: /**
          - allow:
              method: PUT
              path: /v1/files/**
        deny_rules:
          # gq.env.list: denied for every request because some arguments make it credential,
          # and OpenShell cannot check arguments.
          - method: GET
            path: /v1/projects/*/env
          # gq.export.read: Opfence would ask, but the GET allow rule above would let it through, so it is denied.
          - method: GET
            path: /v1/export
          # gq.files.delete-one: Opfence would ask, but the allow rule for gq.files.put would let it through, so it is denied.
          - method: PUT
            path: /v1/files/locked/*
  # MC: 5 catalog rules, decisions for production
  opfence_mc:
    name: opfence_mc
    endpoints:
      - host: mcp.mc.example
        port: 443
        path: /mcp
        protocol: mcp
        enforcement: enforce
        rules:
          - allow:
              method: completion/complete
          - allow:
              method: initialize
          - allow:
              method: logging/setLevel
          - allow:
              method: notifications/cancelled
          - allow:
              method: notifications/initialized
          - allow:
              method: notifications/progress
          - allow:
              method: notifications/roots/list_changed
          - allow:
              method: ping
          - allow:
              method: prompts/get
          - allow:
              method: prompts/list
          - allow:
              method: resources/list
          - allow:
              method: resources/read
          - allow:
              method: resources/subscribe
          - allow:
              method: resources/templates/list
          - allow:
              method: resources/unsubscribe
          - allow:
              method: tools/list
          - allow:
              method: tools/call
              tool:
                any: [list_items]
        deny_rules:
          # mc.sql.run: denied for every request because some arguments make it credential,
          # and OpenShell cannot check arguments.
          - method: tools/call
            tool:
              any: [reveal_key, run_sql]

# Not exported: aw. AWS Query and JSON actions travel in the request body
# or the X-Amz-Target header, which OpenShell's REST matchers cannot see; use `opfence run` for them.
