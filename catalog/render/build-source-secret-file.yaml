# Render REST API: build-source-secret-file
operations:
  - id: render.build-source-secret-file.list
    match: { rest: { method: GET, path: "/v1/build-sources/{buildSourceId}/secret-files" } }
    class: credential
    resource: { arg: buildSourceId, kind: build-source }
    card: "Read every secret file of build source {buildSourceId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      Returns each file's content.
    tests:
      - fixture: fixtures/build-source-secret-file-list.http
        expect: credential
        resource: bsr-shared01

  - id: render.build-source-secret-file.read
    match: { rest: { method: GET, path: "/v1/build-sources/{buildSourceId}/secret-files/{envVarKey}" } }
    class: credential
    resource: { arg: buildSourceId, kind: build-source }
    card: "Read secret file {envVarKey} of build source {buildSourceId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      Returns the file's content.
    tests:
      - fixture: fixtures/build-source-secret-file-read.http
        expect: credential
        resource: bsr-shared01

  - id: render.build-source-secret-file.replace
    match: { rest: { method: PUT, path: "/v1/build-sources/{buildSourceId}/secret-files" } }
    class: irreversible
    when:
      - if: { arg: body.content, present: true }
        class: credential
      - if: { arg: body.content, present: true }
        class: irreversible
    resource: { arg: buildSourceId, kind: build-source }
    card: "Replace every secret file of build source {buildSourceId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      Secret files left out of the list are deleted for good, and the files
      sent are secrets, so a request with content is both credential and
      irreversible.
    tests:
      - fixture: fixtures/build-source-secret-file-replace.http
        expect: irreversible
        resource: bsr-shared01

  - id: render.build-source-secret-file.set
    match: { rest: { method: PUT, path: "/v1/build-sources/{buildSourceId}/secret-files/{envVarKey}" } }
    class: credential
    resource: { arg: buildSourceId, kind: build-source }
    card: "Write secret file {envVarKey} on build source {buildSourceId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      Secret files are Render's store for secrets.
    tests:
      - fixture: fixtures/build-source-secret-file-set.http
        expect: credential
        resource: bsr-shared01

  - id: render.build-source-secret-file.delete
    match: { rest: { method: DELETE, path: "/v1/build-sources/{buildSourceId}/secret-files/{envVarKey}" } }
    class: irreversible
    resource: { arg: buildSourceId, kind: build-source }
    card: "Delete secret file {envVarKey} from build source {buildSourceId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      No API returns a deleted secret file.
    tests:
      - fixture: fixtures/build-source-secret-file-delete.http
        expect: irreversible
        resource: bsr-shared01
