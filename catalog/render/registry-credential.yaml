# Render REST API: registry-credential
operations:
  - id: render.registry-credential.create
    match: { rest: { method: POST, path: /v1/registrycredentials } }
    class: credential
    card: "Store registry credential {body.name} for {body.registry}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    tests:
      - fixture: fixtures/registry-credential-create.http
        expect: credential

  - id: render.registry-credential.update
    match: { rest: { method: PATCH, path: "/v1/registrycredentials/{registryCredentialId}" } }
    class: credential
    resource: { arg: registryCredentialId, kind: registry-credential }
    card: "Change registry credential {registryCredentialId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    tests:
      - fixture: fixtures/registry-credential-update.http
        expect: credential
        resource: rgc-ghcr01

  - id: render.registry-credential.delete
    match: { rest: { method: DELETE, path: "/v1/registrycredentials/{registryCredentialId}" } }
    class: irreversible
    resource: { arg: registryCredentialId, kind: registry-credential }
    card: "Delete registry credential {registryCredentialId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      A deleted secret cannot be read back; services that pull with it fail.
    tests:
      - fixture: fixtures/registry-credential-delete.http
        expect: irreversible
        resource: rgc-ghcr01
