  - id: render.service.ephemeral-shell
    match: { rest: { method: POST, path: "/v1/services/{serviceId}/ephemeral-shell" } }
    class: credential
    resource: { arg: serviceId, kind: service }
    card: "Open an SSH-able ephemeral instance of service {serviceId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      The instance runs with the service's variables and secret files and
      accepts SSH, like Railway's shell tokens.
    tests:
      - fixture: fixtures/service-ephemeral-shell.http
        expect: credential
        resource: srv-shopweb01
