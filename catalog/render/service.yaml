# Render REST API: service
operations:
  - id: render.service.create
    match: { rest: { method: POST, path: /v1/services } }
    class: money
    when:
      - if: { arg: body.secretFiles, present: true }
        class: credential
      - if: { arg: body.secretFiles, present: true }
        class: money
    resource: { arg: body.name, kind: service }
    card: "Create {body.type} service {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://github.com/render-oss/cli/blob/main/pkg/client/types_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      When serviceDetails.plan is left out the schema defaults to a paid plan,
      and workers, private services and cron jobs have no free plan, so
      creating a service is money (free web services and static sites are
      over-classified rather than special-cased, because a condition never
      relaxes a class). Secret files are secrets; the second condition keeps
      money alongside credential.
    tests:
      - fixture: fixtures/service-create.http
        expect: money
        resource: shop-web
      - fixture: fixtures/service-create-secret-files.http
        expect: credential
        resource: shop-web

  - id: render.service.delete
    match: { rest: { method: DELETE, path: "/v1/services/{serviceId}" } }
    class: irreversible
    resource: { arg: serviceId, kind: service }
    card: "Delete service {serviceId} with its disk, variables and secret files"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      The service's env vars, secret files and any attached disk go with it.
    tests:
      - fixture: fixtures/service-delete.http
        expect: irreversible
        resource: srv-shopweb01

  - id: render.service.update
    match: { rest: { method: PATCH, path: "/v1/services/{serviceId}" } }
    class: write
    when:
      - if: { arg: body.serviceDetails.plan, present: true }
        class: money
      - if: { arg: body.serviceDetails.previews, present: true }
        class: money
      - if: { arg: body.serviceDetails.pullRequestPreviewsEnabled, present: true }
        class: money
      - if: { arg: body.serviceDetails.ipAllowList, present: true }
        class: access
      - if: { arg: body.serviceDetails.renderSubdomainPolicy, present: true }
        class: access
    resource: { arg: serviceId, kind: service }
    card: "Change service {serviceId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://github.com/render-oss/cli/blob/main/pkg/client/types_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      A plan change or preview instances change the bill; ipAllowList and the
      onrender.com subdomain policy decide who can reach the service.
    tests:
      - fixture: fixtures/service-update.http
        expect: write
        resource: srv-shopweb01
      - fixture: fixtures/service-update-plan.http
        expect: money
        resource: srv-shopweb01
      - fixture: fixtures/service-update-subdomain.http
        expect: access
        resource: srv-shopweb01

  - id: render.service.suspend
    match: { rest: { method: POST, path: "/v1/services/{serviceId}/suspend" } }
    class: write
    resource: { arg: serviceId, kind: service }
    card: "Suspend service {serviceId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/render-oss/cli/blob/main/pkg/client/client_gen.go
      - https://unpkg.com/@renderinc/sdk@1.2.0/dist/generated/schema.d.ts
    notes: >-
      Takes the service offline until it is resumed.
    tests:
      - fixture: fixtures/service-suspend.http
        expect: write
        resource: srv-shopweb01

  - id: render.service.resume
    match: { rest: { method: POST, path: "/v1/services/{serviceId}/resume" } }
    class: write
    resource: { arg: serviceId, kind: service }
    card: "Resume service {serviceId}"
    status: verified
