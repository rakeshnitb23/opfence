provider: google-cloud-memorystore
title: Google Cloud Memorystore for Redis
docs: https://cloud.google.com/memorystore/docs/redis/reference/rest
# Redis instances and clusters, their backups, AUTH strings and ACL policies. The data itself is
# Redis' own protocol, which does not pass through this API.
# Generated from Google's discovery documents; every method that is not a
# GET has a rule, and so do the GETs that return secrets. The bearer token
# is a short-lived OAuth access token, which Opfence does not swap: there is
# no detect block (see LIMITS.md).
hosts: [redis.googleapis.com]
auth:
  - header: Authorization
    scheme: Bearer
defaults:
  rest_safe_methods: read
schemas:
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
