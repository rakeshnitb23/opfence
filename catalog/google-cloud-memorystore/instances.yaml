# Google Cloud Memorystore for Redis: instances.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-memorystore.instances.create
    match: { rest: { method: POST, path: "/v1/projects/{project}/locations/{location}/instances" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Create Memorystore instance in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    notes: >-
      Instances are billed by their size.
    tests:
      - fixture: fixtures/instances-create.http
        expect: money
        resource: "acme-prod"

  - id: google-cloud-memorystore.instances.delete
    match: { rest: { method: DELETE, path: "/v1/projects/{project}/locations/{location}/instances/{instance}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Delete Memorystore instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    notes: >-
      Deletes the instance with its data.
    tests:
      - fixture: fixtures/instances-delete.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-memorystore.instances.export
    match: { rest: { method: POST, path: "/v1/projects/{project}/locations/{location}/instances/{instance}:export" } }
    class: access
    resource: { arg: project, kind: project }
    card: "Export Memorystore instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    notes: >-
      Writes the data to the Cloud Storage location the request names, which can belong to another
      project.
    tests:
      - fixture: fixtures/instances-export.http
        expect: access
        resource: "acme-prod"

  - id: google-cloud-memorystore.instances.failover
    match: { rest: { method: POST, path: "/v1/projects/{project}/locations/{location}/instances/{instance}:failover" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Failover Memorystore instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    notes: >-
      A failover with data protection off can lose recent writes.
    tests:
      - fixture: fixtures/instances-failover.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-memorystore.instances.get-auth-string
    match: { rest: { method: GET, path: "/v1/projects/{project}/locations/{location}/instances/{instance}/authString" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Read auth string of Memorystore instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    notes: >-
      Returns the instance's AUTH string, its password.
    tests:
      - fixture: fixtures/instances-get-auth-string.http
        expect: credential
        resource: "acme-prod"

  - id: google-cloud-memorystore.instances.import
    match: { rest: { method: POST, path: "/v1/projects/{project}/locations/{location}/instances/{instance}:import" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Import Memorystore instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    notes: >-
      Replaces the instance's data with the file's.
    tests:
      - fixture: fixtures/instances-import.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-memorystore.instances.patch
    match: { rest: { method: PATCH, path: "/v1/projects/{project}/locations/{location}/instances/{instance}" } }
    class: money
    when:
      - if: { arg: body.authEnabled, equals: "false" }
        class: access
    resource: { arg: project, kind: project }
    card: "Change Memorystore instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    notes: >-
      Changes the instance's size or settings, and size is billed; turning AUTH off is access.
    tests:
      - fixture: fixtures/instances-patch.http
        expect: money
        resource: "acme-prod"
      - fixture: fixtures/instances-patch-when1.http
        expect: access
        resource: "acme-prod"

  - id: google-cloud-memorystore.instances.reschedule-maintenance
    match: { rest: { method: POST, path: "/v1/projects/{project}/locations/{location}/instances/{instance}:rescheduleMaintenance" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Reschedule maintenance of Memorystore instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    tests:
      - fixture: fixtures/instances-reschedule-maintenance.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-memorystore.instances.upgrade
    match: { rest: { method: POST, path: "/v1/projects/{project}/locations/{location}/instances/{instance}:upgrade" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Upgrade Memorystore instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/redis/v1/rest
    tests:
      - fixture: fixtures/instances-upgrade.http
        expect: write
        resource: "acme-prod"
