# Google Cloud Functions: operations.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-functions.operations.get
    match: { rest: { method: GET, path: "/v2/projects/{project}/locations/{location}/operations/{operation}" } }
    class: credential
    response: { hold: ["**.environmentVariables"], class: read }
    resource: { arg: project, kind: project }
    card: "Read Cloud Functions operation {operation} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://cloudfunctions.googleapis.com/$discovery/rest?version=v2
    notes: >-
      Returns the function's environment variables. The proxy holds their values: the agent sees
      tokens, which a write of the same function may carry back.
    tests:
      - fixture: fixtures/operations-get.http
        expect: credential
        response: fixtures/operations-get.json
        resource: "acme-prod"

  - id: google-cloud-functions.operations.list
