    notes: >-
      Returns the function's environment variables. The proxy holds their values: the agent sees
      tokens, which a write of the same function may carry back.
    tests:
      - fixture: fixtures/operations-list.http
        expect: credential
        response: fixtures/operations-list.json
        resource: "acme-prod"

  - id: google-cloud-functions.operations.get-v1
    match: { rest: { method: GET, path: "/v1/operations/{operation}" } }
