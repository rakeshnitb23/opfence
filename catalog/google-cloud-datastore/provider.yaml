provider: google-cloud-datastore
title: Google Cloud Datastore
docs: https://cloud.google.com/datastore/docs/reference/data/rest
# Entities, by their commits and queries, indexes, imports and exports.
# Generated from Google's discovery documents; every method that is not a
# GET has a rule, and so do the GETs that return secrets. The bearer token
# is a short-lived OAuth access token, which Opfence does not swap: there is
# no detect block (see LIMITS.md).
hosts: [datastore.googleapis.com]
auth:
  - header: Authorization
    scheme: Bearer
defaults:
  rest_safe_methods: read
schemas:
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/datastore/v1/rest
