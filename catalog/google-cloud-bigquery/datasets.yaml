    match: { rest: { method: PUT, path: "/bigquery/v2/projects/{project}/datasets/{dataset}" } }
    class: write
    when:
      - if: { arg: body.access, present: true }
        class: access
      - if: { arg: body.defaultTableExpirationMs, present: true }
        class: irreversible
      - if: { arg: body.defaultPartitionExpirationMs, present: true }
        class: irreversible
      - if: { arg: body.maxTimeTravelHours, present: true }
        class: irreversible
    resource: { arg: project, kind: project }
    card: "Change BigQuery dataset {dataset} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/bigquery/v2/rest
    notes: >-
      Access lists are access; table expiry, partition expiry and a shorter time travel window
      delete data later, so they are irreversible.
    tests:
      - fixture: fixtures/datasets-update.http
        expect: write
        resource: "acme-prod"
      - fixture: fixtures/datasets-update-when1.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/datasets-update-when2.http
        expect: irreversible
        resource: "acme-prod"
      - fixture: fixtures/datasets-update-when3.http
        expect: irreversible
        resource: "acme-prod"
