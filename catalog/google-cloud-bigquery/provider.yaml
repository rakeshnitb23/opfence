provider: google-cloud-bigquery
title: Google BigQuery
docs: https://cloud.google.com/bigquery/docs/reference/rest
# Datasets, tables, jobs and the SQL they run, routines, models and row access policies. Query jobs
# are decided by their SQL, read as GoogleSQL, with the job's own settings (a destination table it
# overwrites, a load, copy or extract).
# Generated from Google's discovery documents; every method that is not a
# GET has a rule, and so do the GETs that return secrets. The bearer token
# is a short-lived OAuth access token, which Opfence does not swap: there is
# no detect block (see LIMITS.md).
hosts: [bigquery.googleapis.com]
auth:
  - header: Authorization
    scheme: Bearer
defaults:
  rest_safe_methods: read
schemas:
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/bigquery/v2/rest
