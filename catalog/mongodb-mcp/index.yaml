# MongoDB MCP server: index
operations:
  - id: mongodb-mcp.index.list
    match: { mcp: { tool: collection-indexes } }
    class: read
    resource: { arg: collection, kind: collection }
    card: "List indexes of collection {collection} in {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb-js/mongodb-mcp-server/blob/main/packages/tools-mongodb/src/tools/metadata/collectionIndexes.ts
    notes: >-
      The tool talks to MongoDB over the wire protocol, not HTTP, so only the
      agent hook sees it; the proxy never does.
    tests:
      - fixture: fixtures/index-list.http
        expect: read
        resource: orders

  - id: mongodb-mcp.index.create
    match: { mcp: { tool: create-index } }
    class: write
    resource: { arg: collection, kind: collection }
    card: "Create index {name} on collection {collection} in {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb-js/mongodb-mcp-server/blob/main/packages/tools-mongodb/src/tools/create/createIndex.ts
    notes: >-
      Building an index can load a busy cluster but changes no documents. The
      tool talks to MongoDB over the wire protocol, not HTTP, so only the agent
      hook sees it; the proxy never does.
    tests:
      - fixture: fixtures/index-create.http
        expect: write
        resource: orders

  - id: mongodb-mcp.index.drop
    match: { mcp: { tool: drop-index } }
    class: delete
    resource: { arg: collection, kind: collection }
    card: "Drop index {indexName} from collection {collection} in {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb-js/mongodb-mcp-server/blob/main/packages/tools-mongodb/src/tools/delete/dropIndex.ts
    notes: >-
      No documents are lost and the index can be rebuilt from them, though
      queries that relied on it slow down meanwhile (and a unique index stops
      enforcing uniqueness). The tool talks to MongoDB over the wire protocol,
      not HTTP, so only the agent hook sees it; the proxy never does.
    tests:
      - fixture: fixtures/index-drop.http
        expect: delete
        resource: orders
