provider: google-cloud-pubsub
title: Google Cloud Pub/Sub
docs: https://cloud.google.com/pubsub/docs/reference/rest
# Topics, subscriptions, snapshots and schemas, and publishing and pulling messages through the REST
# API.
# Generated from Google's discovery documents; every method that is not a
# GET has a rule, and so do the GETs that return secrets. The bearer token
# is a short-lived OAuth access token that google-oauth mints, so the agent
# holds a placeholder the proxy swaps in here (secrets_from).
hosts: [pubsub.googleapis.com]
auth:
  - header: Authorization
    scheme: Bearer
secrets_from: [google-oauth]
defaults:
  rest_safe_methods: read
schemas:
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/pubsub/v1/rest
