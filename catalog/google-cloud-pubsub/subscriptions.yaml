    tests:
      - fixture: fixtures/subscriptions-set-iam-policy.http
        expect: access
        resource: "acme-prod"

  - id: google-cloud-pubsub.subscriptions.test-iam-permissions
    match: { rest: { method: POST, path: "/v1/projects/{project}/subscriptions/{subscription}:testIamPermissions" } }
    class: read
    resource: { arg: project, kind: project }
