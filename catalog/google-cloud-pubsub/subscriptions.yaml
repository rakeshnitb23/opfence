    sources:
      - https://www.googleapis.com/discovery/v1/apis/pubsub/v1/rest
    notes: >-
      Seeking to a later time or a snapshot acknowledges the messages before it.
    tests:
      - fixture: fixtures/subscriptions-seek.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-pubsub.subscriptions.set-iam-policy
    match: { rest: { method: POST, path: "/v1/projects/{project}/subscriptions/{subscription}:setIamPolicy" } }
    class: access
    resource: { arg: project, kind: project }
    card: "Change who can access Pub/Sub subscription {subscription} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
