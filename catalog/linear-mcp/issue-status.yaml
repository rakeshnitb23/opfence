# Linear MCP server: workflow states
operations:
  - id: linear-mcp.issue-status.list
    match: { mcp: { tool: list_issue_statuses } }
    class: read
    card: "List workflow states of team {team}"
    status: draft
    verified: 2026-10-19
    sources:
      - https://linear.app/docs/mcp
      - https://apigene.ai/mcp/official/linear
      - https://www.remote-mcp.com/servers/linear
    notes: >-
      Draft: the name appears only in third-party listings of the hosted
      server, not in a Linear source this machine could read, and may have
      been renamed or merged since.

  - id: linear-mcp.issue-status.get
    match: { mcp: { tool: get_issue_status } }
    class: read
    card: "Show workflow state {name}"
    status: draft
    verified: 2026-10-19
    sources:
      - https://linear.app/docs/mcp
      - https://apigene.ai/mcp/official/linear
      - https://www.remote-mcp.com/servers/linear
    notes: >-
      Draft: the name appears only in third-party listings of the hosted
      server, not in a Linear source this machine could read, and may have
      been renamed or merged since.
