provider: aws-lambda-tool-mcp
title: AWS Lambda Tool MCP
docs: https://github.com/awslabs/mcp/tree/main/src/lambda-tool-mcp-server
# AWS Labs' Lambda Tool MCP server (PyPI awslabs.lambda-tool-mcp-server,
# source github.com/awslabs/mcp src/lambda-tool-mcp-server), read at version
# 2.1.1 (commit d534d0f, 2026-10-16). It runs locally over stdio. At start it
# lists the account's Lambda functions (narrowed by FUNCTION_PREFIX,
# FUNCTION_LIST or FUNCTION_TAG_KEY/FUNCTION_TAG_VALUE) and registers one tool
# per function, named after the function (prefix removed, other characters
# than letters, digits and _ replaced by _), taking one `parameters` object.
# Each call invokes that function synchronously (lambda:InvokeFunction), and a
# function can do anything its role allows.
# No rules: the tool names are the user's function names, which the catalog
# cannot list. defaults.mcp_tools makes each call irreversible instead (a
# function can do anything its role allows), as the rule
# aws-lambda-tool-mcp.tool.<function>, with the function as its resource: in
# production the user types the function's name to approve. The user's
# config can override one function by that rule id
# (aws-lambda-tool-mcp.tool.orders_lookup: allow), and environments can map
# function names with the argument path "tool".
# No hosts; the agent hook sees the tool calls. The README keys it
# "awslabs.lambda-tool-mcp-server", which Claude Code writes as
# "awslabs_lambda-tool-mcp-server" (no dots in tool names).
# No detect or auth block: AWS credentials belong to catalog/aws.
defaults:
  mcp_tools: irreversible
mcp:
  names: [awslabs_lambda-tool-mcp-server, lambda-tool-mcp-server, aws-lambda-tool, lambda-tool]
  package: "awslabs.lambda-tool-mcp-server"
