# Cloudflare REST API (api.cloudflare.com/client/v4): r2-catalog
operations:
  - id: cloudflare.r2-catalog.credential-store
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/basin-catalog/{bucket_name}/credential" } }
    class: credential
    resource: { arg: bucket_name, kind: bucket }
    card: "Store catalog credentials for R2 bucket {bucket_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/r2-catalog-credential-store.http
        expect: credential
        resource: "shop-assets"

