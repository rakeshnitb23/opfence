# Cloudflare REST API (api.cloudflare.com/client/v4): lb-pool
operations:
  - id: cloudflare.lb-pool.account-create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/load_balancers/pools" } }
    class: money
    resource: { arg: account_id, kind: account }
    card: "Create load balancer pool {body.name} (account)"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Load balancing is billed by load balancer and origin count, so creating
      one adds to the bill.
    tests:
      - fixture: fixtures/lb-pool-account-create.http
        expect: money
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

