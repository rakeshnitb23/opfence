    verified: 2026-10-22
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Unless secret is false, the dataset is an Exact Data Match one and the response holds the
      secret the EDM encoder hashes it with.
