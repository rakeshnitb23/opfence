        expect: access
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.oauth-client.secret-rotate
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/oauth_clients/{oauth_client_id}/rotate_secret" } }
    class: credential
