# Cloudflare REST API (api.cloudflare.com/client/v4): turnstile
operations:
  - id: cloudflare.turnstile.widget-create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/challenges/widgets" } }
    class: credential
    resource: { arg: account_id, kind: account }
    card: "Create Turnstile widget {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      The response includes the widget's secret key.
    tests:
      - fixture: fixtures/turnstile-widget-create.http
        expect: credential
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.turnstile.widget-update
    match: { rest: { method: PUT, path: "/client/v4/accounts/{account_id}/challenges/widgets/{sitekey}" } }
    class: write
    resource: { arg: sitekey, kind: turnstile-widget }
    card: "Change Turnstile widget {sitekey}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/turnstile-widget-update.http
        expect: write
        resource: "0x4AAF00AAAABn0R22HWm-YUc"

  - id: cloudflare.turnstile.widget-delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/challenges/widgets/{sitekey}" } }
    class: irreversible
    resource: { arg: sitekey, kind: turnstile-widget }
    card: "Delete Turnstile widget {sitekey}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      The widget's secret goes with it; sites using the sitekey stop validating.
    tests:
      - fixture: fixtures/turnstile-widget-delete.http
        expect: irreversible
        resource: "0x4AAF00AAAABn0R22HWm-YUc"

  - id: cloudflare.turnstile.widget-rotate-secret
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/challenges/widgets/{sitekey}/rotate_secret" } }
    class: credential
    resource: { arg: sitekey, kind: turnstile-widget }
    card: "Rotate the secret of Turnstile widget {sitekey}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/turnstile-widget-rotate-secret.http
        expect: credential
        resource: "0x4AAF00AAAABn0R22HWm-YUc"

  - id: cloudflare.turnstile.widget-read
    match: { rest: { method: GET, path: "/client/v4/accounts/{account_id}/challenges/widgets/{sitekey}" } }
    class: credential
    resource: { arg: sitekey, kind: turnstile-widget }
    card: "Read Turnstile widget {sitekey} with its secret"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      The response includes the widget's secret key.
    tests:
      - fixture: fixtures/turnstile-widget-read.http
        expect: credential
        resource: "0x4AAF00AAAABn0R22HWm-YUc"
