# Cloudflare REST API (api.cloudflare.com/client/v4): r2-migration
operations:
  - id: cloudflare.r2-migration.job-create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/slurper/jobs" } }
    class: credential
    when:
      - if: { arg: body.overwrite, equals: "true" }
        class: credential
      - if: { arg: body.overwrite, equals: "true" }
        class: irreversible
    resource: { arg: account_id, kind: account }
    card: "Start a Super Slurper migration into R2"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Stores access keys for the source and target buckets (credential). With
      overwrite=true existing R2 objects are replaced; that case also counts as
      irreversible (both classes apply).
    tests:
      - fixture: fixtures/r2-migration-job-create.http
        expect: credential
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.r2-migration.job-delete
