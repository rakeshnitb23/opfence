operations:
  - id: cloudflare.keyless-certificate.create
    match: { rest: { method: POST, path: "/client/v4/zones/{zone_id}/keyless_certificates" } }
    class: write
    resource: { arg: zone_id, kind: zone }
    card: "Create a Keyless SSL configuration in zone {zone_id}"
