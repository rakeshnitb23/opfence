# Cloudflare REST API (api.cloudflare.com/client/v4): secrets-store
operations:
  - id: cloudflare.secrets-store.create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/secrets_store/stores" } }
    class: write
    resource: { arg: account_id, kind: account }
    card: "Create a secrets store in account {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/secrets-store-create.http
        expect: write
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.secrets-store.delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/secrets_store/stores/{store_id}" } }
    class: irreversible
    resource: { arg: store_id, kind: secrets-store }
    card: "Delete secrets store {store_id} and its secrets"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Deleting secrets is irreversible: their values cannot be read back.
    tests:
      - fixture: fixtures/secrets-store-delete.http
        expect: irreversible
        resource: "985e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.secrets-store.secret-create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/secrets_store/stores/{store_id}/secrets" } }
    class: credential
    resource: { arg: store_id, kind: secrets-store }
    card: "Create secrets in store {store_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/secrets-store-secret-create.http
        expect: credential
        resource: "985e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.secrets-store.secrets-delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/secrets_store/stores/{store_id}/secrets" } }
    class: irreversible
    resource: { arg: store_id, kind: secrets-store }
    card: "Delete secrets from store {store_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/secrets-store-secrets-delete.http
        expect: irreversible
        resource: "985e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.secrets-store.secret-delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/secrets_store/stores/{store_id}/secrets/{secret_id}" } }
    class: irreversible
    resource: { arg: store_id, kind: secrets-store }
    card: "Delete secret {secret_id} from store {store_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/secrets-store-secret-delete.http
        expect: irreversible
        resource: "985e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.secrets-store.secret-update
    match: { rest: { method: PATCH, path: "/client/v4/accounts/{account_id}/secrets_store/stores/{store_id}/secrets/{secret_id}" } }
    class: write
    when:
      - if: { arg: body.value, present: true }
        class: credential
      - if: { arg: body.scopes, present: true }
        class: access
    resource: { arg: store_id, kind: secrets-store }
    card: "Change secret {secret_id} in store {store_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      A comment is a write. A new value sets a secret (credential); scopes
      decide which products may use it (access).
    tests:
      - fixture: fixtures/secrets-store-secret-update.http
        expect: write
        resource: "985e105f4ecef8ad9ca31a8372d0c353"
      - fixture: fixtures/secrets-store-secret-update-value.http
        expect: credential
        resource: "985e105f4ecef8ad9ca31a8372d0c353"
      - fixture: fixtures/secrets-store-secret-update-scopes.http
        expect: access
        resource: "985e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.secrets-store.secret-duplicate
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/secrets_store/stores/{store_id}/secrets/{secret_id}/duplicate" } }
    class: write
    resource: { arg: store_id, kind: secrets-store }
    card: "Duplicate secret {secret_id} under {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Copies the value server-side without returning it.
    tests:
      - fixture: fixtures/secrets-store-secret-duplicate.http
        expect: write
        resource: "985e105f4ecef8ad9ca31a8372d0c353"
