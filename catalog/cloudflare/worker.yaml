  - id: cloudflare.worker.deployment-delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/workers/scripts/{script_name}/deployments/{deployment_id}" } }
    class: delete
    resource: { arg: script_name, kind: worker }
    card: "Delete deployment {deployment_id} of Worker {script_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Removes a deployment record; the versions it pointed at remain and can be
      deployed again.
    tests:
      - fixture: fixtures/worker-deployment-delete.http
        expect: delete
        resource: "shop-api"

