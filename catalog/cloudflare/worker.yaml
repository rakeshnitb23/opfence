# Cloudflare REST API (api.cloudflare.com/client/v4): worker
operations:
  - id: cloudflare.worker.upload
    match: { rest: { method: PUT, path: "/client/v4/accounts/{account_id}/workers/scripts/{script_name}" } }
    class: write
    resource: { arg: script_name, kind: worker }
    card: "Deploy Worker {script_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Deploys code. The metadata part can also set secret_text bindings, and an
      upload without keep_bindings drops bindings the previous version had; the
      body is multipart, which Opfence does not read.
    tests:
      - fixture: fixtures/worker-upload.http
        expect: write
        resource: "shop-api"

  - id: cloudflare.worker.delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/workers/scripts/{script_name}" } }
    class: irreversible
    resource: { arg: script_name, kind: worker }
    card: "Delete Worker {script_name} with its secrets"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      The code can be redeployed from source, but the script's secrets are
      deleted with it and cannot be read back, and with force=true the Durable
      Object namespaces it implements (and their stored data) are deleted too.
      No API restores a deleted Worker.
    tests:
      - fixture: fixtures/worker-delete.http
        expect: irreversible
        resource: "shop-api"

  - id: cloudflare.worker.content-update
    match: { rest: { method: PUT, path: "/client/v4/accounts/{account_id}/workers/scripts/{script_name}/content" } }
    class: write
    resource: { arg: script_name, kind: worker }
    card: "Replace the code of Worker {script_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/worker-content-update.http
        expect: write
        resource: "shop-api"

  - id: cloudflare.worker.version-upload
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/workers/scripts/{script_name}/versions" } }
    class: write
    resource: { arg: script_name, kind: worker }
    card: "Upload a new version of Worker {script_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Uploads without deploying. The metadata can carry secret_text bindings;
      the multipart body is not read.
    tests:
      - fixture: fixtures/worker-version-upload.http
        expect: write
        resource: "shop-api"

  - id: cloudflare.worker.deployment-create
