# Cloudflare REST API (api.cloudflare.com/client/v4): worker-domain
operations:
  - id: cloudflare.worker-domain.attach
    match: { rest: { method: PUT, path: "/client/v4/accounts/{account_id}/workers/domains" } }
    class: access
    resource: { arg: account_id, kind: account }
    card: "Serve Worker {body.service} on custom domain {body.hostname}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Publishes the Worker on a public hostname.
    tests:
      - fixture: fixtures/worker-domain-attach.http
        expect: access
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.worker-domain.detach
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/workers/domains/{domain_id}" } }
    class: delete
    resource: { arg: account_id, kind: account }
    card: "Detach Worker custom domain {domain_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/worker-domain-detach.http
        expect: delete
        resource: "023e105f4ecef8ad9ca31a8372d0c353"
