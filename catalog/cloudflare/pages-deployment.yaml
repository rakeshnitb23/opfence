# Cloudflare REST API (api.cloudflare.com/client/v4): pages-deployment
operations:
  - id: cloudflare.pages-deployment.list
    match: { rest: { method: GET, path: "/client/v4/accounts/{account_id}/pages/projects/{project_name}/deployments" } }
    class: credential
    resource: { arg: project_name, kind: pages-project }
    card: "List deployments of Pages project {project_name} with their environment variables"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      The schema lists a value for secret_text environment variables in
      deployment configs. Opfence cannot see whether Cloudflare redacts them, so
      reading a project or deployment is assumed to reveal secrets.
    tests:
      - fixture: fixtures/pages-deployment-list.http
        expect: credential
        resource: "shop-web"

