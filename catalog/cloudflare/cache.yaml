# Cloudflare REST API (api.cloudflare.com/client/v4): cache
operations:
  - id: cloudflare.cache.purge
    match: { rest: { method: POST, path: "/client/v4/zones/{zone_id}/purge_cache" } }
    class: write
    when:
      - if: { arg: body.purge_everything, equals: "true" }
        class: delete
    resource: { arg: zone_id, kind: zone }
    card: "Purge cached content of zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Cached files are refetched from the origin, so nothing is lost. Purging
      everything sends every request to the origin at once, so it is classed
      delete (rebuildable) rather than write.
    tests:
      - fixture: fixtures/cache-purge.http
        expect: write
        resource: "9f1839b6152d298aca64c4e906b6d074"
      - fixture: fixtures/cache-purge-everything.http
        expect: delete
        resource: "9f1839b6152d298aca64c4e906b6d074"

