    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Deploys code. The metadata part can also set secret_text bindings, and an
      upload without keep_bindings drops bindings the previous version had; the
      body is multipart, which Opfence does not read.
    tests:
