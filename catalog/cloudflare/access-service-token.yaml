# Cloudflare REST API (api.cloudflare.com/client/v4): access-service-token
operations:
  - id: cloudflare.access-service-token.create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/access/service_tokens" } }
    class: credential
    resource: { arg: account_id, kind: account }
    card: "Create Access service token {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      A service token's client secret is returned once, on creation or rotation.
    tests:
      - fixture: fixtures/access-service-token-create.http
        expect: credential
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

