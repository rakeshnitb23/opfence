# Cloudflare REST API (api.cloudflare.com/client/v4): logpush
operations:
  - id: cloudflare.logpush.account-job-create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/logpush/jobs" } }
    class: access
    when:
      - if: { arg: body.destination_conf, matches: "(?i)(secret|access-key|sig=|authorization|token|password|api[-_]?key)" }
        class: credential
    resource: { arg: account_id, kind: account }
    card: "Create Logpush job {body.name} (account)"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      A Logpush job sends request logs (which can include headers and cookies)
      to the destination it names, so creating or repointing one is access.
      destination_conf usually embeds the destination's credentials (an S3
      secret key, a signed URL or an Authorization header), which makes it
      credential.
    tests:
      - fixture: fixtures/logpush-account-job-create.http
        expect: access
        resource: "023e105f4ecef8ad9ca31a8372d0c353"
      - fixture: fixtures/logpush-account-job-create-s3-keys.http
        expect: credential
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

