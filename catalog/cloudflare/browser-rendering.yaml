# Cloudflare REST API (api.cloudflare.com/client/v4): browser-rendering
operations:
  - id: cloudflare.browser-rendering.content
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/browser-rendering/content" } }
    class: read
    resource: { arg: account_id, kind: account }
    card: "Fetch HTML of {body.url} with Browser Rendering"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Loads a public page in a headless browser and returns what it rendered;
      changes nothing in the account.
    tests:
      - fixture: fixtures/browser-rendering-content.http
        expect: read
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

