# Cloudflare REST API (api.cloudflare.com/client/v4): load-balancer
operations:
  - id: cloudflare.load-balancer.zone-create
    match: { rest: { method: POST, path: "/client/v4/zones/{zone_id}/load_balancers" } }
    class: money
    resource: { arg: zone_id, kind: zone }
    card: "Create load balancer {body.name} (zone)"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Load balancing is billed by load balancer and origin count, so creating
      one adds to the bill.
    tests:
      - fixture: fixtures/load-balancer-zone-create.http
        expect: money
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.load-balancer.zone-update
