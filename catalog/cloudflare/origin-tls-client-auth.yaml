  - id: cloudflare.origin-tls-client-auth.list
    match: { rest: { method: GET, path: "/client/v4/zones/{zone_id}/origin_tls_client_auth" } }
    class: credential
    resource: { arg: zone_id, kind: zone }
    card: "List authenticated origin pull certificates of zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      The schema lists private_key in the response; Opfence cannot see whether
      Cloudflare redacts it, so it assumes the key is returned.
    tests:
      - fixture: fixtures/origin-tls-client-auth-list.http
        expect: credential
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.origin-tls-client-auth.read
    match: { rest: { method: GET, path: "/client/v4/zones/{zone_id}/origin_tls_client_auth/{certificate_id}" } }
    class: credential
    resource: { arg: zone_id, kind: zone }
    card: "Read authenticated origin pull certificate {certificate_id}"
