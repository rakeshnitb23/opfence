        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.origin-tls-client-auth.hostnames-list
    match: { rest: { method: GET, path: "/client/v4/zones/{zone_id}/origin_tls_client_auth/hostnames" } }
    class: read
    resource: { arg: zone_id, kind: zone }
    card: "List per-hostname authenticated origin pull settings of zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Returns certificate ids and status, no keys. Listed so the credential rule
      for GET /origin_tls_client_auth/{certificate_id} does not catch it.
    tests:
      - fixture: fixtures/origin-tls-client-auth-hostnames-list.http
        expect: read
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.origin-tls-client-auth.settings-read
    match: { rest: { method: GET, path: "/client/v4/zones/{zone_id}/origin_tls_client_auth/settings" } }
    class: read
    resource: { arg: zone_id, kind: zone }
