  - id: cloudflare.origin-tls-client-auth.settings
    match: { rest: { method: PUT, path: "/client/v4/zones/{zone_id}/origin_tls_client_auth/settings" } }
    class: access
    resource: { arg: zone_id, kind: zone }
    card: "Turn authenticated origin pulls on or off for zone {zone_id}"
