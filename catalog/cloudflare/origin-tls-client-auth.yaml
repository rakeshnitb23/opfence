# Cloudflare REST API (api.cloudflare.com/client/v4): origin-tls-client-auth
operations:
  - id: cloudflare.origin-tls-client-auth.upload
    match: { rest: { method: POST, path: "/client/v4/zones/{zone_id}/origin_tls_client_auth" } }
    class: credential
    resource: { arg: zone_id, kind: zone }
    card: "Upload an authenticated origin pull certificate and key to zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/origin-tls-client-auth-upload.http
        expect: credential
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.origin-tls-client-auth.delete
    match: { rest: { method: DELETE, path: "/client/v4/zones/{zone_id}/origin_tls_client_auth/{certificate_id}" } }
