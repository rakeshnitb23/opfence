# Cloudflare REST API (api.cloudflare.com/client/v4): r2-event-notification
operations:
  - id: cloudflare.r2-event-notification.set
    match: { rest: { method: PUT, path: "/client/v4/accounts/{account_id}/event_notifications/r2/{bucket_name}/configuration/queues/{queue_id}" } }
    class: write
    resource: { arg: bucket_name, kind: bucket }
    card: "Send events of R2 bucket {bucket_name} to queue {queue_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/r2-event-notification-set.http
        expect: write
        resource: "shop-assets"

  - id: cloudflare.r2-event-notification.delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/event_notifications/r2/{bucket_name}/configuration/queues/{queue_id}" } }
    class: delete
    resource: { arg: bucket_name, kind: bucket }
    card: "Delete event notification rules of R2 bucket {bucket_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/r2-event-notification-delete.http
        expect: delete
        resource: "shop-assets"
