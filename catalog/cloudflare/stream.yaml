  - id: cloudflare.stream.video-edit
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/stream/{identifier}" } }
    class: write
    when:
      - if: { arg: body.requireSignedURLs, equals: "false" }
        class: access
      - if: { arg: body.scheduledDeletion, present: true }
        class: irreversible
    resource: { arg: identifier, kind: video }
    card: "Change video {identifier}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      requireSignedURLs=false makes a private video public; scheduledDeletion
      makes Stream delete the video at that time.
    tests:
      - fixture: fixtures/stream-video-edit.http
        expect: write
        resource: "ea95132c15732412d22c1476fa83f27a"
      - fixture: fixtures/stream-video-edit-public.http
        expect: access
        resource: "ea95132c15732412d22c1476fa83f27a"
      - fixture: fixtures/stream-video-edit-scheduled-deletion.http
        expect: irreversible
        resource: "ea95132c15732412d22c1476fa83f27a"

