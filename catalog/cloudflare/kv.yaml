    resource: { arg: namespace_id, kind: kv-namespace }
    card: "Delete several keys from KV namespace {namespace_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      KV keeps no copy of deleted values.
    tests:
      - fixture: fixtures/kv-bulk-delete.http
        expect: irreversible
        resource: "0f2ac74b498b48028cb68387c421e279"

