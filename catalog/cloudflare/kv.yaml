# Cloudflare REST API (api.cloudflare.com/client/v4): kv
operations:
  - id: cloudflare.kv.bulk-write
    match: { rest: { method: PUT, path: "/client/v4/accounts/{account_id}/storage/kv/namespaces/{namespace_id}/bulk" } }
    class: write
    resource: { arg: namespace_id, kind: kv-namespace }
    card: "Write several keys to KV namespace {namespace_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Overwrites existing values, like any write to a store.
    tests:
      - fixture: fixtures/kv-bulk-write.http
        expect: write
        resource: "0f2ac74b498b48028cb68387c421e279"

  - id: cloudflare.kv.bulk-delete
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/storage/kv/namespaces/{namespace_id}/bulk/delete" } }
