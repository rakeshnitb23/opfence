  - id: cloudflare.ssl.certificate-pack-delete
    match: { rest: { method: DELETE, path: "/client/v4/zones/{zone_id}/ssl/certificate_packs/{certificate_pack_id}" } }
    class: delete
    resource: { arg: zone_id, kind: zone }
    card: "Delete certificate pack {certificate_pack_id} of zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Certificates can be ordered again; holds no data.
    tests:
      - fixture: fixtures/ssl-certificate-pack-delete.http
        expect: delete
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.ssl.universal-settings
