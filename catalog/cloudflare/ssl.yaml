# Cloudflare REST API (api.cloudflare.com/client/v4): ssl
operations:
  - id: cloudflare.ssl.analyze
    match: { rest: { method: POST, path: "/client/v4/zones/{zone_id}/ssl/analyze" } }
    class: read
    resource: { arg: zone_id, kind: zone }
    card: "Analyze a certificate for zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Only inspects the submitted certificate.
    tests:
      - fixture: fixtures/ssl-analyze.http
        expect: read
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.ssl.certificate-pack-order
    match: { rest: { method: POST, path: "/client/v4/zones/{zone_id}/ssl/certificate_packs/order" } }
    class: money
    resource: { arg: zone_id, kind: zone }
    card: "Order an Advanced Certificate Manager certificate pack for zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Advanced certificate packs are a paid Advanced Certificate Manager
      feature.
    tests:
      - fixture: fixtures/ssl-certificate-pack-order.http
        expect: money
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.ssl.certificate-pack-update
