# Cloudflare REST API (api.cloudflare.com/client/v4): worker-route
operations:
  - id: cloudflare.worker-route.create
    match: { rest: { method: POST, path: "/client/v4/zones/{zone_id}/workers/routes" } }
    class: access
    resource: { arg: zone_id, kind: zone }
    card: "Route {body.pattern} to Worker {body.script}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      A route puts a Worker in front of public traffic on the zone, so it is
      classed like exposing a service to the internet.
    tests:
      - fixture: fixtures/worker-route-create.http
        expect: access
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.worker-route.update
    match: { rest: { method: PUT, path: "/client/v4/zones/{zone_id}/workers/routes/{route_id}" } }
    class: access
    resource: { arg: zone_id, kind: zone }
    card: "Change Worker route {route_id} in zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/worker-route-update.http
        expect: access
        resource: "9f1839b6152d298aca64c4e906b6d074"

  - id: cloudflare.worker-route.delete
    match: { rest: { method: DELETE, path: "/client/v4/zones/{zone_id}/workers/routes/{route_id}" } }
    class: delete
    resource: { arg: zone_id, kind: zone }
    card: "Delete Worker route {route_id} in zone {zone_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      A route is a pattern and a script name; it can be recreated.
    tests:
      - fixture: fixtures/worker-route-delete.http
        expect: delete
        resource: "9f1839b6152d298aca64c4e906b6d074"
