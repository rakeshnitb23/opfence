# Cloudflare REST API (api.cloudflare.com/client/v4): worker-build
operations:
  - id: cloudflare.worker-build.token-create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/builds/tokens" } }
    class: credential
    resource: { arg: account_id, kind: account }
    card: "Store build token {body.build_token_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Stores an API token value that builds use to deploy.
    tests:
      - fixture: fixtures/worker-build-token-create.http
        expect: credential
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.worker-build.token-delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/builds/tokens/{build_token_uuid}" } }
    class: irreversible
    resource: { arg: account_id, kind: account }
    card: "Delete build token {build_token_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Deleting a stored secret is irreversible.
    tests:
      - fixture: fixtures/worker-build-token-delete.http
        expect: irreversible
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

