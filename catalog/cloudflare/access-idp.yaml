# Cloudflare REST API (api.cloudflare.com/client/v4): access-idp
operations:
  - id: cloudflare.access-idp.create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/access/identity_providers" } }
    class: access
    when:
      - if: { arg: body.config.client_secret, present: true }
        class: credential
    resource: { arg: account_id, kind: account }
    card: "Add Access identity provider {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Identity providers are how users log in (access). The config holds the
      OAuth client secret, so sending one stores a secret (credential).
    tests:
      - fixture: fixtures/access-idp-create.http
        expect: access
        resource: "023e105f4ecef8ad9ca31a8372d0c353"
      - fixture: fixtures/access-idp-create-secret.http
        expect: credential
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

