    resource: { arg: account_id, kind: account }
    card: "List Access identity providers with their configuration"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      The schema returns config.client_secret (not marked write-only for every
      provider type) and scim_config.secret; Opfence cannot see whether they are
      redacted, so listing identity providers is assumed to reveal secrets.
    tests:
      - fixture: fixtures/access-idp-list.http
        expect: credential
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

