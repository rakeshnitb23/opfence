# Cloudflare REST API (api.cloudflare.com/client/v4): image
operations:
  - id: cloudflare.image.upload
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/images/v1" } }
    class: write
    resource: { arg: account_id, kind: account }
    card: "Upload an image to account {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/image-upload.http
        expect: write
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.image.update
    match: { rest: { method: PATCH, path: "/client/v4/accounts/{account_id}/images/v1/{image_id}" } }
    class: write
    when:
      - if: { arg: body.requireSignedURLs, equals: "false" }
        class: access
    resource: { arg: image_id, kind: image }
    card: "Change image {image_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Setting requireSignedURLs to false makes a private image public.
    tests:
      - fixture: fixtures/image-update.http
        expect: write
        resource: "083eb7b2-5392-4565-b69e-aff66acddd00"
      - fixture: fixtures/image-update-public.http
        expect: access
        resource: "083eb7b2-5392-4565-b69e-aff66acddd00"

  - id: cloudflare.image.delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/images/v1/{image_id}" } }
    class: irreversible
    resource: { arg: image_id, kind: image }
    card: "Delete image {image_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Cloudflare Images keeps no copy of a deleted image.
    tests:
      - fixture: fixtures/image-delete.http
        expect: irreversible
        resource: "083eb7b2-5392-4565-b69e-aff66acddd00"

