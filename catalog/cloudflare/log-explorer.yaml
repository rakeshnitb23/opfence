  - id: cloudflare.log-explorer.account-dataset-delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/logs/explorer/datasets/{dataset_id}" } }
    class: irreversible
    resource: { arg: account_id, kind: account }
    card: "Delete Log Explorer dataset {dataset_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Assumed to delete the logs stored for the dataset; the schema does not say
      they are kept.
    tests:
      - fixture: fixtures/log-explorer-account-dataset-delete.http
        expect: irreversible
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.log-explorer.account-query
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/logs/explorer/query/sql" } }
    class: read
    resource: { arg: account_id, kind: account }
    card: "Run a Log Explorer query (account)"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    notes: >-
      Log Explorer only queries stored logs; the SQL is not Postgres and is not
      classified, but the endpoint cannot change data.
    tests:
      - fixture: fixtures/log-explorer-account-query.http
        expect: read
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

