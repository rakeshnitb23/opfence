# Cloudflare REST API (api.cloudflare.com/client/v4): log-explorer
operations:
  - id: cloudflare.log-explorer.account-dataset-create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/logs/explorer/datasets" } }
    class: write
    resource: { arg: account_id, kind: account }
    card: "Create a Log Explorer dataset (account)"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/log-explorer-account-dataset-create.http
        expect: write
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.log-explorer.account-dataset-update
