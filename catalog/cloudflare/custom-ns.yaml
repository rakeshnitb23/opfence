# Cloudflare REST API (api.cloudflare.com/client/v4): custom-ns
operations:
  - id: cloudflare.custom-ns.account-create
    match: { rest: { method: POST, path: "/client/v4/accounts/{account_id}/custom_ns" } }
    class: write
    resource: { arg: account_id, kind: account }
    card: "Add account custom nameserver {body.ns_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/custom-ns-account-create.http
        expect: write
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

  - id: cloudflare.custom-ns.account-delete
    match: { rest: { method: DELETE, path: "/client/v4/accounts/{account_id}/custom_ns/{custom_ns_id}" } }
    class: delete
    resource: { arg: account_id, kind: account }
    card: "Delete account custom nameserver {custom_ns_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/api-schemas/blob/main/openapi.json
    tests:
      - fixture: fixtures/custom-ns-account-delete.http
        expect: delete
        resource: "023e105f4ecef8ad9ca31a8372d0c353"

