# flyctl MCP server (fly mcp server): machine
operations:
  - id: flyio-mcp.machine.clone
    match: { mcp: { tool: fly-machine-clone } }
    class: money
    resource: { arg: app, kind: app }
    card: "Clone Machine {id} in app {app}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server/machine.go
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server.go
    notes: >-
      Creates a new billed Machine (and an empty volume when the
      original has one).
    tests:
      - fixture: fixtures/machine-clone.json
        expect: money
        resource: shop-api

  - id: flyio-mcp.machine.cordon
    match: { mcp: { tool: fly-machine-cordon } }
    class: write
    resource: { arg: app, kind: app }
    card: "Stop routing traffic to Machine {id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server/machine.go
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server.go
    tests:
      - fixture: fixtures/machine-cordon.json
        expect: write
        resource: shop-api

  - id: flyio-mcp.machine.create
