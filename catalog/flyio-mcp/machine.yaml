      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server.go
    notes: >-
      The root file system is ephemeral and volumes survive, so the
      Machine can be recreated from the app config.
    tests:
      - fixture: fixtures/machine-destroy.json
        expect: delete
        resource: shop-api

