# flyctl MCP server (fly mcp server): secrets
operations:
  - id: flyio-mcp.secrets.deploy
    match: { mcp: { tool: fly-secrets-deploy } }
    class: write
    resource: { arg: app, kind: app }
    card: "Deploy the staged secrets of app {app}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server/secrets.go
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server.go
    notes: >-
      Restarts Machines with the secrets already stored; setting and
      unsetting are classified on their own.
    tests:
      - fixture: fixtures/secrets-deploy.json
        expect: write
        resource: shop-api

  - id: flyio-mcp.secrets.list
    match: { mcp: { tool: fly-secrets-list } }
    class: read
    resource: { arg: app, kind: app }
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server/secrets.go
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server.go
    notes: >-
      fly secrets list shows names and digests, not values.
    tests:
      - fixture: fixtures/secrets-list.json
        expect: read
        resource: shop-api

  - id: flyio-mcp.secrets.set
    match: { mcp: { tool: fly-secrets-set } }
    class: credential
    resource: { arg: app, kind: app }
    card: "Set secrets on app {app}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server/secrets.go
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server.go
    tests:
      - fixture: fixtures/secrets-set.json
        expect: credential
        resource: shop-api

  - id: flyio-mcp.secrets.unset
    match: { mcp: { tool: fly-secrets-unset } }
    class: irreversible
    resource: { arg: app, kind: app }
    card: "Delete secrets {names} from app {app}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server/secrets.go
      - https://github.com/superfly/flyctl/blob/master/internal/command/mcp/server.go
    notes: >-
      Fly keeps no copy of deleted secret values.
    tests:
      - fixture: fixtures/secrets-unset.json
        expect: irreversible
        resource: shop-api
