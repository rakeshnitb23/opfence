  - id: turso.database.restore
    match: { rest: { method: POST, path: "/{version}/organizations/{organization}/databases/{database}/restore" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Restore deleted Turso database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/tursodatabase/turso-docs/blob/main/api-reference/openapi.json
      - https://github.com/tursodatabase/turso-docs/blob/main/features/recover-deleted-databases.mdx
    tests:
      - fixture: fixtures/database-restore.http
        expect: write
        resource: 0eb771dd-6906-11ee-8553-eaa7715aeaf2

  - id: turso.database.create-unscoped
    match: { rest: { method: POST, path: "/{version}/databases" } }
    class: write
    when:
      - if: { arg: body.remote_encryption, present: true }
        class: credential
    resource: { arg: body.name, kind: database }
    card: "Create Turso database {body.name}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/tursodatabase/turso-cli/blob/main/internal/turso/databases.go
    notes: >-
      The turso CLI calls this path without /organizations/{org} when no organization is
      selected (a personal account). Only the unscoped variants stricter than write are
      listed: any unlisted non-GET is already unknown.
    tests:
      - fixture: fixtures/database-create-unscoped.http
        expect: write
        resource: app-db
      - fixture: fixtures/database-create-unscoped-encrypted.http
        expect: credential
        resource: app-db

