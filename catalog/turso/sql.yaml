# Turso database HTTP API: SQL over HTTP on database hosts (*.turso.io)
operations:
  - id: turso.sql.pipeline
    match: { rest: { method: POST, path: "/{version}/pipeline" } }
    unlisted: "libSQL's HTTP protocol on database hosts, not part of the Platform API"
    class: unknown
    card: "Run SQL on a Turso database over HTTP"
    status: verified
    verified: 2026-10-21
    sources:
      - https://github.com/tursodatabase/libsql/blob/main/docs/HTTP_V2_SPEC.md
      - https://github.com/tursodatabase/libsql/blob/main/docs/HRANA_3_SPEC.md
    classify: { sql: body, format: libsql }
    notes: >-
      Hrana over HTTP (/v2/pipeline, /v3/pipeline, /v3-protobuf/pipeline) on a database
      host. Every statement the body runs is classified as SQLite: execute and sequence
      requests, batch steps, and store_sql texts (a later request on the stream can run one by
      its sql_id). A sql_id the same body did not store, a request type Opfence does not know,
      and the binary -protobuf bodies are unknown. A body that only closes the stream or reads
      the autocommit state is a read.
    tests:
      - fixture: fixtures/sql-pipeline.http
        expect: irreversible
      - fixture: fixtures/sql-pipeline-v3.http
        expect: read
      - fixture: fixtures/sql-pipeline-batch.http
        expect: delete
      - fixture: fixtures/sql-pipeline-stored.http
        expect: irreversible
      - fixture: fixtures/sql-pipeline-sql-id.http
        expect: unknown
      - fixture: fixtures/sql-pipeline-close.http
        expect: read
      - fixture: fixtures/sql-pipeline-protobuf.http
        expect: unknown

  - id: turso.sql.cursor
    match: { rest: { method: POST, path: "/{version}/cursor" } }
    unlisted: "libSQL's HTTP protocol on database hosts, not part of the Platform API"
    class: unknown
    card: "Run a batch of SQL on a Turso database over HTTP"
    status: verified
    verified: 2026-10-21
    sources:
      - https://github.com/tursodatabase/libsql/blob/main/docs/HRANA_3_SPEC.md
    classify: { sql: body, format: libsql }
    notes: >-
      Hrana 3 cursor endpoint (/v3/cursor, /v3-protobuf/cursor). Every step of the body's batch
      is classified as SQLite; a step that runs a sql_id stored by an earlier request on the
      stream, and the binary -protobuf bodies, are unknown.
    tests:
      - fixture: fixtures/sql-cursor.http
        expect: irreversible
      - fixture: fixtures/sql-cursor-read.http
        expect: read

  - id: turso.sql.batch
    match: { rest: { method: POST, path: "/" } }
    unlisted: "libSQL's HTTP protocol on database hosts, not part of the Platform API"
    class: unknown
    card: "Run a batch of SQL on a Turso database over the legacy HTTP API"
    status: verified
    verified: 2026-10-21
    sources:
      - https://github.com/tursodatabase/libsql/blob/main/docs/http_api.md
    classify: { sql: body, format: libsql }
    notes: >-
      The original sqld HTTP API: POST / with a statements array of SQL texts or {q, params}
      objects, each classified as SQLite. SQLite ends a block comment at the first */, so
      '/* /* */ DROP TABLE users; -- */ SELECT 1' drops the table, and is classified so.
    tests:
      - fixture: fixtures/sql-batch.http
        expect: irreversible
      - fixture: fixtures/sql-batch-read.http
        expect: read
      - fixture: fixtures/sql-batch-comment.http
        expect: irreversible
