# Turso Platform API: groups
operations:
  - id: turso.group.create
    match: { rest: { method: POST, path: "/{version}/organizations/{organization}/groups" } }
    class: write
    resource: { arg: body.name, kind: group }
    card: "Create Turso group {body.name} in {body.location}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/tursodatabase/turso-docs/blob/main/api-reference/openapi.json
      - https://github.com/tursodatabase/turso-cli/blob/main/internal/turso/groups.go
    tests:
      - fixture: fixtures/group-create.http
        expect: write
        resource: prod

  - id: turso.group.delete
    match: { rest: { method: DELETE, path: "/{version}/organizations/{organization}/groups/{group}" } }
    class: irreversible
    resource: { arg: group, kind: group }
    card: "Delete Turso group {group} and every database in it"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/tursodatabase/turso-docs/blob/main/api-reference/openapi.json
      - https://github.com/tursodatabase/turso-cli/blob/main/internal/turso/groups.go
      - https://github.com/tursodatabase/turso-docs/blob/main/features/recover-deleted-databases.mdx
    notes: >-
      Deleting a group deletes all of its databases. Turso keeps a deleted group restorable
      for five days, but only on a paid plan, for an admin or owner, and only while the
      organization's recovery setting is on. Opfence cannot see the plan or that setting, so
      the delete is irreversible.
    tests:
      - fixture: fixtures/group-delete.http
        expect: irreversible
        resource: prod

  - id: turso.group.configure
    match: { rest: { method: PATCH, path: "/{version}/organizations/{organization}/groups/{group}/configuration" } }
    class: write
    when:
      - if: { arg: body.delete_protection, equals: "false" }
        class: irreversible
    resource: { arg: group, kind: group }
    card: "Change configuration of Turso group {group}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/tursodatabase/turso-docs/blob/main/api-reference/openapi.json
      - https://github.com/tursodatabase/turso-cli/blob/main/internal/turso/groups.go
    notes: >-
      Turning delete_protection off removes the guard against deleting the group and all its
      databases (safety-net convention).
    tests:
      - fixture: fixtures/group-configure.http
        expect: write
        resource: prod
      - fixture: fixtures/group-configure-protection-off.http
        expect: irreversible
        resource: prod

  - id: turso.group.transfer
    match: { rest: { method: POST, path: "/{version}/organizations/{organization}/groups/{group}/transfer" } }
    class: access
    resource: { arg: group, kind: group }
    card: "Transfer Turso group {group} to organization {body.organization}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/tursodatabase/turso-docs/blob/main/api-reference/openapi.json
      - https://github.com/tursodatabase/turso-cli/blob/main/internal/turso/groups.go
    notes: >-
      Moves the group and its databases to another organization the caller belongs to: that
      organization's members get the data and this one loses it. Nothing is deleted and it
      can be transferred back, so it is access rather than irreversible.
    tests:
      - fixture: fixtures/group-transfer.http
        expect: access
        resource: prod

  - id: turso.group.unarchive
    match: { rest: { method: POST, path: "/{version}/organizations/{organization}/groups/{group}/unarchive" } }
    class: write
    resource: { arg: group, kind: group }
