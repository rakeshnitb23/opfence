    resource: { arg: bucket, kind: bucket }
    card: "Upload {query.name} to Cloud Storage bucket {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    notes: >-
      Overwrites the object if there is one, as S3's PutObject does. A public predefined ACL or an
      ACL in the body is access.
    tests:
      - fixture: fixtures/objects-insert.http
        expect: write
        resource: "acme-uploads"
      - fixture: fixtures/objects-insert-when1.http
        expect: access
        resource: "acme-uploads"

