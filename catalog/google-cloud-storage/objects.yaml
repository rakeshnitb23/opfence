# Google Cloud Storage JSON API: objects.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-storage.objects.bulk-restore
    match: { rest: { method: POST, path: "/storage/v1/b/{bucket}/o/bulkRestore" } }
    class: write
    resource: { arg: bucket, kind: bucket }
    card: "Bulk restore of Cloud Storage object {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    tests:
      - fixture: fixtures/objects-bulk-restore.http
        expect: write
        resource: "acme-uploads"

  - id: google-cloud-storage.objects.compose
    match: { rest: { method: POST, path: "/storage/v1/b/{destinationBucket}/o/{destinationObject}/compose" } }
    class: write
    when:
      - if: { arg: query.destinationPredefinedAcl, matches: "(?i)^(publicRead|publicReadWrite|authenticatedRead|bucketOwnerRead)$" }
        class: access
    resource: { arg: destinationBucket, kind: destinationBucket }
    card: "Compose {destinationObject} in Cloud Storage bucket {destinationBucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    notes: >-
      A public predefined ACL is access.
    tests:
      - fixture: fixtures/objects-compose.http
        expect: write
        resource: "destinationbucket-1"
      - fixture: fixtures/objects-compose-when1.http
        expect: access
        resource: "destinationbucket-1"

  - id: google-cloud-storage.objects.copy
    match: { rest: { method: POST, path: "/storage/v1/b/{sourceBucket}/o/{sourceObject}/copyTo/b/{destinationBucket}/o/{destinationObject}" } }
    class: write
    when:
      - if: { arg: query.destinationPredefinedAcl, matches: "(?i)^(publicRead|publicReadWrite|authenticatedRead|bucketOwnerRead)$" }
        class: access
    resource: { arg: sourceBucket, kind: sourceBucket }
    card: "Copy {sourceObject} from bucket {sourceBucket} to {destinationObject} in bucket {destinationBucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    notes: >-
      Overwrites the destination object if there is one, as S3's CopyObject does. A public
      predefined ACL is access.
    tests:
      - fixture: fixtures/objects-copy.http
        expect: write
        resource: "sourcebucket-1"
      - fixture: fixtures/objects-copy-when1.http
        expect: access
        resource: "sourcebucket-1"

  - id: google-cloud-storage.objects.delete
    match: { rest: { method: DELETE, path: "/storage/v1/b/{bucket}/o/{object}" } }
    class: irreversible
    resource: { arg: bucket, kind: bucket }
    card: "Delete {object} from Cloud Storage bucket {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    notes: >-
      Opfence cannot see whether the bucket keeps soft-deleted or noncurrent versions, so a deleted
      object counts as gone, as for S3.
    tests:
      - fixture: fixtures/objects-delete.http
        expect: irreversible
        resource: "acme-uploads"
      - fixture: fixtures/objects-delete-batch.http
        expect: irreversible
        resource: "acme-uploads"

