# Google Cloud Storage JSON API: rapid caches.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-storage.rapid-caches.disable
    match: { rest: { method: POST, path: "/storage/v1/b/{bucket}/rapidCaches/{rapidCache}/disable" } }
    class: write
    resource: { arg: bucket, kind: bucket }
    card: "Disable Cloud Storage Rapid Cache {rapidCache} of bucket {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    tests:
      - fixture: fixtures/rapid-caches-disable.http
        expect: write
        resource: "acme-uploads"

  - id: google-cloud-storage.rapid-caches.insert
    match: { rest: { method: POST, path: "/storage/v1/b/{bucket}/rapidCaches" } }
    class: money
    resource: { arg: bucket, kind: bucket }
    card: "Create Cloud Storage Rapid Cache in bucket {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    notes: >-
      Rapid Cache instances are billed.
    tests:
      - fixture: fixtures/rapid-caches-insert.http
        expect: money
        resource: "acme-uploads"

  - id: google-cloud-storage.rapid-caches.update
    match: { rest: { method: PATCH, path: "/storage/v1/b/{bucket}/rapidCaches/{rapidCache}" } }
    class: write
    resource: { arg: bucket, kind: bucket }
    card: "Change Cloud Storage Rapid Cache {rapidCache} of bucket {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    tests:
      - fixture: fixtures/rapid-caches-update.http
        expect: write
        resource: "acme-uploads"
