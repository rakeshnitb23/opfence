# Google Cloud Storage JSON API: default object access controls.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-storage.default-object-access-controls.delete
    match: { rest: { method: DELETE, path: "/storage/v1/b/{bucket}/defaultObjectAcl/{entity}" } }
    class: access
    resource: { arg: bucket, kind: bucket }
    card: "Delete Cloud Storage default object ACL entry {entity} of bucket {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    notes: >-
      Access control lists decide who can read and write the bucket's objects.
    tests:
      - fixture: fixtures/default-object-access-controls-delete.http
        expect: access
        resource: "acme-uploads"

