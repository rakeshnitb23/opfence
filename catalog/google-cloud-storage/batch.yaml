# Google Cloud Storage JSON API: batch.
operations:
  - id: google-cloud-storage.batch.send
    match: { rest: { method: POST, path: "/batch/storage/v1" } }
    class: irreversible
    card: "Send a batch of Cloud Storage requests"
    unlisted: "The batch endpoint is documented apart from the discovery document."
    status: verified
    verified: 2026-10-23
    sources:
      - https://cloud.google.com/storage/docs/json_api
    notes: >-
      A batch carries other requests in a multipart body, which Opfence does not read; one of them
      can delete objects.
    tests:
      - fixture: fixtures/batch-send.http
        expect: irreversible
