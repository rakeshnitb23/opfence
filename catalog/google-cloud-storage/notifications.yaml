# Google Cloud Storage JSON API: notifications.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-storage.notifications.delete
    match: { rest: { method: DELETE, path: "/storage/v1/b/{bucket}/notificationConfigs/{notification}" } }
    class: delete
    resource: { arg: bucket, kind: bucket }
    card: "Delete Cloud Storage notification {notification} of bucket {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    tests:
      - fixture: fixtures/notifications-delete.http
        expect: delete
        resource: "acme-uploads"

  - id: google-cloud-storage.notifications.insert
    match: { rest: { method: POST, path: "/storage/v1/b/{bucket}/notificationConfigs" } }
    class: write
    resource: { arg: bucket, kind: bucket }
    card: "Create Cloud Storage notification in bucket {bucket}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    tests:
      - fixture: fixtures/notifications-insert.http
        expect: write
        resource: "acme-uploads"
