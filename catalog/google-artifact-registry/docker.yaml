# Docker's registry protocol (the OCI distribution spec), written by hand.
operations:
  - id: google-artifact-registry.docker.manifests-put-2
    match: { rest: { method: PUT, path: "/v2/{project}/{image}/manifests/{reference}" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Push image {project}/{image}:{reference}"
    unlisted: "Docker's registry protocol, which Google documents apart from its discovery documents"
    status: verified
    verified: 2026-10-24
    sources:
      - https://github.com/opencontainers/distribution-spec/blob/main/spec.md
    notes: >-
      Pushing a tag replaces the image it named.
    tests:
      - fixture: fixtures/docker-manifests-put-2.http
        expect: write
        resource: "acme-prod"

  - id: google-artifact-registry.docker.manifests-delete-2
    match: { rest: { method: DELETE, path: "/v2/{project}/{image}/manifests/{reference}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete image {project}/{image}:{reference}"
    unlisted: "Docker's registry protocol, which Google documents apart from its discovery documents"
    status: verified
    verified: 2026-10-24
    sources:
      - https://github.com/opencontainers/distribution-spec/blob/main/spec.md
    notes: >-
      An image can be pushed again from where it was built.
    tests:
      - fixture: fixtures/docker-manifests-delete-2.http
        expect: delete
        resource: "acme-prod"

  - id: google-artifact-registry.docker.uploads-start-2
    match: { rest: { method: POST, path: "/v2/{project}/{image}/blobs/uploads" } }
    class: read
    resource: { arg: project, kind: project }
    card: "Start uploading a layer of {project}/{image}"
    unlisted: "Docker's registry protocol, which Google documents apart from its discovery documents"
    status: verified
    verified: 2026-10-24
    sources:
      - https://github.com/opencontainers/distribution-spec/blob/main/spec.md
    notes: >-
      A layer is stored by its digest and changes no tag, so uploading one is a read; pushing the
      manifest, which names the tag, is the write.
    tests:
      - fixture: fixtures/docker-uploads-start-2.http
        expect: read
        resource: "acme-prod"

