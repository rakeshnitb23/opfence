# Notion MCP (remote): workspace, users and tool access
operations:
  - id: notion-mcp.workspace.self
    match: { mcp: { tool: notion-get-self } }
    class: read
    card: "Show the connected Notion workspace and user"
    status: verified
    verified: 2026-10-19
    sources:
      - https://developers.notion.com/docs/mcp-supported-tools
    notes: >-
      Remote server; its source is not published, so the name and behaviour
      come from Notion's tool reference.
    tests:
      - fixture: fixtures/workspace-self.http
        expect: read

