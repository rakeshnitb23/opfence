  - id: notion-mcp.agent-session.stop
    match: { mcp: { tool: notion-stop-session } }
    class: write
    resource: { arg: session_url, kind: session }
    card: "Stop Notion agent session {session_url}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://developers.notion.com/docs/mcp-supported-tools
    notes: >-
      Stops the current run; what the agent already did stays done. Remote
