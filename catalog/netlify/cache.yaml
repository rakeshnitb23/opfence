# Netlify REST API: CDN cache
operations:
  - id: netlify.cache.purge
    match: { rest: { method: POST, path: "/api/v1/purge" } }
    class: delete
    resource: { arg: body.site_id, kind: site }
    card: "Purge the CDN cache of Netlify site {body.site_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      Cached content is rebuilt from the origin, which then takes every
      request at once.
    tests:
      - fixture: fixtures/cache-purge.http
        expect: delete
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f
