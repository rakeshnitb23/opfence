provider: netlify
title: Netlify
docs: https://open-api.netlify.com/
hosts: [api.netlify.com]
auth:
  - header: Authorization
    scheme: Bearer
detect:
  # NETLIFY_AUTH_TOKEN: the Netlify CLI. NETLIFY_PERSONAL_ACCESS_TOKEN: the
  # official MCP server (@netlify/mcp) when it runs locally and calls this API.
  env: [NETLIFY_AUTH_TOKEN, NETLIFY_PERSONAL_ACCESS_TOKEN]
defaults:
  rest_safe_methods: read          # GETs only read, except the ones listed as credential
# Every path is under the API's /api/v1 base path. Rules come from the OpenAPI
# file (netlify/open-api swagger.yml); the few endpoints it leaves out (PUT on a
# site, Blobs, observability queries, certificate renewal) cite the official
# client that calls them or the OpenAPI text that names them.
