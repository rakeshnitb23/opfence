# Netlify REST API: notification hooks
operations:
  - id: netlify.hook.list
    match: { rest: { method: GET, path: "/api/v1/hooks" } }
    class: credential
    resource: { arg: query.site_id, kind: site }
    card: "Read the notification hooks of Netlify site {query.site_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      A hook's data holds where events go: Slack webhook URLs, outgoing
      webhook URLs and their signing secret, so reading hooks reads
      secrets.
    tests:
      - fixture: fixtures/hook-list.http
        expect: credential
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f

  - id: netlify.hook.get
    match: { rest: { method: GET, path: "/api/v1/hooks/{hook_id}" } }
    class: credential
    resource: { arg: hook_id, kind: hook }
    card: "Read notification hook {hook_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      A hook's data holds where events go: Slack webhook URLs, outgoing
      webhook URLs and their signing secret, so reading hooks reads
      secrets.
    tests:
      - fixture: fixtures/hook-get.http
        expect: credential
        resource: 64f0c8d9e0a1b2c3d4e5f678

  - id: netlify.hook.create
    match: { rest: { method: POST, path: "/api/v1/hooks" } }
    class: write
    resource: { arg: query.site_id, kind: site }
    card: "Send {body.event} events of Netlify site {query.site_id} to a {body.type} hook"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    tests:
      - fixture: fixtures/hook-create.http
        expect: write
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f

  - id: netlify.hook.update
    match: { rest: { method: PUT, path: "/api/v1/hooks/{hook_id}" } }
    class: write
    resource: { arg: hook_id, kind: hook }
    card: "Change notification hook {hook_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    tests:
      - fixture: fixtures/hook-update.http
        expect: write
        resource: 64f0c8d9e0a1b2c3d4e5f678

  - id: netlify.hook.delete
    match: { rest: { method: DELETE, path: "/api/v1/hooks/{hook_id}" } }
    class: delete
    resource: { arg: hook_id, kind: hook }
    card: "Delete notification hook {hook_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      The hook can be set up again with the same target.
    tests:
      - fixture: fixtures/hook-delete.http
        expect: delete
        resource: 64f0c8d9e0a1b2c3d4e5f678

  - id: netlify.hook.enable
    match: { rest: { method: POST, path: "/api/v1/hooks/{hook_id}/enable" } }
    class: write
    resource: { arg: hook_id, kind: hook }
    card: "Enable notification hook {hook_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    tests:
      - fixture: fixtures/hook-enable.http
        expect: write
        resource: 64f0c8d9e0a1b2c3d4e5f678
