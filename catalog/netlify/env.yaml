# Netlify REST API: environment variables
operations:
  - id: netlify.env.list
    match: { rest: { method: GET, path: "/api/v1/accounts/{account_id}/env" } }
    class: credential
    resource: { arg: account_id, kind: account }
    card: "Read the environment variables of team {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      Returns every variable with its values. Netlify withholds the values
      of variables marked is_secret, but plain variables routinely hold
      API keys too.
    tests:
      - fixture: fixtures/env-list.http
        expect: credential
        resource: 5e8f9a0b1c2d3e4f5a6b7c8d

  - id: netlify.env.get
    match: { rest: { method: GET, path: "/api/v1/accounts/{account_id}/env/{key}" } }
    class: credential
    resource: { arg: account_id, kind: account }
    card: "Read the value of environment variable {key} in team {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      Returns every variable with its values. Netlify withholds the values
      of variables marked is_secret, but plain variables routinely hold
      API keys too.
    tests:
      - fixture: fixtures/env-get.http
        expect: credential
        resource: 5e8f9a0b1c2d3e4f5a6b7c8d

  - id: netlify.env.list-for-site
    match: { rest: { method: GET, path: "/api/v1/sites/{site_id}/env" } }
    unlisted: "the OpenAPI file writes this path with /api/v1 twice"
    class: credential
    resource: { arg: site_id, kind: site }
    card: "Read the environment variables of Netlify site {site_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
      - https://github.com/netlify/netlify-mcp/blob/main/src/tools/project-tools/manage-project-env-vars.ts
    notes: >-
      The OpenAPI file writes this path as /api/v1/sites/{site_id}/env
      under the /api/v1 base path; the server and the official MCP server
      use /api/v1/sites/{site_id}/env. Returns every variable with its
      values. Netlify withholds the values of variables marked is_secret,
      but plain variables routinely hold API keys too.
    tests:
      - fixture: fixtures/env-list-for-site.http
        expect: credential
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f

  - id: netlify.env.create
    match: { rest: { method: POST, path: "/api/v1/accounts/{account_id}/env" } }
    class: write
    when:
      - if: { arg: body.is_secret, equals: "true" }
        class: credential
    resource: { arg: account_id, kind: account }
    card: "Create environment variables {body.key} in team {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      Creating a plain variable is a write; a variable with is_secret is a
      secret, so creating one is credential. The body is a list, and any
      secret in it counts.
    tests:
      - fixture: fixtures/env-create.http
        expect: write
        resource: 5e8f9a0b1c2d3e4f5a6b7c8d
      - fixture: fixtures/env-create-secret.http
        expect: credential
        resource: 5e8f9a0b1c2d3e4f5a6b7c8d

  - id: netlify.env.update
    match: { rest: { method: PUT, path: "/api/v1/accounts/{account_id}/env/{key}" } }
    class: credential
    resource: { arg: account_id, kind: account }
    card: "Replace environment variable {key} and all its values in team {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      Replaces an existing variable's values. Whether that variable is a
      secret is not in the request, so the worse case applies.
    tests:
      - fixture: fixtures/env-update.http
        expect: credential
        resource: 5e8f9a0b1c2d3e4f5a6b7c8d

  - id: netlify.env.set-value
    match: { rest: { method: PATCH, path: "/api/v1/accounts/{account_id}/env/{key}" } }
    class: credential
    resource: { arg: account_id, kind: account }
    card: "Set a value of environment variable {key} in team {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      Sets one context's value of an existing variable. Whether that
      variable is a secret is not in the request, so the worse case
      applies.
    tests:
      - fixture: fixtures/env-set-value.http
        expect: credential
        resource: 5e8f9a0b1c2d3e4f5a6b7c8d

  - id: netlify.env.delete
    match: { rest: { method: DELETE, path: "/api/v1/accounts/{account_id}/env/{key}" } }
    class: irreversible
    resource: { arg: account_id, kind: account }
    card: "Delete environment variable {key} from team {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      Netlify does not keep deleted values.
    tests:
      - fixture: fixtures/env-delete.http
        expect: irreversible
        resource: 5e8f9a0b1c2d3e4f5a6b7c8d

  - id: netlify.env.delete-value
    match: { rest: { method: DELETE, path: "/api/v1/accounts/{account_id}/env/{key}/value/{id}" } }
    class: irreversible
    resource: { arg: account_id, kind: account }
    card: "Delete value {id} of environment variable {key} in team {account_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      Netlify does not keep deleted values.
    tests:
      - fixture: fixtures/env-delete-value.http
        expect: irreversible
        resource: 5e8f9a0b1c2d3e4f5a6b7c8d
