    notes: >-
      A Git-based deploy can be rebuilt from its commit and a CLI deploy
      from the local files, but its unique URL and build output are gone.
    tests:
      - fixture: fixtures/deploy-delete.http
        expect: delete
        resource: 6528a1b2c3d4e5f6a7b8c9d0

