# Netlify REST API: deploys
operations:
  - id: netlify.deploy.create
    match: { rest: { method: POST, path: "/api/v1/sites/{site_id}/deploys" } }
    class: write
    when:
      - if: { arg: body.environment.is_secret, equals: "true" }
        class: credential
    resource: { arg: site_id, kind: site }
    card: "Deploy Netlify site {site_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      environment sets deploy-specific variables; one marked is_secret is
      a secret. A zip sent as the raw body cannot be read, so such a
      request is unknown.
    tests:
      - fixture: fixtures/deploy-create.http
        expect: write
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f
      - fixture: fixtures/deploy-create-secret-env.http
        expect: credential
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f

  - id: netlify.deploy.update
    match: { rest: { method: PUT, path: "/api/v1/sites/{site_id}/deploys/{deploy_id}" } }
    class: write
    when:
      - if: { arg: body.environment.is_secret, equals: "true" }
        class: credential
    resource: { arg: site_id, kind: site }
    card: "Update deploy {deploy_id} of Netlify site {site_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    tests:
      - fixture: fixtures/deploy-update.http
        expect: write
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f
      - fixture: fixtures/deploy-update-secret-env.http
        expect: credential
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f

  - id: netlify.deploy.delete-for-site
    match: { rest: { method: DELETE, path: "/api/v1/sites/{site_id}/deploys/{deploy_id}" } }
    class: delete
    resource: { arg: site_id, kind: site }
    card: "Delete deploy {deploy_id} of Netlify site {site_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/netlify/open-api/blob/master/swagger.yml
    notes: >-
      A Git-based deploy can be rebuilt from its commit and a CLI deploy
      from the local files, but its unique URL and build output are gone.
    tests:
      - fixture: fixtures/deploy-delete-for-site.http
        expect: delete
        resource: 3f1c2a9e-7b4d-4c1a-9e2f-6a8b0c1d2e3f

  - id: netlify.deploy.delete
    match: { rest: { method: DELETE, path: "/api/v1/deploys/{deploy_id}" } }
    class: delete
    resource: { arg: deploy_id, kind: deploy }
    card: "Delete Netlify deploy {deploy_id}"
    status: verified
    verified: 2026-10-18
    sources:
