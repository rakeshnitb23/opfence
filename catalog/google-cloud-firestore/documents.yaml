# Google Cloud Firestore: documents.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-firestore.documents.batch-get
    match: { rest: { method: POST, path: "/v1/projects/{project}/databases/{database}/documents:batchGet" } }
    class: read
    resource: { arg: project, kind: project }
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/firestore/v1/rest
    notes: >-
      Reads documents.
    tests:
      - fixture: fixtures/documents-batch-get.http
        expect: read
        resource: "acme-prod"

  - id: google-cloud-firestore.documents.batch-write
    match: { rest: { method: POST, path: "/v1/projects/{project}/databases/{database}/documents:batchWrite" } }
    class: write
    when:
      - if: { arg: body.writes.delete, present: true }
        class: irreversible
    resource: { arg: project, kind: project }
    card: "Batch write of Firestore document {database} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/firestore/v1/rest
    notes: >-
      A write that deletes documents is irreversible, unless point-in-time recovery is on, which
      Opfence cannot see.
    tests:
      - fixture: fixtures/documents-batch-write.http
        expect: write
        resource: "acme-prod"
      - fixture: fixtures/documents-batch-write-when1.http
        expect: irreversible
        resource: "acme-prod"

