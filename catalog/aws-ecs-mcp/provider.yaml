provider: aws-ecs-mcp
title: Amazon ECS MCP
docs: https://github.com/awslabs/mcp/tree/main/src/ecs-mcp-server
# AWS Labs' Amazon ECS MCP server (PyPI awslabs.ecs-mcp-server, source
# github.com/awslabs/mcp src/ecs-mcp-server), read at version 0.1.37 (commit
# d534d0f, 2026-10-16). It runs locally over stdio and calls the ECS, ECR,
# CloudFormation, IAM and CloudWatch Logs APIs (catalog/aws) with the user's
# credentials, and builds images with the local Docker. Write tools need
# ALLOW_WRITE=true, and logs, events and unredacted task definitions need
# ALLOW_SENSITIVE_DATA=true; Opfence cannot see either, so rules keep the
# class of what a call can do. It also proxies three tools of AWS's hosted
# Knowledge MCP server (knowledge-mcp.global.api.aws) under an aws_knowledge_
# prefix. The infrastructure and deployment-status modules in the source are
# not registered in this release. No hosts; the agent hook sees the tool calls.
# The README keys it "awslabs.ecs-mcp-server", which Claude Code writes as
# "awslabs_ecs-mcp-server" (no dots in tool names).
# No detect or auth block: AWS credentials belong to catalog/aws.
# Fixtures are .json tool calls (tool + arguments).
mcp:
  names: [awslabs_ecs-mcp-server, ecs-mcp-server, aws-ecs]
  package: "awslabs.ecs-mcp-server"
