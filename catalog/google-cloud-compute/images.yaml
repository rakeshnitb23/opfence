# Google Compute Engine: images.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.images.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/global/images/{image}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine image {image} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      A deleted image cannot be restored.
    tests:
      - fixture: fixtures/images-delete.http
        expect: irreversible
        resource: "acme-prod"

