# Google Compute Engine: global vm extension policies.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.global-vm-extension-policies.delete
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/vmExtensionPolicies/{globalVmExtensionPolicy}/delete" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine vm extension policy {globalVmExtensionPolicy} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/global-vm-extension-policies-delete.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-compute.global-vm-extension-policies.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/vmExtensionPolicies" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Create Compute Engine vm extension policy {body.name} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Installs extensions, programs that run on matching VMs; running code on a VM can do anything
      it can.
    tests:
      - fixture: fixtures/global-vm-extension-policies-insert.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-compute.global-vm-extension-policies.update
    match: { rest: { method: PATCH, path: "/compute/{apiVersion}/projects/{project}/global/vmExtensionPolicies/{globalVmExtensionPolicy}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Change Compute Engine vm extension policy {globalVmExtensionPolicy} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Installs extensions, programs that run on matching VMs; running code on a VM can do anything
      it can.
    tests:
      - fixture: fixtures/global-vm-extension-policies-update.http
        expect: irreversible
        resource: "acme-prod"
