    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/nodeGroups/{nodeGroup}/addNodes" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Add nodes to Compute Engine node group {nodeGroup} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Sole-tenant nodes are billed.
    tests:
      - fixture: fixtures/node-groups-add-nodes.http
