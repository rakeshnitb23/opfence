# Google Compute Engine: licenses.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.licenses.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/global/licenses/{license}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine license {license} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/licenses-delete.http
        expect: delete
        resource: "acme-prod"

  - id: google-cloud-compute.licenses.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/licenses" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Create Compute Engine license {body.name} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/licenses-insert.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-compute.licenses.set-iam-policy
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/licenses/{resource}/setIamPolicy" } }
    class: access
    resource: { arg: project, kind: project }
    card: "Change who can access Compute Engine license {resource} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Decides who can use the resource, and can share it with other projects or everyone.
    tests:
      - fixture: fixtures/licenses-set-iam-policy.http
        expect: access
        resource: "acme-prod"

  - id: google-cloud-compute.licenses.test-iam-permissions
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/licenses/{resource}/testIamPermissions" } }
    class: read
    resource: { arg: project, kind: project }
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Reports the caller's permissions; changes nothing.
    tests:
      - fixture: fixtures/licenses-test-iam-permissions.http
        expect: read
        resource: "acme-prod"

  - id: google-cloud-compute.licenses.update
    match: { rest: { method: PATCH, path: "/compute/{apiVersion}/projects/{project}/global/licenses/{license}" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Change Compute Engine license {license} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/licenses-update.http
        expect: write
        resource: "acme-prod"
