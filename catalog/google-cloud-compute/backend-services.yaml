    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/backendServices/{backendService}/addSignedUrlKey" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Add signed url key to Compute Engine backend service {backendService} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Adds a signing key; whoever holds it can sign URLs to the service's content.
    tests:
      - fixture: fixtures/backend-services-add-signed-url-key.http
        expect: credential
        resource: "acme-prod"

