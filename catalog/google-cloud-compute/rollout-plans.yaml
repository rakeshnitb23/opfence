# Google Compute Engine: rollout plans.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.rollout-plans.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/global/rolloutPlans/{rolloutPlan}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine rollout plan {rolloutPlan} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/rollout-plans-delete.http
        expect: delete
        resource: "acme-prod"

  - id: google-cloud-compute.rollout-plans.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/rolloutPlans" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Create Compute Engine rollout plan {body.name} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/rollout-plans-insert.http
        expect: write
        resource: "acme-prod"
