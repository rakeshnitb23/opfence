# Google Compute Engine: instance settings.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.instance-settings.patch
    match: { rest: { method: PATCH, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/instanceSettings" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Change Compute Engine instance setting ({zone}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Instance settings hold metadata for every VM in the zone. Metadata holds startup scripts,
      which run as root when a VM boots, and SSH keys, which let their holders log in; running
      commands on a VM can do anything it can.
    tests:
      - fixture: fixtures/instance-settings-patch.http
        expect: irreversible
        resource: "acme-prod"
