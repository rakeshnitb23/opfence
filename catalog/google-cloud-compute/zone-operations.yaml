# Google Compute Engine: zone operations.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.zone-operations.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/operations/{operation}" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine operation {operation} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Deletes the record of an operation, not what it did.
    tests:
      - fixture: fixtures/zone-operations-delete.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-compute.zone-operations.wait
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/operations/{operation}/wait" } }
    class: read
    resource: { arg: project, kind: project }
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Waits for an operation; changes nothing.
    tests:
      - fixture: fixtures/zone-operations-wait.http
        expect: read
        resource: "acme-prod"
