# Google Compute Engine: interconnects.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.interconnects.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/global/interconnects/{interconnect}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine interconnect {interconnect} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/interconnects-delete.http
        expect: delete
        resource: "acme-prod"

  - id: google-cloud-compute.interconnects.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/interconnects" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Create Compute Engine interconnect {body.name} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Interconnects are billed.
    tests:
      - fixture: fixtures/interconnects-insert.http
        expect: money
        resource: "acme-prod"

  - id: google-cloud-compute.interconnects.patch
    match: { rest: { method: PATCH, path: "/compute/{apiVersion}/projects/{project}/global/interconnects/{interconnect}" } }
    class: write
