      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/interconnects-patch.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-compute.interconnects.set-labels
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/interconnects/{resource}/setLabels" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Set labels of Compute Engine interconnect {resource} in project {project}"
    status: verified
