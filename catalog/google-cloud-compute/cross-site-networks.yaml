# Google Compute Engine: cross site networks.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.cross-site-networks.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/global/crossSiteNetworks/{crossSiteNetwork}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine cross site network {crossSiteNetwork} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/cross-site-networks-delete.http
        expect: delete
        resource: "acme-prod"

  - id: google-cloud-compute.cross-site-networks.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/crossSiteNetworks" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Create Compute Engine cross site network {body.name} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Cross-Site Interconnect is billed.
    tests:
      - fixture: fixtures/cross-site-networks-insert.http
        expect: money
        resource: "acme-prod"

  - id: google-cloud-compute.cross-site-networks.patch
    match: { rest: { method: PATCH, path: "/compute/{apiVersion}/projects/{project}/global/crossSiteNetworks/{crossSiteNetwork}" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Change Compute Engine cross site network {crossSiteNetwork} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/cross-site-networks-patch.http
        expect: write
        resource: "acme-prod"
