# Google Compute Engine: storage pools.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.storage-pools.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/storagePools/{storagePool}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine storage pool {storagePool} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Counted as irreversible in case disks remain in the pool.
    tests:
      - fixture: fixtures/storage-pools-delete.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-compute.storage-pools.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/storagePools" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Create Compute Engine storage pool {body.name} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Provisioned capacity is billed.
    tests:
      - fixture: fixtures/storage-pools-insert.http
        expect: money
        resource: "acme-prod"

  - id: google-cloud-compute.storage-pools.set-iam-policy
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/storagePools/{resource}/setIamPolicy" } }
    class: access
    resource: { arg: project, kind: project }
    card: "Change who can access Compute Engine storage pool {resource} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Decides who can use the resource, and can share it with other projects or everyone.
    tests:
      - fixture: fixtures/storage-pools-set-iam-policy.http
        expect: access
        resource: "acme-prod"

  - id: google-cloud-compute.storage-pools.test-iam-permissions
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/storagePools/{resource}/testIamPermissions" } }
    class: read
    resource: { arg: project, kind: project }
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Reports the caller's permissions; changes nothing.
    tests:
      - fixture: fixtures/storage-pools-test-iam-permissions.http
        expect: read
        resource: "acme-prod"

  - id: google-cloud-compute.storage-pools.update
    match: { rest: { method: PATCH, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/storagePools/{storagePool}" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Change Compute Engine storage pool {storagePool} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Provisioned capacity is billed.
    tests:
      - fixture: fixtures/storage-pools-update.http
        expect: money
        resource: "acme-prod"
