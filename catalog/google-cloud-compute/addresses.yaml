# Google Compute Engine: addresses.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.addresses.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/addresses/{address}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine address {address} ({region}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      A released address goes back to Google's pool; the same IP address cannot be reserved again.
    tests:
      - fixture: fixtures/addresses-delete.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-compute.addresses.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/addresses" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Create Compute Engine address {body.name} ({region}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Static external addresses are billed.
    tests:
      - fixture: fixtures/addresses-insert.http
        expect: money
        resource: "acme-prod"

  - id: google-cloud-compute.addresses.move
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/addresses/{address}/move" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Move Compute Engine address {address} ({region}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/addresses-move.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-compute.addresses.set-labels
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/addresses/{resource}/setLabels" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Set labels of Compute Engine address {resource} ({region}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/addresses-set-labels.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-compute.addresses.test-iam-permissions
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/addresses/{resource}/testIamPermissions" } }
    class: read
    resource: { arg: project, kind: project }
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Reports the caller's permissions; changes nothing.
    tests:
      - fixture: fixtures/addresses-test-iam-permissions.http
        expect: read
        resource: "acme-prod"
