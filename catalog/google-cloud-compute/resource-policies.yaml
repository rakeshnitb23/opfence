    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/resourcePolicies/{resourcePolicy}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine resource policy {resourcePolicy} ({region}) in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/resource-policies-delete.http
        expect: delete
        resource: "acme-prod"

