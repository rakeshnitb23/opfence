# Google Compute Engine: ssl policies.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.ssl-policies.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/global/sslPolicies/{sslPolicy}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine SSL policy {sslPolicy} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/ssl-policies-delete.http
        expect: delete
        resource: "acme-prod"

  - id: google-cloud-compute.ssl-policies.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/sslPolicies" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Create Compute Engine SSL policy {body.name} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    tests:
      - fixture: fixtures/ssl-policies-insert.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-compute.ssl-policies.patch
    match: { rest: { method: PATCH, path: "/compute/{apiVersion}/projects/{project}/global/sslPolicies/{sslPolicy}" } }
    class: access
    resource: { arg: project, kind: project }
    card: "Change Compute Engine SSL policy {sslPolicy} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Can allow older TLS versions and weaker ciphers.
    tests:
      - fixture: fixtures/ssl-policies-patch.http
        expect: access
        resource: "acme-prod"
