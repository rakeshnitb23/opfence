# Google Compute Engine: region operations.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.region-operations.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/operations/{operation}" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine operation {operation} ({region}) in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Deletes the record of an operation, not what it did.
    tests:
      - fixture: fixtures/region-operations-delete.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-compute.region-operations.wait
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/operations/{operation}/wait" } }
    class: read
    resource: { arg: project, kind: project }
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Waits for an operation; changes nothing.
    tests:
      - fixture: fixtures/region-operations-wait.http
        expect: read
        resource: "acme-prod"
