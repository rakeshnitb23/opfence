    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/disableXpnHost" } }
    class: access
    resource: { arg: project, kind: project }
    card: "Disable xpn host of Compute Engine project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Shared VPC lets other projects use this project's networks.
    tests:
      - fixture: fixtures/projects-disable-xpn-host.http
