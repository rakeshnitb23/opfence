# Google Compute Engine: reservations.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.reservations.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/reservations/{reservation}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine reservation {reservation} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      Released capacity may not be available again.
    tests:
      - fixture: fixtures/reservations-delete.http
        expect: delete
        resource: "acme-prod"

  - id: google-cloud-compute.reservations.insert
