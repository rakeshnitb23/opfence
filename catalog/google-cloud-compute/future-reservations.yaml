    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/futureReservations/{futureReservation}/cancel" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Cancel Compute Engine future reservation {futureReservation} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-23
