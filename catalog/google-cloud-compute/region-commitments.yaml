# Google Compute Engine: region commitments.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.region-commitments.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/commitments" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Create Compute Engine commitment {body.name} ({region}) in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      A commitment is a one- or three-year purchase that cannot be cancelled.
    tests:
      - fixture: fixtures/region-commitments-insert.http
        expect: money
        resource: "acme-prod"

  - id: google-cloud-compute.region-commitments.update
    match: { rest: { method: PATCH, path: "/compute/{apiVersion}/projects/{project}/regions/{region}/commitments/{commitment}" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Change Compute Engine commitment {commitment} ({region}) in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      A commitment is a one- or three-year purchase that cannot be cancelled.
    tests:
      - fixture: fixtures/region-commitments-update.http
        expect: money
        resource: "acme-prod"
