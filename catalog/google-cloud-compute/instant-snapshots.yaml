# Google Compute Engine: instant snapshots.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.instant-snapshots.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/zones/{zone}/instantSnapshots/{instantSnapshot}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine instant snapshot {instantSnapshot} ({zone}) in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      A deleted snapshot cannot be restored from.
    tests:
      - fixture: fixtures/instant-snapshots-delete.http
        expect: irreversible
        resource: "acme-prod"

