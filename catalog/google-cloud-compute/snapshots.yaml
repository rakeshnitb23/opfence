# Google Compute Engine: snapshots.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-compute.snapshots.delete
    match: { rest: { method: DELETE, path: "/compute/{apiVersion}/projects/{project}/global/snapshots/{snapshot}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Delete Compute Engine snapshot {snapshot} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/compute/v1/rest
    notes: >-
      A deleted snapshot cannot be restored from.
    tests:
      - fixture: fixtures/snapshots-delete.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-compute.snapshots.insert
    match: { rest: { method: POST, path: "/compute/{apiVersion}/projects/{project}/global/snapshots" } }
