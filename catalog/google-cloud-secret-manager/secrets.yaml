# Google Cloud Secret Manager: secrets.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-secret-manager.secrets.add-version
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets/{secret}:addVersion" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Store a new value for secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
      Stores a new secret value.
    tests:
      - fixture: fixtures/secrets-add-version.http
        expect: credential
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.create
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Create secret {query.secretId} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
      Creates the secret without a value.
    tests:
      - fixture: fixtures/secrets-create.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.delete
    match: { rest: { method: DELETE, path: "/v1/projects/{project}/secrets/{secret}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Delete secret {secret} in project {project} with every version"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
      Deletes the secret with every version; no API returns their values to put them back.
    tests:
      - fixture: fixtures/secrets-delete.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.enable-managed-rotation
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets/{secret}:enableManagedRotation" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Enable managed rotation on Secret Manager secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    tests:
      - fixture: fixtures/secrets-enable-managed-rotation.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.patch
    match: { rest: { method: PATCH, path: "/v1/projects/{project}/secrets/{secret}" } }
    class: write
    when:
      - if: { arg: body.expireTime, present: true }
        class: irreversible
      - if: { arg: body.ttl, present: true }
        class: irreversible
    resource: { arg: project, kind: project }
    card: "Change Secret Manager secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
      Setting an expiry (expireTime, ttl) deletes the secret with every version at that time, so it
      is irreversible.
    tests:
      - fixture: fixtures/secrets-patch.http
        expect: write
        resource: "acme-prod"
      - fixture: fixtures/secrets-patch-when1.http
        expect: irreversible
        resource: "acme-prod"
      - fixture: fixtures/secrets-patch-when2.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.rotate-secret
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets/{secret}:rotateSecret" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Rotate secret on Secret Manager secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
      Starts a rotation that stores a new secret value.
    tests:
      - fixture: fixtures/secrets-rotate-secret.http
        expect: credential
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.set-iam-policy
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets/{secret}:setIamPolicy" } }
    class: access
    resource: { arg: project, kind: project }
    card: "Change who can access Secret Manager secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    tests:
      - fixture: fixtures/secrets-set-iam-policy.http
        expect: access
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.test-iam-permissions
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets/{secret}:testIamPermissions" } }
    class: read
    resource: { arg: project, kind: project }
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
