    tests:
      - fixture: fixtures/secrets-test-iam-permissions.http
        expect: read
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.versions-access
    match: { rest: { method: GET, path: "/v1/projects/{project}/secrets/{secret}/versions/{version}:access" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Read version {version} of secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
      Returns the secret value.
    tests:
      - fixture: fixtures/secrets-versions-access.http
        expect: credential
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.versions-destroy
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets/{secret}/versions/{version}:destroy" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Destroy version {version} of secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
      A destroyed version's value is gone.
    tests:
      - fixture: fixtures/secrets-versions-destroy.http
        expect: irreversible
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.versions-disable
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets/{secret}/versions/{version}:disable" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Disable Secret Manager version {version} of secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    notes: >-
      Apps reading the version stop getting it until it is enabled again.
    tests:
      - fixture: fixtures/secrets-versions-disable.http
        expect: write
        resource: "acme-prod"

  - id: google-cloud-secret-manager.secrets.versions-enable
    match: { rest: { method: POST, path: "/v1/projects/{project}/secrets/{secret}/versions/{version}:enable" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Enable Secret Manager version {version} of secret {secret} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/secretmanager/v1/rest
    tests:
