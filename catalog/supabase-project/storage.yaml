# Supabase project APIs (<ref>.supabase.co): storage.
operations:
  - id: supabase-project.storage.bucket.create
    match: { rest: { method: POST, path: "/storage/v1/bucket" } }
    class: write
    when:
      - if: { arg: body.public, equals: "true" }
        class: access
    resource: { arg: ref, kind: project }
    card: "Create storage bucket {body.name} in project {ref}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://github.com/supabase/storage/tree/master/src/http/routes
    notes: >-
      A public bucket serves its files to anyone with the URL, so creating one is access.
    tests:
      - fixture: fixtures/storage-bucket-create.http
        expect: write
        resource: "abcdefghijklmnopqrst"
      - fixture: fixtures/storage-bucket-create-public.http
        expect: access
        resource: "abcdefghijklmnopqrst"

  - id: supabase-project.storage.bucket.update
    match: { rest: { method: PUT, path: "/storage/v1/bucket/{bucket}" } }
    class: write
    when:
      - if: { arg: body.public, present: true }
        class: access
    resource: { arg: ref, kind: project }
    card: "Change storage bucket {bucket} in project {ref}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://github.com/supabase/storage/tree/master/src/http/routes
    notes: >-
      Changing whether the bucket is public is access.
    tests:
      - fixture: fixtures/storage-bucket-update.http
        expect: write
        resource: "abcdefghijklmnopqrst"
      - fixture: fixtures/storage-bucket-update-public.http
        expect: access
        resource: "abcdefghijklmnopqrst"

