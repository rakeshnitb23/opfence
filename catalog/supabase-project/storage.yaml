    resource: { arg: ref, kind: project }
    card: "Delete storage bucket {bucket} in project {ref}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://github.com/supabase/storage/tree/master/src/http/routes
    notes: >-
      Storage deletes only an empty bucket, so only its settings go, and they can be made again.
    tests:
      - fixture: fixtures/storage-bucket-delete.http
        expect: delete
        resource: "abcdefghijklmnopqrst"

  - id: supabase-project.storage.bucket.empty
