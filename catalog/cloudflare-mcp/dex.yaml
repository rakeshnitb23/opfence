# Cloudflare MCP servers: dex
operations:
  - id: cloudflare-mcp.dex.dex-test-statistics
    match: { mcp: { tool: dex_test_statistics } }
    class: read
    resource: { arg: testId, kind: dex-test }
    card: "Show statistics of DEX test {testId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/mcp-server-cloudflare/blob/main/apps/dex-analysis/src/tools/dex-analysis.tools.ts
    tests:
      - fixture: fixtures/dex-dex-test-statistics.http
        expect: read
        resource: "4f3e2d1c-0b9a-4876-a5b4-c3d2e1f0a9b8"

