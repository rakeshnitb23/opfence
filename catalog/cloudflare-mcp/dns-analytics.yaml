# Cloudflare MCP servers: dns-analytics
operations:
  - id: cloudflare-mcp.dns-analytics.dns-report
    match: { mcp: { tool: dns_report } }
    class: read
    resource: { arg: zone, kind: zone }
    card: "Report DNS analytics of zone {zone}"
    status: verified
    verified: 2026-10-18
