# Cloudflare MCP servers: browser
operations:
  - id: cloudflare-mcp.browser.get-url-html-content
    match: { mcp: { tool: get_url_html_content } }
    class: read
    resource: { arg: url, kind: url }
    card: "Fetch the HTML of {url}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/cloudflare/mcp-server-cloudflare/blob/main/apps/browser-rendering/src/tools/browser.tools.ts
    notes: >-
      Loads a public web page in Cloudflare's headless browser; nothing in the
      account changes.
    tests:
      - fixture: fixtures/browser-get-url-html-content.http
        expect: read
        resource: "https://shop-example.com/pricing"

