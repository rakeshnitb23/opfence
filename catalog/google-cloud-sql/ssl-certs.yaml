# Google Cloud SQL Admin API: ssl certs.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-sql.ssl-certs.create-ephemeral
    match: { rest: { method: POST, path: "/v1/projects/{project}/instances/{instance}/createEphemeral" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Create ephemeral on Cloud SQL SSL certificate {instance} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/sqladmin/v1/rest
    notes: >-
      Returns a client certificate that lets its holder connect to the instance.
    tests:
      - fixture: fixtures/ssl-certs-create-ephemeral.http
        expect: credential
        resource: "acme-prod"

