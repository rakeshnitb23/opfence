  - id: google-cloud-sql.instances.patch
    match: { rest: { method: PATCH, path: "/v1/projects/{project}/instances/{instance}" } }
    class: write
    when:
      - if: { arg: body.settings.ipConfiguration.authorizedNetworks, present: true }
        class: access
      - if: { arg: body.settings.ipConfiguration.ipv4Enabled, equals: "true" }
        class: access
      - if: { arg: body.settings.backupConfiguration.enabled, equals: "false" }
        class: irreversible
      - if: { arg: body.settings.backupConfiguration.pointInTimeRecoveryEnabled, equals: "false" }
        class: irreversible
      - if: { arg: body.settings.backupConfiguration.binaryLogEnabled, equals: "false" }
        class: irreversible
      - if: { arg: body.settings.deletionProtectionEnabled, equals: "false" }
        class: irreversible
      - if: { arg: body.settings.tier, present: true }
        class: money
    resource: { arg: project, kind: project }
    card: "Change Cloud SQL instance {instance} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/sqladmin/v1/rest
    notes: >-
      Changes the instance's settings. Opening the instance to networks (authorizedNetworks, a
      public IP) is access; turning off backups, point-in-time recovery, binary logging or deletion
      protection is irreversible, as dangerous as what it protects; changing the machine tier is
      money.
    tests:
      - fixture: fixtures/instances-patch.http
        expect: write
        resource: "acme-prod"
      - fixture: fixtures/instances-patch-when1.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/instances-patch-when2.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/instances-patch-when3.http
        expect: irreversible
        resource: "acme-prod"
      - fixture: fixtures/instances-patch-when4.http
        expect: irreversible
        resource: "acme-prod"
      - fixture: fixtures/instances-patch-when5.http
        expect: irreversible
        resource: "acme-prod"
      - fixture: fixtures/instances-patch-when6.http
        expect: irreversible
        resource: "acme-prod"
      - fixture: fixtures/instances-patch-when7.http
        expect: money
        resource: "acme-prod"

