    class: credential
    resource: { arg: project, kind: project }
    card: "Generate ephemeral cert on Cloud SQL connection {instance} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/sqladmin/v1beta4/rest
    notes: >-
      Returns a client certificate that lets its holder connect to the instance.
    tests:
      - fixture: fixtures/connect-generate-ephemeral-cert-v1beta4.http
        expect: credential
        resource: "acme-prod"
