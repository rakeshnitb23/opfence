provider: google-cloud-sql
title: Google Cloud SQL Admin API
docs: https://cloud.google.com/sql/docs/mysql/admin-api
# Cloud SQL instances, databases, users, backups and SQL run through the API. gcloud sql calls
# v1beta4.
# Generated from Google's discovery documents; every method that is not a
# GET has a rule, and so do the GETs that return secrets. The bearer token
# is a short-lived OAuth access token that google-oauth mints, so the agent
# holds a placeholder the proxy swaps in here (secrets_from).
hosts: [sqladmin.googleapis.com]
auth:
  - header: Authorization
    scheme: Bearer
secrets_from: [google-oauth]
defaults:
  rest_safe_methods: read
schemas:
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/sqladmin/v1/rest
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/sqladmin/v1beta4/rest
