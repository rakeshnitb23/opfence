    match: { rest: { method: DELETE, path: "/v1/projects/{project}/instances/{instance}/databases/{database}" } }
    class: irreversible
    resource: { arg: project, kind: project }
    card: "Delete database {database} of Cloud SQL instance {instance} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/sqladmin/v1/rest
    notes: >-
      Drops the database with its data.
    tests:
      - fixture: fixtures/databases-delete.http
        expect: irreversible
        resource: "acme-prod"

