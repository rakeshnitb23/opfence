    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/bigtableadmin/v2/rest
    notes: >-
      Deletes the instance with every table and backup in it.
    tests:
      - fixture: fixtures/instances-delete.http
        expect: irreversible
        resource: "acme-prod"

