# Google Cloud Bigtable Admin API: instances.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-bigtable.instances.create
    match: { rest: { method: POST, path: "/v2/projects/{project}/instances" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Create Bigtable instance in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/bigtableadmin/v2/rest
    notes: >-
      Instances are billed by their nodes.
    tests:
      - fixture: fixtures/instances-create.http
        expect: money
        resource: "acme-prod"

  - id: google-cloud-bigtable.instances.delete
    match: { rest: { method: DELETE, path: "/v2/projects/{project}/instances/{instance}" } }
