    match: { rest: { method: PATCH, path: "/v2/projects/{project}/instances/{instance}/clusters/{cluster}/backups/{backup}" } }
    class: write
    when:
      - if: { arg: body.expireTime, present: true }
        class: irreversible
    resource: { arg: project, kind: project }
    card: "Change Bigtable backup {backup} of instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/bigtableadmin/v2/rest
    notes: >-
      An earlier expire time deletes the backup sooner.
    tests:
      - fixture: fixtures/clusters-backups-patch.http
        expect: write
        resource: "acme-prod"
      - fixture: fixtures/clusters-backups-patch-when1.http
        expect: irreversible
        resource: "acme-prod"

