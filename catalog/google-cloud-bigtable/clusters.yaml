# Google Cloud Bigtable Admin API: clusters.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-bigtable.clusters.create
    match: { rest: { method: POST, path: "/v2/projects/{project}/instances/{instance}/clusters" } }
    class: money
    resource: { arg: project, kind: project }
    card: "Create Bigtable cluster in instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/bigtableadmin/v2/rest
    notes: >-
      Nodes are billed.
    tests:
      - fixture: fixtures/clusters-create.http
        expect: money
        resource: "acme-prod"

  - id: google-cloud-bigtable.clusters.delete
    match: { rest: { method: DELETE, path: "/v2/projects/{project}/instances/{instance}/clusters/{cluster}" } }
    class: delete
    resource: { arg: project, kind: project }
    card: "Delete Bigtable cluster {cluster} of instance {instance} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/bigtableadmin/v2/rest
    notes: >-
      The instance keeps its data in its other clusters; the last one cannot be deleted.
    tests:
      - fixture: fixtures/clusters-delete.http
        expect: delete
        resource: "acme-prod"

  - id: google-cloud-bigtable.clusters.partial-update-cluster
