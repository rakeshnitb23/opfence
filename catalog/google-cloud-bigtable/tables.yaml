    resource: { arg: project, kind: project }
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/bigtableadmin/v2/rest
    notes: >-
      Checks replication; changes nothing.
    tests:
      - fixture: fixtures/tables-check-consistency.http
        expect: read
        resource: "acme-prod"

