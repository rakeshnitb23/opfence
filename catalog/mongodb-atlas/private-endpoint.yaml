# MongoDB Atlas Administration API: private-endpoint
operations:
  - id: mongodb-atlas.private-endpoint.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/privateEndpoint/{cloudProvider}/endpointService/{endpointServiceId}/endpoint" } }
    class: write
    resource: { arg: groupId, kind: project }
    card: "Add a {cloudProvider} private endpoint to service {endpointServiceId} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/private-endpoint-create.http
        expect: write
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.private-endpoint.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/privateEndpoint/{cloudProvider}/endpointService/{endpointServiceId}/endpoint/{endpointId}" } }
    class: delete
    resource: { arg: groupId, kind: project }
    card: "Remove private endpoint {endpointId} from service {endpointServiceId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/private-endpoint-delete.http
        expect: delete
        resource: 32b6e34b3d91647abb20e7b8
