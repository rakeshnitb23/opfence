# MongoDB Atlas Administration API: encryption-at-rest
operations:
  - id: mongodb-atlas.encryption-at-rest.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/encryptionAtRest" } }
    class: write
    when:
      - if: { arg: body.awsKms.secretAccessKey, present: true }
        class: credential
      - if: { arg: body.azureKeyVault.secret, present: true }
        class: credential
      - if: { arg: body.googleCloudKms.serviceAccountKey, present: true }
        class: credential
    resource: { arg: groupId, kind: project }
    card: "Change customer-key encryption at rest of project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Azure secrets and Google service account keys are credentials Atlas stores
      to reach your KMS.
    tests:
      - fixture: fixtures/encryption-at-rest-update.http
        expect: write
        resource: 32b6e34b3d91647abb20e7b8
      - fixture: fixtures/encryption-at-rest-update-azure-secret.http
        expect: credential
        resource: 32b6e34b3d91647abb20e7b8
