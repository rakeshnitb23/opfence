# MongoDB Atlas Administration API: project-mcp-config
operations:
  - id: mongodb-atlas.project-mcp-config.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/mcpConfigs" } }
    class: credential
    resource: { arg: groupId, kind: project }
    card: "Create remote MCP configuration {body.mcpConfigName} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Provisions a service account for the Atlas Remote MCP server and returns
      its client id and secret.
    tests:
      - fixture: fixtures/project-mcp-config-create.http
        expect: credential
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project-mcp-config.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/mcpConfigs/{mcpConfigId}" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Change remote MCP configuration {mcpConfigId} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Changes the roles and IP access list of the configuration's service
      account.
    tests:
      - fixture: fixtures/project-mcp-config-update.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project-mcp-config.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/mcpConfigs/{mcpConfigId}" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Delete remote MCP configuration {mcpConfigId} from project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/project-mcp-config-delete.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8
