# MongoDB Atlas Administration API: serverless-private-endpoint
operations:
  - id: mongodb-atlas.serverless-private-endpoint.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/privateEndpoint/serverless/instance/{instanceName}/endpoint" } }
    class: write
    resource: { arg: instanceName, kind: serverless-instance }
    card: "Create a private endpoint for serverless instance {instanceName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/serverless-private-endpoint-create.http
        expect: write
        resource: orders-serverless

  - id: mongodb-atlas.serverless-private-endpoint.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/privateEndpoint/serverless/instance/{instanceName}/endpoint/{endpointId}" } }
    class: write
    resource: { arg: instanceName, kind: serverless-instance }
    card: "Change private endpoint {endpointId} of serverless instance {instanceName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/serverless-private-endpoint-update.http
        expect: write
        resource: orders-serverless

  - id: mongodb-atlas.serverless-private-endpoint.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/privateEndpoint/serverless/instance/{instanceName}/endpoint/{endpointId}" } }
    class: delete
    resource: { arg: instanceName, kind: serverless-instance }
    card: "Delete private endpoint {endpointId} of serverless instance {instanceName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/serverless-private-endpoint-delete.http
        expect: delete
        resource: orders-serverless
