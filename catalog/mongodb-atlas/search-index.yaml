    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/fts/indexes" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Create Atlas Search index {body.name} on {body.database}.{body.collectionName} in cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/search-index-create-legacy.http
