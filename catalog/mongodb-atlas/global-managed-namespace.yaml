# MongoDB Atlas Administration API: global-managed-namespace
operations:
  - id: mongodb-atlas.global-managed-namespace.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/globalWrites/managedNamespaces" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Shard {body.db}.{body.collection} in global cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/global-managed-namespace-create.http
        expect: write
        resource: orders-prod

  - id: mongodb-atlas.global-managed-namespace.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/globalWrites/managedNamespaces" } }
    class: delete
    resource: { arg: clusterName, kind: cluster }
    card: "Remove managed namespace {query.db}.{query.collection} from global cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Atlas documents that deleting a managed namespace keeps the collection and
      its data.
    tests:
      - fixture: fixtures/global-managed-namespace-delete.http
        expect: delete
        resource: orders-prod
