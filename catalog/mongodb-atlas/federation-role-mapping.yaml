# MongoDB Atlas Administration API: federation-role-mapping
operations:
  - id: mongodb-atlas.federation-role-mapping.create
    match: { rest: { method: POST, path: "/api/atlas/v2/federationSettings/{federationSettingsId}/connectedOrgConfigs/{orgId}/roleMappings" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Map IdP group {body.externalGroupName} to roles in organization {orgId}"
    status: verified
    verified: 2026-10-17
