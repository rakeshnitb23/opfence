# MongoDB Atlas Administration API: cluster-private-connection-string
operations:
  - id: mongodb-atlas.cluster-private-connection-string.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/privateEndpointConnectionStrings" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Create a private endpoint connection string for cluster {clusterName}"
    status: verified
    verified: 2026-10-17
