# MongoDB Atlas Administration API: project-service-account
operations:
  - id: mongodb-atlas.project-service-account.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/serviceAccounts" } }
    class: credential
    resource: { arg: groupId, kind: project }
    card: "Create service account {body.name} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Returns the client id and first secret.
    tests:
      - fixture: fixtures/project-service-account-create.http
        expect: credential
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project-service-account.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/serviceAccounts/{clientId}" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Change service account {clientId} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/project-service-account-update.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project-service-account.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/serviceAccounts/{clientId}" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Delete service account {clientId} from project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/project-service-account-delete.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project-service-account.invite
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/serviceAccounts/{clientId}:invite" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Add service account {clientId} to project {groupId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Assigning a service account to a project gives it the project roles in the body.
    tests:
      - fixture: fixtures/project-service-account-invite.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project-service-account.custom-action
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/serviceAccounts/{serviceAccountAction}" } }
    class: unknown
    resource: { arg: groupId, kind: project }
    card: "Run {serviceAccountAction} on a service account in project {groupId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Atlas custom methods put the verb after the last segment
      ({x}:verb). The documented ones have their own rules; this one catches
      any other verb, and a plain POST to the item, as unknown.
    tests:
      - fixture: fixtures/project-service-account-custom-action-other.http
        expect: unknown
        resource: 32b6e34b3d91647abb20e7b8
