# MongoDB Atlas Administration API: live-migration-link-token
operations:
  - id: mongodb-atlas.live-migration-link-token.create
    match: { rest: { method: POST, path: "/api/atlas/v2/orgs/{orgId}/liveMigrations/linkTokens" } }
    class: credential
    resource: { arg: orgId, kind: organization }
    card: "Create a live migration link token for organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      The link token lets a Cloud Manager or Ops Manager deployment push data
      into the organization.
    tests:
      - fixture: fixtures/live-migration-link-token-create.http
        expect: credential
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.live-migration-link-token.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/orgs/{orgId}/liveMigrations/linkTokens" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Delete the live migration link token of organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/live-migration-link-token-delete.http
        expect: access
        resource: 4888442a3354817a7320eb61
