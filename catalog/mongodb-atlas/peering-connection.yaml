# MongoDB Atlas Administration API: peering-connection
operations:
  - id: mongodb-atlas.peering-connection.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/peers" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Peer project {groupId} with {body.providerName} network {body.vpcId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Opens a network path from your VPC to the project's clusters.
    tests:
      - fixture: fixtures/peering-connection-create.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.peering-connection.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/peers/{peerId}" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Change network peering connection {peerId} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/peering-connection-update.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.peering-connection.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/peers/{peerId}" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Delete network peering connection {peerId} from project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/peering-connection-delete.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8
