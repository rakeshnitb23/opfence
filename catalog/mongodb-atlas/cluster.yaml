    notes: >-
      TLS protocol and cipher settings decide which clients can connect.
    tests:
      - fixture: fixtures/cluster-update-process-args.http
        expect: write
        resource: orders-prod
      - fixture: fixtures/cluster-update-process-args-tls.http
        expect: access
        resource: orders-prod

