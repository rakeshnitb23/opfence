# MongoDB Atlas Administration API: cluster
operations:
  - id: mongodb-atlas.cluster.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters" } }
    class: money
    resource: { arg: groupId, kind: project }
    card: "Create cluster {body.name} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Dedicated clusters are billed by the hour.
    tests:
      - fixture: fixtures/cluster-create.http
        expect: money
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.cluster.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}" } }
    class: write
    when:
      - if: { arg: body.backupEnabled, equals: "false" }
        class: irreversible
      - if: { arg: body.providerBackupEnabled, equals: "false" }
        class: irreversible
      - if: { arg: body.pitEnabled, equals: "false" }
        class: irreversible
      - if: { arg: body.terminationProtectionEnabled, equals: "false" }
        class: irreversible
      - if: { arg: body.deleteAfterCreationHours, present: true }
        class: irreversible
      - if: { arg: body.acceptDataRisksAndForceReplicaSetReconfig, present: true }
        class: irreversible
      - if: { arg: body.replicationSpecs, present: true }
        class: money
      - if: { arg: body.replicationSpec, present: true }
        class: money
      - if: { arg: body.providerSettings, present: true }
        class: money
      - if: { arg: body.diskSizeGB, present: true }
        class: money
      - if: { arg: body.numShards, present: true }
        class: money
      - if: { arg: body.clusterType, present: true }
        class: money
      - if: { arg: body.replicationFactor, present: true }
        class: money
      - if: { arg: body.autoScaling, present: true }
        class: money
      - if: { arg: body.advancedConfiguration.minimumEnabledTlsProtocol, present: true }
        class: access
      - if: { arg: body.advancedConfiguration.tlsCipherConfigMode, present: true }
        class: access
      - if: { arg: body.advancedConfiguration.customOpensslCipherConfigTls12, present: true }
        class: access
      - if: { arg: body.advancedConfiguration.customOpensslCipherConfigTls13, present: true }
        class: access
    resource: { arg: clusterName, kind: cluster }
    card: "Change cluster {clusterName} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Turning backups or point-in-time recovery off deletes existing snapshots
      or history, and turning termination protection off removes the guard
      against deletion (a safety net is as dangerous as what it protects);
      deleteAfterCreationHours schedules the cluster's deletion;
      acceptDataRisksAndForceReplicaSetReconfig can lose writes. Changing
      instance size, disk, shards or topology changes the bill. TLS settings
      change who can connect.
    tests:
      - fixture: fixtures/cluster-update.http
        expect: write
        resource: orders-prod
      - fixture: fixtures/cluster-update-backup-off.http
        expect: irreversible
        resource: orders-prod
      - fixture: fixtures/cluster-update-protection-off.http
        expect: irreversible
        resource: orders-prod
      - fixture: fixtures/cluster-update-scale.http
        expect: money
        resource: orders-prod
      - fixture: fixtures/cluster-update-tls.http
        expect: access
        resource: orders-prod

  - id: mongodb-atlas.cluster.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}" } }
    class: irreversible
    resource: { arg: clusterName, kind: cluster }
    card: "Delete cluster {clusterName} and its data in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      retainBackups=true keeps the snapshots, but a condition cannot safely
      lower the class (a repeated query parameter can say both), so the rule
      stays irreversible.
    tests:
      - fixture: fixtures/cluster-delete.http
        expect: irreversible
        resource: orders-prod

