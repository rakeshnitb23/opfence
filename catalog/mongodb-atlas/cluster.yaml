      - if: { arg: body.customOpensslCipherConfigTls13, present: true }
        class: access
    resource: { arg: clusterName, kind: cluster }
    card: "Change advanced configuration of cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
