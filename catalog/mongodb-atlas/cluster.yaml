  - id: mongodb-atlas.cluster.custom-action
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterAction}" } }
    class: unknown
    when:
      - if: { arg: clusterAction, matches: ":grantMongoDBEmployeeAccess$" }
        class: access
      - if: { arg: clusterAction, matches: ":revokeMongoDBEmployeeAccess$" }
        class: access
      - if: { arg: clusterAction, matches: ":pinFeatureCompatibilityVersion$" }
        class: write
      - if: { arg: clusterAction, matches: ":unpinFeatureCompatibilityVersion$" }
        class: write
    resource: { arg: clusterAction, kind: cluster-action }
    card: "Run {clusterAction} on a cluster of project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Atlas's custom methods put the verb in the cluster segment
      (clusters/{clusterName}:grantMongoDBEmployeeAccess). Opfence templates
      match whole segments only, so one rule captures the segment and its
      conditions name the four documented methods: granting or revoking MongoDB
      employee access is access, pinning or unpinning the feature compatibility
      version is write. Any other method stays unknown.
    tests:
      - fixture: fixtures/cluster-custom-action.http
        expect: access
        resource: orders-prod:grantMongoDBEmployeeAccess
      - fixture: fixtures/cluster-custom-action-revoke.http
        expect: access
        resource: orders-prod:revokeMongoDBEmployeeAccess
      - fixture: fixtures/cluster-custom-action-pin-fcv.http
        expect: write
        resource: orders-prod:pinFeatureCompatibilityVersion
      - fixture: fixtures/cluster-custom-action-unpin-fcv.http
        expect: write
        resource: orders-prod:unpinFeatureCompatibilityVersion
      - fixture: fixtures/cluster-custom-action-other.http
        expect: unknown
        resource: orders-prod:somethingNew
