# MongoDB Atlas Administration API: stream-processor
operations:
  - id: mongodb-atlas.stream-processor.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/streams/{tenantName}/processor" } }
    class: write
    resource: { arg: tenantName, kind: stream-workspace }
    card: "Create stream processor {body.name} in workspace {tenantName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      A processor costs nothing until it starts.
    tests:
      - fixture: fixtures/stream-processor-create.http
        expect: write
        resource: events-workspace

  - id: mongodb-atlas.stream-processor.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/streams/{tenantName}/processor/{processorName}" } }
    class: write
    resource: { arg: tenantName, kind: stream-workspace }
    card: "Change stream processor {processorName} in workspace {tenantName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/stream-processor-update.http
        expect: write
        resource: events-workspace

  - id: mongodb-atlas.stream-processor.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/streams/{tenantName}/processor/{processorName}" } }
    class: delete
    resource: { arg: tenantName, kind: stream-workspace }
    card: "Delete stream processor {processorName} from workspace {tenantName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      The pipeline can be created again from its definition; its checkpoint
      (window state) is lost and rebuilt from the source.
    tests:
      - fixture: fixtures/stream-processor-delete.http
        expect: delete
        resource: events-workspace

  - id: mongodb-atlas.stream-processor.start
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/streams/{tenantName}/processor/{processorName}:start" } }
    class: money
    resource: { arg: tenantName, kind: stream-workspace }
    card: "Start stream processor {processorName} in workspace {tenantName}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      A running processor is billed by the hour.
    tests:
      - fixture: fixtures/stream-processor-start.http
        expect: money
        resource: events-workspace

  - id: mongodb-atlas.stream-processor.start-with
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/streams/{tenantName}/processor/{processorName}:startWith" } }
    class: money
    resource: { arg: tenantName, kind: stream-workspace }
    card: "Start stream processor {processorName} in workspace {tenantName} with options"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      A running processor is billed by the hour.
    tests:
      - fixture: fixtures/stream-processor-start-with.http
        expect: money
        resource: events-workspace

  - id: mongodb-atlas.stream-processor.stop
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/streams/{tenantName}/processor/{processorName}:stop" } }
    class: write
    resource: { arg: tenantName, kind: stream-workspace }
    card: "Stop stream processor {processorName} in workspace {tenantName}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/stream-processor-stop.http
        expect: write
        resource: events-workspace

  - id: mongodb-atlas.stream-processor.custom-action
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/streams/{tenantName}/processor/{processorAction}" } }
    class: unknown
    resource: { arg: tenantName, kind: stream-workspace }
    card: "Run {processorAction} in stream workspace {tenantName}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Atlas custom methods put the verb after the last segment
      ({x}:verb). The documented ones have their own rules; this one catches
      any other verb, and a plain POST to the item, as unknown.
    tests:
      - fixture: fixtures/stream-processor-custom-action-other.http
        expect: unknown
        resource: events-workspace
