# MongoDB Atlas Administration API: project
operations:
  - id: mongodb-atlas.project.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups" } }
    class: write
    card: "Create project {body.name} in organization {body.orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/project-create.http
        expect: write

  - id: mongodb-atlas.project.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}" } }
    class: write
    resource: { arg: groupId, kind: project }
    card: "Change project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/project-update.http
        expect: write
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}" } }
    class: irreversible
    resource: { arg: groupId, kind: project }
    card: "Delete project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Atlas refuses while clusters remain, but the project's users, access list,
      alerts, integrations and settings go with it.
    tests:
      - fixture: fixtures/project-delete.http
        expect: irreversible
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project.migrate
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}:migrate" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Move project {groupId} to another organization"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Moving a project to another organization changes who owns and can reach it.
    tests:
      - fixture: fixtures/project-migrate.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.project.custom-action
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{projectAction}" } }
    class: unknown
    resource: { arg: projectAction, kind: project-action }
    card: "Run {projectAction} on a project"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Atlas custom methods put the verb after the last segment
      ({x}:verb). The documented ones have their own rules; this one catches
      any other verb, and a plain POST to the item, as unknown.
    tests:
      - fixture: fixtures/project-custom-action-other.http
        expect: unknown
        resource: 32b6e34b3d91647abb20e7b8:somethingNew
