# MongoDB Atlas Administration API: org-mcp-config-secret
operations:
  - id: mongodb-atlas.org-mcp-config-secret.create
    match: { rest: { method: POST, path: "/api/atlas/v2/orgs/{orgId}/mcpConfigs/{mcpConfigId}/secrets" } }
    class: credential
    resource: { arg: orgId, kind: organization }
    card: "Create a secret for remote MCP configuration {mcpConfigId} in organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
