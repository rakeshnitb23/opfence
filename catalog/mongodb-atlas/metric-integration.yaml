# MongoDB Atlas Administration API: metric-integration
operations:
  - id: mongodb-atlas.metric-integration.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/metricIntegrations" } }
    class: write
    when:
      - if: { arg: body.headers, present: true }
        class: credential
      - if: { arg: body.oauth.clientSecret, present: true }
        class: credential
    resource: { arg: groupId, kind: project }
    card: "Create a {body.providerType} metric integration in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Auth headers and OAuth client secrets are credentials Atlas stores to push
      metrics.
    tests:
      - fixture: fixtures/metric-integration-create.http
        expect: write
        resource: 32b6e34b3d91647abb20e7b8
      - fixture: fixtures/metric-integration-create-secret.http
        expect: credential
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.metric-integration.update
    match: { rest: { method: PUT, path: "/api/atlas/v2/groups/{groupId}/metricIntegrations/{metricIntegrationId}" } }
    class: write
    when:
      - if: { arg: body.headers, present: true }
        class: credential
      - if: { arg: body.oauth.clientSecret, present: true }
        class: credential
    resource: { arg: groupId, kind: project }
    card: "Replace metric integration {metricIntegrationId} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Auth headers and OAuth client secrets are credentials Atlas stores to push
      metrics.
    tests:
      - fixture: fixtures/metric-integration-update.http
        expect: write
        resource: 32b6e34b3d91647abb20e7b8
      - fixture: fixtures/metric-integration-update-secret.http
        expect: credential
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.metric-integration.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/metricIntegrations/{metricIntegrationId}" } }
    class: delete
    resource: { arg: groupId, kind: project }
    card: "Delete metric integration {metricIntegrationId} from project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/metric-integration-delete.http
        expect: delete
        resource: 32b6e34b3d91647abb20e7b8
