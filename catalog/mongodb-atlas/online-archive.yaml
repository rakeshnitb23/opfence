# MongoDB Atlas Administration API: online-archive
operations:
  - id: mongodb-atlas.online-archive.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/onlineArchives" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Archive {body.dbName}.{body.collName} of cluster {clusterName} to Online Archive"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Moves matching documents out of the cluster into archive storage, where
      they stay queryable.
    tests:
      - fixture: fixtures/online-archive-create.http
        expect: write
        resource: orders-prod

  - id: mongodb-atlas.online-archive.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/onlineArchives/{archiveId}" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Change online archive {archiveId} of cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/online-archive-update.http
        expect: write
        resource: orders-prod

  - id: mongodb-atlas.online-archive.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/onlineArchives/{archiveId}" } }
    class: irreversible
    resource: { arg: clusterName, kind: cluster }
    card: "Delete online archive {archiveId} of cluster {clusterName} and its archived data"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Deleting an online archive deletes the documents it already moved off the
      cluster.
    tests:
      - fixture: fixtures/online-archive-delete.http
        expect: irreversible
        resource: orders-prod
