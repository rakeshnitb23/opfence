# MongoDB Atlas Administration API: flex-snapshot
operations:
  - id: mongodb-atlas.flex-snapshot.download
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/flexClusters/{name}/backup/download" } }
    class: credential
    resource: { arg: name, kind: cluster }
    card: "Get a download link for snapshot {body.snapshotId} of flex cluster {name}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Returns a link to the snapshot files; anyone with the link can download
      the data.
    tests:
      - fixture: fixtures/flex-snapshot-download.http
        expect: credential
        resource: orders-flex
