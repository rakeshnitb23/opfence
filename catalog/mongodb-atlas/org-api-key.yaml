# MongoDB Atlas Administration API: org-api-key
operations:
  - id: mongodb-atlas.org-api-key.create
    match: { rest: { method: POST, path: "/api/atlas/v2/orgs/{orgId}/apiKeys" } }
    class: credential
    resource: { arg: orgId, kind: organization }
    card: "Create an API key for organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Returns the private key once, in the response.
    tests:
      - fixture: fixtures/org-api-key-create.http
        expect: credential
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.org-api-key.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/orgs/{orgId}/apiKeys/{apiUserId}" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Change API key {apiUserId} of organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/org-api-key-update.http
        expect: access
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.org-api-key.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/orgs/{orgId}/apiKeys/{apiUserId}" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Delete API key {apiUserId} from organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/org-api-key-delete.http
        expect: access
        resource: 4888442a3354817a7320eb61
