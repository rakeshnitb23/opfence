  - id: mongodb-atlas.alert-config.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/alertConfigs/{alertConfigId}" } }
    class: delete
    resource: { arg: groupId, kind: project }
    card: "Delete alert configuration {alertConfigId} from project {groupId}"
