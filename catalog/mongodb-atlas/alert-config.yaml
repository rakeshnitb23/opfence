  - id: mongodb-atlas.alert-config.toggle
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/alertConfigs/{alertConfigId}" } }
    class: write
    resource: { arg: groupId, kind: project }
    card: "Set alert configuration {alertConfigId} enabled={body.enabled} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
