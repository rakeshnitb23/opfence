# MongoDB Atlas Administration API: stream-vpc-peering
operations:
  - id: mongodb-atlas.stream-vpc-peering.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/streams/vpcPeeringConnections/{id}" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Delete stream processing VPC peering connection {id} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/stream-vpc-peering-delete.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.stream-vpc-peering.accept
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/streams/vpcPeeringConnections/{id}:accept" } }
    class: access
    resource: { arg: groupId, kind: project }
    card: "Accept stream processing VPC peering connection {id} in project {groupId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Accepting opens a network path into stream processing.
    tests:
      - fixture: fixtures/stream-vpc-peering-accept.http
        expect: access
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.stream-vpc-peering.reject
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/streams/vpcPeeringConnections/{id}:reject" } }
    class: write
    resource: { arg: groupId, kind: project }
    card: "Reject stream processing VPC peering connection {id} in project {groupId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/stream-vpc-peering-reject.http
        expect: write
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.stream-vpc-peering.custom-action
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/streams/vpcPeeringConnections/{peeringAction}" } }
    class: unknown
    resource: { arg: groupId, kind: project }
    card: "Run {peeringAction} on a stream processing VPC peering connection in project {groupId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Atlas custom methods put the verb after the last segment
      ({x}:verb). The documented ones have their own rules; this one catches
      any other verb, and a plain POST to the item, as unknown.
    tests:
      - fixture: fixtures/stream-vpc-peering-custom-action-other.http
        expect: unknown
        resource: 32b6e34b3d91647abb20e7b8
