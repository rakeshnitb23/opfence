# MongoDB Atlas Administration API: oauth-token
operations:
  - id: mongodb-atlas.oauth-token.create
    match: { rest: { method: POST, path: "/api/oauth/token" } }
    class: credential
    card: "Exchange service account credentials for an Atlas access token"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
      - https://github.com/mongodb-js/mongodb-mcp-server/blob/main/packages/atlas-api-client/src/auth/clientCredentials.ts
    notes: >-
      The client credentials grant (tokenUrl in the spec's ServiceAccounts
      security scheme). The response is a bearer token for the whole Admin API,
      valid for an hour, which the agent would see in clear text.
    tests:
      - fixture: fixtures/oauth-token-create.http
        expect: credential

  - id: mongodb-atlas.oauth-token.revoke
    match: { rest: { method: POST, path: "/api/oauth/revoke" } }
    class: access
    card: "Revoke an Atlas access token"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb-js/mongodb-mcp-server/blob/main/packages/atlas-api-client/src/auth/clientCredentials.ts
    notes: >-
      The revocation endpoint the official clients call on shutdown; like other
      token removals in the catalog this is access.
    tests:
      - fixture: fixtures/oauth-token-revoke.http
        expect: access
