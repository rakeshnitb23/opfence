# MongoDB Atlas Administration API: global-zone-mapping
operations:
  - id: mongodb-atlas.global-zone-mapping.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/globalWrites/customZoneMapping" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Add custom zone mappings to global cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/global-zone-mapping-create.http
        expect: write
        resource: orders-prod

  - id: mongodb-atlas.global-zone-mapping.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/globalWrites/customZoneMapping" } }
    class: delete
    resource: { arg: clusterName, kind: cluster }
    card: "Remove every custom zone mapping from global cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Changes where new writes are routed; documents stay where they are.
    tests:
      - fixture: fixtures/global-zone-mapping-delete.http
        expect: delete
        resource: orders-prod
