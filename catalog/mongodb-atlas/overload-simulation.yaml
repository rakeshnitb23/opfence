# MongoDB Atlas Administration API: overload-simulation
operations:
  - id: mongodb-atlas.overload-simulation.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/overloadSimulations" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Start an overload protection simulation on cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/overload-simulation-create.http
        expect: write
        resource: orders-prod

  - id: mongodb-atlas.overload-simulation.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/overloadSimulations/{simulationId}" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Stop overload protection simulation {simulationId} on cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/overload-simulation-delete.http
        expect: write
        resource: orders-prod
