# MongoDB Atlas Administration API: backup-export
operations:
  - id: mongodb-atlas.backup-export.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/backup/exports" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Export snapshot {body.snapshotId} of cluster {clusterName} to bucket {body.exportBucketId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Copies the snapshot's data into a registered bucket.
    tests:
      - fixture: fixtures/backup-export-create.http
        expect: write
        resource: orders-prod
