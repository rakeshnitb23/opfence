# MongoDB Atlas Administration API: flex-restore-job
operations:
  - id: mongodb-atlas.flex-restore-job.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/flexClusters/{name}/backup/restoreJobs" } }
    class: irreversible
    resource: { arg: name, kind: cluster }
    card: "Restore snapshot {body.snapshotId} of flex cluster {name} onto {body.targetDeploymentItemName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      A restore replaces all data on the target cluster.
    tests:
      - fixture: fixtures/flex-restore-job-create.http
        expect: irreversible
        resource: orders-flex

  - id: mongodb-atlas.flex-restore-job.list
    match: { rest: { method: GET, path: "/api/atlas/v2/groups/{groupId}/flexClusters/{name}/backup/restoreJobs" } }
    class: credential
    resource: { arg: name, kind: cluster }
    card: "List restore jobs of flex cluster {name}, with their download links"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Download restore jobs return snapshotUrl links; anyone with the link can
      download the data.
    tests:
      - fixture: fixtures/flex-restore-job-list.http
        expect: credential
        resource: orders-flex

  - id: mongodb-atlas.flex-restore-job.get
    match: { rest: { method: GET, path: "/api/atlas/v2/groups/{groupId}/flexClusters/{name}/backup/restoreJobs/{restoreJobId}" } }
    class: credential
    resource: { arg: name, kind: cluster }
    card: "Read restore job {restoreJobId} of flex cluster {name}, with its download link"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Download restore jobs return snapshotUrl links; anyone with the link can
      download the data.
    tests:
      - fixture: fixtures/flex-restore-job-get.http
        expect: credential
        resource: orders-flex
