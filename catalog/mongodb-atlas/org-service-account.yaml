# MongoDB Atlas Administration API: org-service-account
operations:
  - id: mongodb-atlas.org-service-account.create
    match: { rest: { method: POST, path: "/api/atlas/v2/orgs/{orgId}/serviceAccounts" } }
    class: credential
    resource: { arg: orgId, kind: organization }
    card: "Create service account {body.name} in organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Returns the client id and first secret.
    tests:
      - fixture: fixtures/org-service-account-create.http
        expect: credential
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.org-service-account.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/orgs/{orgId}/serviceAccounts/{clientId}" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Change service account {clientId} in organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/org-service-account-update.http
        expect: access
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.org-service-account.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/orgs/{orgId}/serviceAccounts/{clientId}" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Delete service account {clientId} from organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/org-service-account-delete.http
        expect: access
        resource: 4888442a3354817a7320eb61
