# MongoDB Atlas Administration API: standby-link
operations:
  - id: mongodb-atlas.standby-link.create
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/standbyLinks" } }
    class: money
    resource: { arg: groupId, kind: project }
    card: "Link cluster {body.activeClusterName} to standby cluster {body.standbyClusterName} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Keeps a second cluster in sync for disaster recovery; replication between
      regions is billed.
    tests:
      - fixture: fixtures/standby-link-create.http
        expect: money
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.standby-link.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/standbyLinks/{standbyLinkId}" } }
    class: delete
    resource: { arg: groupId, kind: project }
    card: "Delete standby link {standbyLinkId} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Both clusters and their data remain; only the replication link goes.
    tests:
      - fixture: fixtures/standby-link-delete.http
        expect: delete
        resource: 32b6e34b3d91647abb20e7b8

  - id: mongodb-atlas.standby-link.failover
    match: { rest: { method: POST, path: "/api/atlas/v2/groups/{groupId}/standbyLinks/{standbyLinkId}/failovers" } }
    class: write
    resource: { arg: groupId, kind: project }
    card: "Fail over standby link {standbyLinkId} in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      Promotes the standby cluster or swaps the roles; applications follow the
      new active cluster.
    tests:
      - fixture: fixtures/standby-link-failover.http
        expect: write
        resource: 32b6e34b3d91647abb20e7b8
