# MongoDB Atlas Administration API: legacy-snapshot
operations:
  - id: mongodb-atlas.legacy-snapshot.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/snapshots/{snapshotId}" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Change the expiry of legacy snapshot {snapshotId} of cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      An earlier expiry makes Atlas delete the snapshot sooner, not immediately.
    tests:
      - fixture: fixtures/legacy-snapshot-update.http
        expect: write
        resource: orders-prod

  - id: mongodb-atlas.legacy-snapshot.delete
    match: { rest: { method: DELETE, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/snapshots/{snapshotId}" } }
    class: irreversible
    resource: { arg: clusterName, kind: cluster }
    card: "Delete legacy snapshot {snapshotId} of cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/legacy-snapshot-delete.http
        expect: irreversible
        resource: orders-prod
