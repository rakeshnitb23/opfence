# MongoDB Atlas Administration API: org-user
operations:
  - id: mongodb-atlas.org-user.add
    match: { rest: { method: POST, path: "/api/atlas/v2/orgs/{orgId}/users" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Add user {body.username} to organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/org-user-add.http
        expect: access
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.org-user.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/orgs/{orgId}/users/{userId}" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Change user {userId} in organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/org-user-update.http
        expect: access
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.org-user.remove
    match: { rest: { method: DELETE, path: "/api/atlas/v2/orgs/{orgId}/users/{userId}" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Remove user {userId} from organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/org-user-remove.http
        expect: access
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.org-user.custom-action
    match: { rest: { method: POST, path: "/api/atlas/v2/orgs/{orgId}/users/{userAction}" } }
    class: unknown
    when:
      - if: { arg: userAction, matches: ":addRole$" }
        class: access
      - if: { arg: userAction, matches: ":removeRole$" }
        class: access
    resource: { arg: orgId, kind: organization }
    card: "Run {userAction} on a user of organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      The verb sits in the user segment (users/{userId}:addRole), which Opfence
      templates cannot split, so conditions name addRole and removeRole; any
      other method stays unknown.
    tests:
      - fixture: fixtures/org-user-custom-action.http
        expect: access
        resource: 4888442a3354817a7320eb61
      - fixture: fixtures/org-user-custom-action-remove-role.http
        expect: access
        resource: 4888442a3354817a7320eb61
      - fixture: fixtures/org-user-custom-action-other.http
        expect: unknown
        resource: 4888442a3354817a7320eb61

  - id: mongodb-atlas.org-user.set-roles
    match: { rest: { method: PUT, path: "/api/atlas/v2/orgs/{orgId}/users/{userId}/roles" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Set the roles of user {userId} in organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/org-user-set-roles.http
        expect: access
        resource: 4888442a3354817a7320eb61
