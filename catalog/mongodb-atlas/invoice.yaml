# MongoDB Atlas Administration API: invoice
operations:
  - id: mongodb-atlas.invoice.custom-action
    match: { rest: { method: POST, path: "/api/atlas/v2/orgs/{orgId}/invoices/{invoiceAction}" } }
    class: unknown
    when:
      - if: { arg: invoiceAction, matches: ":generateAndDownloadReport$" }
        class: read
    resource: { arg: orgId, kind: organization }
    card: "Run {invoiceAction} on an invoice of organization {orgId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      The verb sits in the invoice segment
      (invoices/{invoiceId}:generateAndDownloadReport), which Opfence templates
      cannot split, so a condition names it. Generating a report changes
      nothing; any other method stays unknown.
    tests:
      - fixture: fixtures/invoice-custom-action.http
        expect: read
        resource: 4888442a3354817a7320eb61
      - fixture: fixtures/invoice-custom-action-other.http
        expect: unknown
        resource: 4888442a3354817a7320eb61
