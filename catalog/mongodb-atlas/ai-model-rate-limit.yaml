# MongoDB Atlas Administration API: ai-model-rate-limit
operations:
  - id: mongodb-atlas.ai-model-rate-limit.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/aiModelApiClouds/{cloud}/geographies/{geography}/modelGroupNames/{modelGroupName}/rateLimits" } }
    class: write
    resource: { arg: groupId, kind: project }
    card: "Change the {modelGroupName} rate limit in project {groupId}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    tests:
      - fixture: fixtures/ai-model-rate-limit-update.http
        expect: write
        resource: 32b6e34b3d91647abb20e7b8

