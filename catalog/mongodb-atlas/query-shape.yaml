# MongoDB Atlas Administration API: query-shape
operations:
  - id: mongodb-atlas.query-shape.update
    match: { rest: { method: PATCH, path: "/api/atlas/v2/groups/{groupId}/clusters/{clusterName}/queryShapes/{queryShapeHash}" } }
    class: write
    resource: { arg: clusterName, kind: cluster }
    card: "Set the rejection status of query shape {queryShapeHash} on cluster {clusterName}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/mongodb/openapi/blob/main/openapi/v2.yaml
    notes: >-
      A rejected query shape makes the cluster refuse those queries.
    tests:
      - fixture: fixtures/query-shape-update.http
        expect: write
        resource: orders-prod
