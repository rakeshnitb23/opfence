# MongoDB Atlas Administration API: org-invite
operations:
  - id: mongodb-atlas.org-invite.create
    match: { rest: { method: POST, path: "/api/atlas/v2/orgs/{orgId}/invites" } }
    class: access
    resource: { arg: orgId, kind: organization }
    card: "Invite {body.username} to organization {orgId}"
    status: verified
