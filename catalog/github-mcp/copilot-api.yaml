# Copilot API on api.githubcopilot.com, which also serves GitHub's MCP server
# (mcp.paths keeps MCP to /mcp). Paths from @vscode/copilot-api 0.5.2, the
# published client VS Code's Copilot Chat calls it with; Copilot tokens whose
# endpoints name another API host (api.individual.githubcopilot.com and kin)
# send the same requests there, which no provider claims.
operations:
  - id: github-mcp.copilot-api.chat-completions
    match: { rest: { method: POST, path: "/chat/completions" } }
    class: read
    status: verified
    verified: 2026-10-22
    sources:
      - https://www.npmjs.com/package/@vscode/copilot-api/v/0.5.2
    notes: >-
      Model inference on the user's Copilot plan: it changes nothing the user owns. Some models
      count against the plan's premium requests.
    tests:
      - fixture: fixtures/copilot-api-chat-completions.http
        expect: read

  - id: github-mcp.copilot-api.responses
    match: { rest: { method: POST, path: "/responses" } }
