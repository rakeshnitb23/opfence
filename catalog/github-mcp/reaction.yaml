# GitHub MCP server: reaction
operations:
  - id: github-mcp.reaction.add-to-issue
    match: { mcp: { tool: add_issue_reaction } }
    class: write
    resource: { arg: repo, kind: repository }
    card: "Change reactions in {owner}/{repo}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/issues_granular.go
    notes: >-
      Feature flag issues_granular (replaces issue_write and sub_issue_write).
    tests:
      - fixture: fixtures/reaction-add-to-issue.http
        expect: write
        resource: shop

