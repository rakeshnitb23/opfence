# GitHub MCP server: issue
operations:
  - id: github-mcp.issue.read
    match: { mcp: { tool: issue_read } }
    class: read
    resource: { arg: repo, kind: repository }
    card: "Read issue {issue_number} of {owner}/{repo}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/issues.go
    tests:
      - fixture: fixtures/issue-read.http
        expect: read
        resource: shop

