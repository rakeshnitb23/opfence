        resource: shop

  - id: github-mcp.review-thread.resolve
    match: { mcp: { tool: resolve_review_thread } }
    class: write
    card: "Resolve review thread {threadID}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/pullrequests_granular.go
    notes: >-
      Feature flag pull_requests_granular (replaces update_pull_request and
      pull_request_review_write). Feature flag thread_resolution_reason adds resolutionReason.
    tests:
