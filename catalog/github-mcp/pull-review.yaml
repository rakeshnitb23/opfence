  - id: github-mcp.pull-review-comment.hide
    match: { mcp: { tool: hide_pull_request_review_comment } }
    class: write
    resource: { arg: repo, kind: repository }
    card: "Hide review comment {comment_id} in {owner}/{repo} as {classifier}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/pullrequests_granular.go
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/comment_minimize.go
    notes: >-
      Feature flag pull_requests_granular (replaces update_pull_request and
      pull_request_review_write). Hiding minimizes the comment; it can be unhidden.
    tests:
      - fixture: fixtures/pull-review-comment-hide.http
        expect: write
        resource: shop

  - id: github-mcp.pull-review-comment.unhide
    match: { mcp: { tool: unhide_pull_request_review_comment } }
    class: write
    resource: { arg: repo, kind: repository }
    card: "Unhide review comment {comment_id} in {owner}/{repo}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/pullrequests_granular.go
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/comment_minimize.go
    notes: >-
      Feature flag pull_requests_granular (replaces update_pull_request and
      pull_request_review_write).
    tests:
      - fixture: fixtures/pull-review-comment-unhide.http
        expect: write
        resource: shop

  - id: github-mcp.pull-review.hide
    match: { mcp: { tool: hide_pull_request_review } }
