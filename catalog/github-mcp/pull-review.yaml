  - id: github-mcp.review-thread.unresolve
    match: { mcp: { tool: unresolve_review_thread } }
    class: write
    card: "Unresolve review thread {threadID}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/pullrequests_granular.go
    notes: >-
      Feature flag pull_requests_granular (replaces update_pull_request and
