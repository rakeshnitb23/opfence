# GitHub MCP server: secret scanning
operations:
  - id: github-mcp.secret-scanning-alert.get
    match: { mcp: { tool: get_secret_scanning_alert } }
    class: credential
    resource: { arg: repo, kind: repository }
    card: "Read secret scanning alert {alertNumber} of {owner}/{repo}, including the secret"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/secret_scanning.go
    notes: >-
      Toolset secret_protection (not enabled by default). The server returns the alert JSON
      unchanged, including the secret field with the leaked value (its source says so).
    tests:
      - fixture: fixtures/secret-scanning-alert-get.http
        expect: credential
        resource: shop

  - id: github-mcp.secret-scanning-alert.list
    match: { mcp: { tool: list_secret_scanning_alerts } }
    class: credential
    resource: { arg: repo, kind: repository }
    card: "List secret scanning alerts of {owner}/{repo}, including the secrets"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/github/github-mcp-server/blob/v2.0.2/pkg/github/secret_scanning.go
    notes: >-
      Toolset secret_protection (not enabled by default). The server returns the alert JSON
      unchanged, including the secret field with the leaked value (its source says so).
    tests:
      - fixture: fixtures/secret-scanning-alert-list.http
        expect: credential
        resource: shop
