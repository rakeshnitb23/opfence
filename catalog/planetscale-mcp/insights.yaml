# PlanetScale MCP server: insights
operations:
  - id: planetscale-mcp.insights.get
    match: { mcp: { tool: planetscale_get_insights } }
    class: read
    resource: { arg: database, kind: database }
    card: "Show query insights for branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/mcp-server/blob/main/src/tools/get-insights.ts
      - https://planetscale.com/docs/connect/mcp
    tests:
      - fixture: fixtures/insights-get.http
        expect: read
        resource: shop-db

