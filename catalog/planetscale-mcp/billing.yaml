# PlanetScale MCP server: billing
operations:
  - id: planetscale-mcp.billing.list-invoices
    match: { mcp: { tool: planetscale_list_invoices } }
    class: read
    card: "List invoices of an organization"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/billing-list-invoices.http
        expect: read

  - id: planetscale-mcp.billing.get-invoice-line-items
    match: { mcp: { tool: planetscale_get_invoice_line_items } }
    class: read
    card: "Show the line items of an invoice"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/billing-get-invoice-line-items.http
        expect: read

  - id: planetscale-mcp.billing.get-payment-method
    match: { mcp: { tool: planetscale_get_organization_billing_payment_method } }
    class: read
    card: "Show the payment method of an organization"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/billing-get-payment-method.http
        expect: read

  - id: planetscale-mcp.billing.get-payment-method-setup
    match: { mcp: { tool: planetscale_get_payment_method_setup } }
    class: read
    card: "Check payment method setup {setup_id} of organization {organization}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/mcp-server/blob/main/src/tools/payment-methods.ts
      - https://planetscale.com/docs/connect/mcp
    notes: >-
      Returns the checkout status and, once complete, the card brand and last four digits.
    tests:
      - fixture: fixtures/billing-get-payment-method-setup.http
        expect: read

  - id: planetscale-mcp.billing.update-payment-method
    match: { mcp: { tool: planetscale_update_payment_method } }
    class: money
    card: "Start replacing the payment method of organization {organization}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/mcp-server/blob/main/src/tools/payment-methods.ts
      - https://planetscale.com/docs/connect/mcp
    notes: >-
      Starts a Stripe Checkout that adds or replaces the card the organization is charged on.
    tests:
      - fixture: fixtures/billing-update-payment-method.http
        expect: money
