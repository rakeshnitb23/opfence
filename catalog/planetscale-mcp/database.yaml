# PlanetScale MCP server: database
operations:
  - id: planetscale-mcp.database.list
    match: { mcp: { tool: planetscale_list_databases } }
    class: read
    card: "List databases in an organization"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/database-list.http
        expect: read

  - id: planetscale-mcp.database.get
    match: { mcp: { tool: planetscale_get_database } }
    class: read
    card: "Show a PlanetScale database"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/database-get.http
        expect: read

  - id: planetscale-mcp.database.list-schema-recommendations
    match: { mcp: { tool: planetscale_list_schema_recommendations } }
    class: read
    card: "List schema recommendations for a database"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/database-list-schema-recommendations.http
        expect: read

  - id: planetscale-mcp.database.execute-read-query
    match: { mcp: { tool: planetscale_execute_read_query } }
    class: read
    resource: { arg: database, kind: database }
    card: "Run read-only SQL on branch {branch} of database {database}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/planetscale/mcp-server/blob/main/src/tools/execute-read-query.ts
      - https://planetscale.com/docs/connect/mcp
    notes: >-
      Read whatever the SQL says: the server runs it with short-lived credentials for a reader
      role (Vitess) or pg_read_all_data (Postgres), so the database rejects writes. The SQL is
      not handed to the classifier: on Vitess databases it is MySQL, which quotes and comments
      differently from the Postgres the classifier parses.
    tests:
      - fixture: fixtures/database-execute-read-query.http
        expect: read
        resource: shop-db
      - fixture: fixtures/database-execute-read-query-delete.http
        expect: read
        resource: shop-db

  - id: planetscale-mcp.database.execute-write-query
    match: { mcp: { tool: planetscale_execute_write_query } }
    class: irreversible
    resource: { arg: database, kind: database }
    card: "Run SQL that changes data on branch {branch} of database {database}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/planetscale/mcp-server/blob/main/src/tools/execute-write-query.ts
      - https://github.com/planetscale/mcp-server/blob/main/src/lib/query-validator.ts
      - https://planetscale.com/docs/connect/mcp
    notes: >-
      Irreversible whatever the SQL says. The server runs it as an admin (Vitess) or postgres
      (Postgres) role, so DROP and ALTER work. Its own checks (TRUNCATE and UPDATE or DELETE
      without WHERE blocked, confirm_destructive for DELETE and DDL) are regexes on the start of
      the text that a leading comment gets past, and the model, not the user, sets
      confirm_destructive. The SQL is not handed to the classifier: on Vitess databases it is
      MySQL, which quotes and comments differently from the Postgres the classifier parses, so a
      statement could look harmless to it and still run.
    tests:
      - fixture: fixtures/database-execute-write-query.http
        expect: irreversible
        resource: shop-db
      - fixture: fixtures/database-execute-write-query-drop.http
        expect: irreversible
        resource: shop-db
      - fixture: fixtures/database-execute-write-query-grant.http
        expect: irreversible
        resource: shop-db
