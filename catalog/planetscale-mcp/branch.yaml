# PlanetScale MCP server: branch
operations:
  - id: planetscale-mcp.branch.list
    match: { mcp: { tool: planetscale_list_branches } }
    class: read
    card: "List branches of a database"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/branch-list.http
        expect: read

  - id: planetscale-mcp.branch.get
    match: { mcp: { tool: planetscale_get_branch } }
    class: read
    card: "Show a database branch"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/branch-get.http
        expect: read

  - id: planetscale-mcp.branch.get-schema
    match: { mcp: { tool: planetscale_get_branch_schema } }
    class: read
    card: "Show the schema of a database branch"
    status: verified
    verified: 2026-10-17
    sources:
      - https://planetscale.com/docs/connect/mcp
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Generated by the hosted server from the OpenAPI operation of the same name; its argument
      layout is not published, so the card names no arguments.
    tests:
      - fixture: fixtures/branch-get-schema.http
        expect: read

  - id: planetscale-mcp.branch.get-metrics
    match: { mcp: { tool: planetscale_get_branch_metrics } }
    class: read
    resource: { arg: database, kind: database }
    card: "Show infrastructure metrics of branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/mcp-server/blob/main/src/tools/get-branch-metrics.ts
      - https://planetscale.com/docs/connect/mcp
    tests:
      - fixture: fixtures/branch-get-metrics.http
        expect: read
        resource: shop-db

  - id: planetscale-mcp.branch.get-postgres-logs
    match: { mcp: { tool: planetscale_get_postgres_logs } }
    class: read
    resource: { arg: database, kind: database }
    card: "Show Postgres logs of branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/mcp-server/blob/main/src/tools/get-postgres-logs.ts
