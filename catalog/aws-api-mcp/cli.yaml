# AWS API MCP server (awslabs.aws-api-mcp-server): AWS CLI commands
operations:
  - id: aws-api-mcp.cli.call
    match: { mcp: { tool: call_aws } }
    class: irreversible
    classify: { aws_cli: cli_command, provider: aws }
    card: "Run AWS CLI command(s) {cli_command}"
    status: verified
    verified: 2026-10-22
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/server.py
      - https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/core/parser/parser.py
      - https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/core/parser/lexer.py
      - https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/core/security/policy.py
      - https://github.com/aws/aws-cli/tree/1.46.0
    notes: >-
      cli_command is one AWS CLI command or a list of them, run with the user's AWS credentials.
      Each command is read with awscli 1.46.0's command table (the version the server parses
      with) and turned into the API request it makes, which is decided by catalog/aws's rules,
      environments and overrides as if the proxy had seen it: aws rds delete-db-instance
      --skip-final-snapshot is irreversible, aws s3api list-buckets a read, aws secretsmanager
      get-secret-value credential. The high-level aws s3 commands map to the S3 operations they
      make (rm --recursive, sync --delete and rb --force to DeleteObjects), awscli
      customizations to their effect (ecr get-login-password returns a credential), and the call
      gets the strictest result. What Opfence cannot read (--cli-input-json, file:// values,
      nested shorthand, a command the server would refuse) is unknown and keeps this rule's
      class, irreversible. "--region *" repeats a command in every region and does not change
      its class. The server's own guards (READ_OPERATIONS_ONLY, REQUIRE_MUTATION_CONSENT,
      mcp-security-policy.json) are invisible to Opfence and do not lower the class.
    tests:
      - fixture: fixtures/call-aws.json
        expect: read
      - fixture: fixtures/call-aws-batch.json
        expect: read
      - fixture: fixtures/call-aws-describe.json
        expect: read
      - fixture: fixtures/call-aws-delete.json
        expect: irreversible
      - fixture: fixtures/call-aws-delete-snapshot.json
        expect: delete
      - fixture: fixtures/call-aws-s3-rm.json
        expect: irreversible
      - fixture: fixtures/call-aws-secret.json
        expect: credential
      - fixture: fixtures/call-aws-ecr-login.json
        expect: credential
      - fixture: fixtures/call-aws-public-object.json
        expect: access
      - fixture: fixtures/call-aws-input-json.json
        expect: irreversible
      - fixture: fixtures/call-aws-unknown-service.json
        expect: irreversible

  - id: aws-api-mcp.cli.suggest
    match: { mcp: { tool: suggest_aws_commands } }
    class: read
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/server.py
    notes: >-
      Sends the natural-language query to AWS's suggestion endpoint and returns candidate CLI
      commands; it runs nothing.
    tests:
      - fixture: fixtures/suggest-aws-commands.json
        expect: read

  - id: aws-api-mcp.plan.get
    match: { mcp: { tool: get_execution_plan } }
    class: read
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/server.py
      - https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/core/agent_scripts/manager.py
    notes: >-
      Only registered with EXPERIMENTAL_AGENT_SCRIPTS=true. Returns the text of a bundled or
      AWS_API_MCP_AGENT_SCRIPTS_DIR script plan; the agent then runs its steps through call_aws.
    tests:
      - fixture: fixtures/get-execution-plan.json
        expect: read
