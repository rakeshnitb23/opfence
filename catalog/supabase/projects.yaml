  - id: supabase.projects.remove-project-addon
    match: { rest: { method: DELETE, path: "/v1/projects/{ref}/billing/addons/{addon_variant}" } }
    class: money
    when:
      - if: { arg: addon_variant, matches: "^pitr" }
        class: irreversible
    resource: { arg: ref, kind: project }
    card: "Remove add-on {addon_variant} from project {ref}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://api.supabase.com/api/v1-json
    notes: >-
      Removing the point-in-time recovery add-on discards the recovery window, so it is
      irreversible.
    tests:
      - fixture: fixtures/projects-remove-project-addon.http
        expect: money
        resource: "abcdefghijklmnopqrst"
      - fixture: fixtures/projects-remove-project-addon-pitr.http
