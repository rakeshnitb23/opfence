  - id: supabase.database.run-query
    match: { rest: { method: POST, path: "/v1/projects/{ref}/database/query" } }
    class: unknown
    classify: { sql: body.query }
    resource: { arg: ref, kind: project }
    card: "Run SQL on project {ref}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://api.supabase.com/api/v1-json
    notes: >-
      The class comes from the SQL, read as Postgres: SELECT is read, INSERT and UPDATE ... WHERE
      are write, DELETE ... WHERE is delete, DROP, TRUNCATE and UPDATE or DELETE without WHERE are
      irreversible, GRANT, REVOKE and role changes are access, reading Vault's decrypted secrets is
      credential, and anything the classifier cannot read is unknown.
    tests:
      - fixture: fixtures/database-run-query.http
        expect: read
        resource: "abcdefghijklmnopqrst"
      - fixture: fixtures/database-run-query-delete-all.http
        expect: irreversible
        resource: "abcdefghijklmnopqrst"
      - fixture: fixtures/database-run-query-vault.http
        expect: credential
        resource: "abcdefghijklmnopqrst"
      - fixture: fixtures/database-run-query-grant.http
        expect: access
        resource: "abcdefghijklmnopqrst"

