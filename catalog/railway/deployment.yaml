# Railway GraphQL API: deployment
operations:
  - id: railway.deployment.remove
    match: { graphql: { type: mutation, field: deploymentRemove } }
    class: delete
    resource: { arg: id, kind: deployment }
    card: "Remove Railway deployment {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/deployment-remove.http
        expect: delete
        resource: dep-123

