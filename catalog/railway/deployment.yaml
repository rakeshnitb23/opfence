# Railway GraphQL API: deployment
operations:
  - id: railway.deployment.remove
    match: { graphql: { type: mutation, field: deploymentRemove } }
    class: delete
    resource: { arg: id, kind: deployment }
    card: "Remove Railway deployment {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/deployment-remove.http
        expect: delete
        resource: dep-123

  - id: railway.deployment.stop
    match: { graphql: { type: mutation, field: deploymentStop } }
    class: write
    resource: { arg: id, kind: deployment }
    card: "Stop Railway deployment {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/deployment-stop.http
        expect: write
        resource: dep-123

  - id: railway.deployment.redeploy
    match: { graphql: { type: mutation, field: deploymentRedeploy } }
    class: write
    resource: { arg: id, kind: deployment }
    card: "Redeploy Railway deployment {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/deployment-redeploy.http
        expect: write
        resource: dep-123

  - id: railway.deployment.restart
    match: { graphql: { type: mutation, field: deploymentRestart } }
    class: write
    resource: { arg: id, kind: deployment }
    card: "Restart Railway deployment {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/deployment-restart.http
        expect: write
        resource: dep-123

  - id: railway.deployment.rollback
    match: { graphql: { type: mutation, field: deploymentRollback } }
    class: write
    resource: { arg: id, kind: deployment }
    card: "Roll back to Railway deployment {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/deployment-rollback.http
        expect: write
        resource: dep-122

  - id: railway.deployment.cancel
    match: { graphql: { type: mutation, field: deploymentCancel } }
    class: write
    resource: { arg: id, kind: deployment }
    card: "Cancel Railway deployment {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/deployment-cancel.http
        expect: write
        resource: dep-123

  - id: railway.deployment.approve
    match: { graphql: { type: mutation, field: deploymentApprove } }
    class: write
    resource: { arg: id, kind: deployment }
    card: "Approve Railway deployment {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    notes: >-
      Lets a deployment that waits for approval go ahead; deploying code is a
      write, as railway.service-instance.deploy.
    tests:
      - fixture: fixtures/deployment-approve.http
        expect: write
        resource: dep-123

  - id: railway.deployment.execute
    match: { graphql: { type: mutation, field: deploymentInstanceExecutionCreate } }
    class: write
    resource: { arg: input.serviceInstanceId, kind: service-instance }
    card: "Run the deployed command of service instance {input.serviceInstanceId} now"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    notes: >-
      Runs the deployed code (a cron or function run) once more, as a restart is
      a write.
    tests:
      - fixture: fixtures/deployment-execute.http
        expect: write
        resource: si-cron

  - id: railway.deployment.snapshot
    match: { graphql: { type: query, field: deploymentSnapshot } }
    class: credential
    resource: { arg: deploymentId, kind: deployment }
    card: "Read the variables deployment {deploymentId} was built with"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    notes: >-
      DeploymentSnapshot.variables holds the deployment's variable values.
    tests:
      - fixture: fixtures/deployment-snapshot.http
        expect: credential
        resource: dep-123
