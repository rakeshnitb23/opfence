# Railway GraphQL API: volume
operations:
  - id: railway.volume.delete
    match: { graphql: { type: mutation, field: volumeDelete } }
    class: irreversible
    resource: { arg: volumeId, kind: volume }
    card: "Delete Railway volume {volumeId} and all data on it"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://railway.com/changelog/2025-08-22-restore-deleted-volumes
    notes: >-
      The PocketOS call (April 2026). Railway can restore deleted volumes for
      48 hours from its dashboard, but not through the API and not on the
      legacy endpoint PocketOS hit, so the catalog treats it as irreversible.
    tests:
      - fixture: fixtures/volume-delete.http
        expect: irreversible
        resource: vol-pg-data

  - id: railway.volume.create
    match: { graphql: { type: mutation, field: volumeCreate } }
    class: write
    resource: { arg: input.serviceId, kind: service }
    card: "Create a Railway volume at {input.mountPath} for service {input.serviceId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/volume-create.http
        expect: write
        resource: svc-api

  - id: railway.volume.pitr-restore
    match: { graphql: { type: mutation, field: volumeInstancePITRRestore } }
    class: write
    resource: { arg: volumeInstanceId, kind: volume-instance }
    card: "Restore volume instance {volumeInstanceId} to {targetTimestamp} as new service {newServiceName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    notes: >-
      Point-in-time restore creates a new service; the original volume is left
      as it is.
    tests:
      - fixture: fixtures/volume-pitr-restore.http
        expect: write
        resource: vi-pg-data

  - id: railway.volume.instance-update
    match: { graphql: { type: mutation, field: volumeInstanceUpdate } }
    class: write
    when:
      - if: { arg: input.state, present: true }
        class: irreversible
    resource: { arg: volumeId, kind: volume }
    card: "Change mount or service of volume {volumeId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    notes: >-
      Moving or mounting a volume is a write, as railway-mcp's update_volume
      (leaving out serviceId detaches it). The input also takes a raw state
      (DELETED, DELETING, MIGRATING and others) that Opfence cannot tell is
      safe, so any state is irreversible.
    tests:
      - fixture: fixtures/volume-instance-update.http
        expect: write
        resource: vol-pg-data
      - fixture: fixtures/volume-instance-update-state.http
        expect: irreversible
        resource: vol-pg-data

  - id: railway.volume.update
    match: { graphql: { type: mutation, field: volumeUpdate } }
    class: write
    resource: { arg: volumeId, kind: volume }
    card: "Rename volume {volumeId} to {input.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/volume-update.http
        expect: write
        resource: vol-pg-data
