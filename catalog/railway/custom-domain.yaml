# Railway GraphQL API: custom-domain
operations:
  - id: railway.custom-domain.create
    match: { graphql: { type: mutation, field: customDomainCreate } }
    class: access
    resource: { arg: input.serviceId, kind: service }
    card: "Point {input.domain} at service {input.serviceId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    notes: >-
      Makes the service reachable from the internet.
    tests:
      - fixture: fixtures/custom-domain-create.http
        expect: access
        resource: svc-api

  - id: railway.custom-domain.delete
    match: { graphql: { type: mutation, field: customDomainDelete } }
    class: delete
    resource: { arg: id, kind: domain }
    card: "Delete custom domain {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    tests:
      - fixture: fixtures/custom-domain-delete.http
        expect: delete
        resource: cd-1

  - id: railway.custom-domain.issue-certificate
    match: { graphql: { type: mutation, field: customDomainIssueCertificate } }
    class: write
    resource: { arg: id, kind: custom-domain }
    card: "Issue a new certificate for custom domain {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    notes: >-
      As railway-mcp's domain retry-certificate.
    tests:
      - fixture: fixtures/custom-domain-issue-certificate.http
        expect: write
        resource: cd-1

  - id: railway.custom-domain.update
    match: { graphql: { type: mutation, field: customDomainUpdate } }
    class: access
    resource: { arg: id, kind: custom-domain }
    card: "Point custom domain {id} at port {targetPort}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://docs.railway.com/integrations/api
    notes: >-
      Changes which port the public domain reaches, as railway-mcp's domain
      update (access).
    tests:
      - fixture: fixtures/custom-domain-update.http
        expect: access
        resource: cd-1
