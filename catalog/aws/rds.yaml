  - id: aws.rds.reboot-db-instance
    match: { aws: { service: rds, action: RebootDBInstance } }
    class: write
    resource: { arg: DBInstanceIdentifier, kind: db-instance }
    card: "Reboot RDS instance {DBInstanceIdentifier}"
