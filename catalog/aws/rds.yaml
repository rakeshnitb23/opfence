  - id: aws.rds.restore-db-instance-from-db-snapshot
    match: { aws: { service: rds, action: RestoreDBInstanceFromDBSnapshot } }
    class: money
    card: "Restore snapshot {DBSnapshotIdentifier} as {DBInstanceIdentifier}"
