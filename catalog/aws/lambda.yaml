    notes: >-
      The response includes environment variables, which often hold secrets.
    tests:
      - fixture: fixtures/lambda-get-function-configuration.http
        expect: credential
        resource: billing

  - id: aws.lambda.list-functions
    match: { aws: { service: lambda, method: GET, path: /2015-03-31/functions } }
    class: credential
    card: "List Lambda functions and their environments"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/lambda/2015-03-31/service-2.json
    notes: >-
      Every function in the response includes its environment variables.
    tests:
      - fixture: fixtures/lambda-list-functions.http
