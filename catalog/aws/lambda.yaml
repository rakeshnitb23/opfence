# AWS APIs: lambda
operations:
  - id: aws.lambda.delete-function
    match: { aws: { service: lambda, method: DELETE, path: "/2015-03-31/functions/{FunctionName}" } }
    class: delete
    resource: { arg: FunctionName, kind: function }
    card: "Delete Lambda function {FunctionName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/lambda/2015-03-31/service-2.json
    notes: >-
      The code is usually still in the repository and can be redeployed.
    tests:
      - fixture: fixtures/lambda-delete-function.http
        expect: delete
        resource: billing

  - id: aws.lambda.get-function
    match: { aws: { service: lambda, method: GET, path: "/2015-03-31/functions/{FunctionName}" } }
    class: credential
    resource: { arg: FunctionName, kind: function }
    card: "Read Lambda function {FunctionName} and its environment"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/lambda/2015-03-31/service-2.json
    notes: >-
      The response includes environment variables, which often hold secrets.
    tests:
      - fixture: fixtures/lambda-get-function.http
        expect: credential
        resource: billing

  - id: aws.lambda.get-function-configuration
    match: { aws: { service: lambda, method: GET, path: "/2015-03-31/functions/{FunctionName}/configuration" } }
    class: credential
    resource: { arg: FunctionName, kind: function }
    card: "Read the configuration of {FunctionName}"
    status: verified
    verified: 2026-10-16
    sources:
