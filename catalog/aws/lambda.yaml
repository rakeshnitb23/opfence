  - id: aws.lambda.create-function-url-config
    match: { aws: { service: lambda, method: POST, path: "/2021-10-31/functions/{FunctionName}/url" } }
    class: write
    when:
      - if: { arg: body.AuthType, equals: NONE }
        class: access
    resource: { arg: FunctionName, kind: function }
    card: "Give {FunctionName} a function URL"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/lambda/2015-03-31/service-2.json
    notes: >-
      AuthType NONE lets anyone on the internet call the function.
    tests:
      - fixture: fixtures/lambda-create-function-url-config.http
        expect: write
        resource: billing
      - fixture: fixtures/lambda-create-function-url-config-public.http
        expect: access
        resource: billing

  - id: aws.lambda.update-function-url-config
    match: { aws: { service: lambda, method: PUT, path: "/2021-10-31/functions/{FunctionName}/url" } }
    class: write
    when:
      - if: { arg: body.AuthType, equals: NONE }
