# AWS APIs: secretsmanager
operations:
  - id: aws.secretsmanager.get-secret-value
    match: { aws: { service: secretsmanager, action: GetSecretValue } }
    class: credential
    resource: { arg: SecretId, kind: secret }
    card: "Read secret {SecretId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/secretsmanager/2017-10-17/service-2.json
    tests:
      - fixture: fixtures/secretsmanager-get-secret-value.http
        expect: credential
        resource: prod/db

  - id: aws.secretsmanager.batch-get-secret-value
    match: { aws: { service: secretsmanager, action: BatchGetSecretValue } }
    class: credential
    card: "Read several secrets"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/secretsmanager/2017-10-17/service-2.json
    notes: >-
      Listed because the BatchGet prefix would otherwise make it a read.
    tests:
      - fixture: fixtures/secretsmanager-batch-get-secret-value.http
        expect: credential

  - id: aws.secretsmanager.put-secret-value
    match: { aws: { service: secretsmanager, action: PutSecretValue } }
    class: credential
    resource: { arg: SecretId, kind: secret }
    card: "Store a new value in secret {SecretId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/secretsmanager/2017-10-17/service-2.json
    tests:
      - fixture: fixtures/secretsmanager-put-secret-value.http
        expect: credential
        resource: prod/db

  - id: aws.secretsmanager.create-secret
    match: { aws: { service: secretsmanager, action: CreateSecret } }
    class: write
    when:
      - if: { arg: SecretString, present: true }
        class: credential
      - if: { arg: SecretBinary, present: true }
        class: credential
    card: "Create secret {Name}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/secretsmanager/2017-10-17/service-2.json
    tests:
      - fixture: fixtures/secretsmanager-create-secret.http
        expect: write
      - fixture: fixtures/secretsmanager-create-secret-with-value.http
        expect: credential

  - id: aws.secretsmanager.update-secret
    match: { aws: { service: secretsmanager, action: UpdateSecret } }
    class: write
    when:
      - if: { arg: SecretString, present: true }
        class: credential
      - if: { arg: SecretBinary, present: true }
        class: credential
    resource: { arg: SecretId, kind: secret }
    card: "Change secret {SecretId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/secretsmanager/2017-10-17/service-2.json
    tests:
      - fixture: fixtures/secretsmanager-update-secret.http
        expect: write
        resource: prod/db
      - fixture: fixtures/secretsmanager-update-secret-with-value.http
        expect: credential
        resource: prod/db

  - id: aws.secretsmanager.rotate-secret
    match: { aws: { service: secretsmanager, action: RotateSecret } }
    class: credential
    resource: { arg: SecretId, kind: secret }
    card: "Rotate secret {SecretId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/secretsmanager/2017-10-17/service-2.json
    tests:
      - fixture: fixtures/secretsmanager-rotate-secret.http
        expect: credential
        resource: prod/db

  - id: aws.secretsmanager.delete-secret
    match: { aws: { service: secretsmanager, action: DeleteSecret } }
    class: delete
    when:
      - if: { arg: ForceDeleteWithoutRecovery, equals: "true" }
        class: irreversible
    resource: { arg: SecretId, kind: secret }
    card: "Delete secret {SecretId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/secretsmanager/2017-10-17/service-2.json
    notes: >-
      By default the secret can be restored for 7 to 30 days;
      ForceDeleteWithoutRecovery skips that.
    tests:
      - fixture: fixtures/secretsmanager-delete-secret.http
        expect: delete
        resource: prod/db
      - fixture: fixtures/secretsmanager-delete-secret-force.http
        expect: irreversible
        resource: prod/db

  - id: aws.secretsmanager.put-resource-policy
    match: { aws: { service: secretsmanager, action: PutResourcePolicy } }
    class: access
    resource: { arg: SecretId, kind: secret }
    card: "Change who can use secret {SecretId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/secretsmanager/2017-10-17/service-2.json
    tests:
      - fixture: fixtures/secretsmanager-put-resource-policy.http
        expect: access
        resource: prod/db
