# AWS APIs: ec2
operations:
  - id: aws.ec2.terminate-instances
    match: { aws: { service: ec2, action: TerminateInstances } }
    class: irreversible
    card: "Terminate EC2 instances {InstanceId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/ec2/2016-11-15/service-2.json
    notes: >-
      Instance-store data and volumes marked delete-on-termination are
      destroyed with the instance.
    tests:
      - fixture: fixtures/ec2-terminate-instances.http
        expect: irreversible

  - id: aws.ec2.delete-volume
    match: { aws: { service: ec2, action: DeleteVolume } }
    class: irreversible
    resource: { arg: VolumeId, kind: volume }
    card: "Delete EBS volume {VolumeId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/ec2/2016-11-15/service-2.json
    tests:
      - fixture: fixtures/ec2-delete-volume.http
        expect: irreversible
        resource: vol-0abc1234def567890

  - id: aws.ec2.delete-snapshot
