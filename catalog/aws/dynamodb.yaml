# AWS APIs: dynamodb
operations:
  - id: aws.dynamodb.delete-table
    match: { aws: { service: dynamodb, action: DeleteTable } }
    class: irreversible
    resource: { arg: TableName, kind: table }
    card: "Delete DynamoDB table {TableName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    notes: >-
      Point-in-time recovery data goes with the table.
    tests:
      - fixture: fixtures/dynamodb-delete-table.http
        expect: irreversible
        resource: orders

  - id: aws.dynamodb.delete-backup
    match: { aws: { service: dynamodb, action: DeleteBackup } }
    class: irreversible
    card: "Delete DynamoDB backup {BackupArn}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    tests:
      - fixture: fixtures/dynamodb-delete-backup.http
        expect: irreversible

  - id: aws.dynamodb.delete-item
    match: { aws: { service: dynamodb, action: DeleteItem } }
    class: delete
    resource: { arg: TableName, kind: table }
    card: "Delete an item from {TableName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    tests:
      - fixture: fixtures/dynamodb-delete-item.http
        expect: delete
        resource: orders

  - id: aws.dynamodb.batch-write-item
    match: { aws: { service: dynamodb, action: BatchWriteItem } }
    class: delete
    card: "Write or delete items in a batch"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    notes: >-
      A batch can carry deletes; Opfence does not look inside it.
    tests:
      - fixture: fixtures/dynamodb-batch-write-item.http
        expect: delete

  - id: aws.dynamodb.put-item
    match: { aws: { service: dynamodb, action: PutItem } }
    class: write
    resource: { arg: TableName, kind: table }
    card: "Write an item to {TableName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    tests:
      - fixture: fixtures/dynamodb-put-item.http
        expect: write
        resource: orders

  - id: aws.dynamodb.update-item
    match: { aws: { service: dynamodb, action: UpdateItem } }
    class: write
    resource: { arg: TableName, kind: table }
    card: "Update an item in {TableName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    tests:
      - fixture: fixtures/dynamodb-update-item.http
        expect: write
        resource: orders

  - id: aws.dynamodb.update-table
    match: { aws: { service: dynamodb, action: UpdateTable } }
    class: write
    resource: { arg: TableName, kind: table }
    card: "Change DynamoDB table {TableName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    tests:
      - fixture: fixtures/dynamodb-update-table.http
        expect: write
        resource: orders

  - id: aws.dynamodb.update-continuous-backups
    match: { aws: { service: dynamodb, action: UpdateContinuousBackups } }
    class: write
    when:
      - if: { arg: PointInTimeRecoverySpecification.PointInTimeRecoveryEnabled, equals: "false" }
        class: irreversible
    resource: { arg: TableName, kind: table }
    card: "Change point-in-time recovery of {TableName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    notes: >-
      Turning point-in-time recovery off discards the recovery window.
    tests:
      - fixture: fixtures/dynamodb-update-continuous-backups.http
        expect: write
        resource: orders
      - fixture: fixtures/dynamodb-update-continuous-backups-disable.http
        expect: irreversible
        resource: orders

  - id: aws.dynamodb.execute-statement
    match: { aws: { service: dynamodb, action: ExecuteStatement } }
    class: unknown
    when:
      - if: { arg: Statement, matches: "/\\*" }
        class: unknown
    classify: { sql: Statement }
    card: "Run a PartiQL statement"
    status: verified
    verified: 2026-10-21
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
      - https://github.com/partiql/partiql-lang-kotlin/blob/main/partiql-parser/src/main/antlr/PartiQLTokens.g4
    notes: >-
      The class comes from the statement, read by the Postgres classifier: DynamoDB's PartiQL
      takes only SELECT, INSERT, UPDATE and DELETE, which both read alike. Except for block
      comments: Postgres nests them and PartiQL ends one at the first */, so
      "/* /* */ DELETE ... -- */ SELECT ..." is a read to one and a delete to the other. A
      statement with a block comment is unknown.
    tests:
      - fixture: fixtures/dynamodb-execute-statement.http
        expect: read
      - fixture: fixtures/dynamodb-execute-statement-delete.http
        expect: delete
      - fixture: fixtures/dynamodb-execute-statement-comment.http
        expect: unknown

  - id: aws.dynamodb.put-resource-policy
    match: { aws: { service: dynamodb, action: PutResourcePolicy } }
    class: access
    card: "Change who can use {ResourceArn}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/boto/botocore/blob/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    tests:
      - fixture: fixtures/dynamodb-put-resource-policy.http
        expect: access
