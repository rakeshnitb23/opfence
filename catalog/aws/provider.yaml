provider: aws
title: AWS
docs: https://docs.aws.amazon.com/
hosts: ["*.amazonaws.com", "*.api.aws"]
sigv4: true                        # every request is SigV4-signed; the service comes from the signature
detect:
  env: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN]
  prefixes: [AKIA, ASIA]
defaults:
  aws_read_actions: read           # Describe*, Get*, List*, Head*, BatchGet*, Scan, Query; exceptions are listed
# Service models the rules were built from (opfence catalog check-sources);
# the rules cover each service's riskiest operations, the rest are unknown.
schemas:
  - kind: botocore
    service: cloudformation
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/cloudformation/2010-05-15/service-2.json
    coverage: partial
  - kind: botocore
    service: dynamodb
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/dynamodb/2012-08-10/service-2.json
    coverage: partial
  - kind: botocore
    service: ec2
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/ec2/2016-11-15/service-2.json
    coverage: partial
  - kind: botocore
    service: iam
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/iam/2010-05-08/service-2.json
    coverage: partial
  - kind: botocore
    service: kms
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/kms/2014-11-01/service-2.json
    coverage: partial
  - kind: botocore
    service: lambda
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/lambda/2015-03-31/service-2.json
    coverage: partial
  - kind: botocore
    service: rds
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/rds/2014-10-31/service-2.json
    coverage: partial
  - kind: botocore
    service: route53
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/route53/2013-04-01/service-2.json
    coverage: partial
  - kind: botocore
    service: s3
    url: https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/s3/2006-03-01/service-2.json
