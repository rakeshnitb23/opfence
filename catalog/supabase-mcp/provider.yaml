provider: supabase-mcp
title: Supabase MCP
docs: https://supabase.com/docs/guides/getting-started/mcp
hosts: [mcp.supabase.com]
auth:
  - header: Authorization
    scheme: Bearer
# SUPABASE_ACCESS_TOKEN (sbp_...) is detected by the supabase provider, the
# Management API the same token serves; this server takes its keys too.
secrets_from: [supabase]
mcp:
  names: [supabase]
  package: "@supabase/mcp-server-supabase"
