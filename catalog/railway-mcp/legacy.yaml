      - https://github.com/railwayapp/railway-mcp-server/blob/v0.1.8/src/cli/core.ts
    notes: >-
      Registered by @railway/mcp-server 0.1.x, which runs the Railway CLI in
      workspacePath; 0.1.12 is a shim that starts railway mcp instead. Without
      serviceName it only lists services. @railway/mcp-server 0.1.0 to 0.1.8
      built each Railway CLI command as one string and ran it with exec(), so a
