  - id: railway-mcp.legacy.set-variables
    match: { mcp: { tool: set-variables } }
    class: write
    when:
      - if: { arg: service, matches: '[;&|<>`"\n\r]|\$\(' }
        class: irreversible
      - if: { arg: environment, matches: '[;&|<>`"\n\r]|\$\(' }
        class: irreversible
      - if: { arg: variables, matches: '[`"]|\$\(' }
        class: irreversible
    resource: { arg: service, kind: service }
    card: "Set variables {variables} on service {service}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/railway-mcp-server/blob/v0.1.11/src/tools/set-variables.ts
      - https://github.com/railwayapp/railway-mcp-server/blob/v0.1.8/src/cli/core.ts
    notes: >-
      Registered by @railway/mcp-server 0.1.x, which runs the Railway CLI in
      workspacePath; 0.1.12 is a shim that starts railway mcp instead. Railway
      variables are not marked as secrets, so setting one is a write.
      @railway/mcp-server 0.1.0 to 0.1.8 built each Railway CLI command as one
      string and ran it with exec(), so a shell metacharacter in service,
      environment, variables ran a command of its own (fixed in 0.1.11, which
      passes argv arrays); such a value makes the call irreversible.
    tests:
      - fixture: fixtures/legacy-set-variables.json
        expect: write
        resource: api
      - fixture: fixtures/legacy-set-variables-injection.json
        expect: irreversible
        resource: api
