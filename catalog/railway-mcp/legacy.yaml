# Railway MCP server: legacy
operations:
  - id: railway-mcp.legacy.check-status
    match: { mcp: { tool: check-railway-status } }
    class: read
    card: "Check the Railway CLI and login"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/railway-mcp-server/blob/v0.1.11/src/tools/check-railway-status.ts
    notes: >-
      Registered by @railway/mcp-server 0.1.x, which runs the Railway CLI in
      workspacePath; 0.1.12 is a shim that starts railway mcp instead.
    tests:
      - fixture: fixtures/legacy-check-status.json
        expect: read

  - id: railway-mcp.legacy.create-project
    match: { mcp: { tool: create-project-and-link } }
    class: write
    when:
      - if: { arg: projectName, matches: '[;&|<>`"\n\r]|\$\(' }
        class: irreversible
    resource: { arg: projectName, kind: project }
    card: "Create Railway project {projectName} and link it"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/railway-mcp-server/blob/v0.1.11/src/tools/create-project-and-link.ts
      - https://github.com/railwayapp/railway-mcp-server/blob/v0.1.8/src/cli/core.ts
    notes: >-
      Registered by @railway/mcp-server 0.1.x, which runs the Railway CLI in
      workspacePath; 0.1.12 is a shim that starts railway mcp instead. Runs
      railway init and railway link. @railway/mcp-server 0.1.0 to 0.1.8 built
      each Railway CLI command as one string and ran it with exec(), so a shell
      metacharacter in projectName ran a command of its own (fixed in 0.1.11,
      which passes argv arrays); such a value makes the call irreversible.
    tests:
      - fixture: fixtures/legacy-create-project.json
        expect: write
        resource: shop-api
      - fixture: fixtures/legacy-create-project-injection.json
        expect: irreversible
        resource: shop-api; rm -rf ~

  - id: railway-mcp.legacy.create-environment
    match: { mcp: { tool: create-environment } }
    class: write
    when:
      - if: { arg: environmentName, matches: '[;&|<>`"\n\r]|\$\(' }
        class: irreversible
      - if: { arg: duplicateEnvironment, matches: '[;&|<>`"\n\r]|\$\(' }
        class: irreversible
      - if: { arg: serviceVariables.service, matches: '[;&|<>`"\n\r]|\$\(' }
        class: irreversible
      - if: { arg: serviceVariables.variable, matches: '[;&|<>`"\n\r]|\$\(' }
        class: irreversible
    resource: { arg: environmentName, kind: environment }
    card: "Create environment {environmentName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/railwayapp/railway-mcp-server/blob/v0.1.11/src/tools/create-environment.ts
      - https://github.com/railwayapp/railway-mcp-server/blob/v0.1.8/src/cli/core.ts
    notes: >-
      Registered by @railway/mcp-server 0.1.x, which runs the Railway CLI in
      workspacePath; 0.1.12 is a shim that starts railway mcp instead.
      @railway/mcp-server 0.1.0 to 0.1.8 built each Railway CLI command as one
      string and ran it with exec(), so a shell metacharacter in
      environmentName, duplicateEnvironment, serviceVariables.service,
      serviceVariables.variable ran a command of its own (fixed in 0.1.11, which
      passes argv arrays); such a value makes the call irreversible.
    tests:
      - fixture: fixtures/legacy-create-environment.json
        expect: write
        resource: staging
      - fixture: fixtures/legacy-create-environment-injection.json
        expect: irreversible
        resource: staging

