# Vercel MCP server (mcp.vercel.com): domain
operations:
  - id: vercel-mcp.domain.buy-many
    match: { mcp: { tool: buy_domains } }
    class: money
    card: "Buy domains (legacy tool)"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/domains
    notes: >-
      Docs say this tool no longer executes purchases and points to
      get_purchase_quote and buy_domain. It stays money because its name and the
      REST call it was built on (POST /v1/registrar/domains/buy) buy domains,
      and the hosted server can change without notice.
    tests:
      - fixture: fixtures/domain-buy-many.http
        expect: money

  - id: vercel-mcp.domain.buy-single
    match: { mcp: { tool: buy_single_domain } }
    class: money
    resource: { arg: domain, kind: domain }
    card: "Buy domain {domain} (legacy tool)"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/domains
    notes: >-
      Docs say this tool no longer executes purchases and points to
      get_purchase_quote and buy_domain. It stays money because its name and the
      REST call it was built on buy a domain, and the hosted server can change
      without notice.
    tests:
      - fixture: fixtures/domain-buy-single.http
        expect: money
        resource: shop-example.com

