  - id: vercel-mcp.domain.add
    match: { mcp: { tool: create_or_transfer_domain } }
    class: write
    when:
      - if: { arg: requestBody.method, equals: transfer-in }
        class: money
    resource: { arg: requestBody.name, kind: domain }
    card: "Add domain {requestBody.name} ({requestBody.method})"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/domains
    notes: >-
      Adding a domain the team already controls is a write. method transfer-in
      transfers the registration to Vercel and charges for it, like
      vercel.domain.transfer-in.
    tests:
      - fixture: fixtures/domain-add.http
        expect: write
        resource: shop.example.com
      - fixture: fixtures/domain-add-transfer.http
        expect: money
        resource: shop.example.com
