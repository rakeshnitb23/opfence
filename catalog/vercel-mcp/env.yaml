# Vercel MCP server (mcp.vercel.com): env
operations:
  - id: vercel-mcp.env.list
    match: { mcp: { tool: filter_project_envs } }
    class: read
    when:
      - if: { arg: decrypt, equals: "true" }
        class: credential
    resource: { arg: idOrName, kind: project }
    card: "List environment variables of {idOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/environment-variables
    notes: >-
      Without decrypt=true, encrypted values come back encrypted; with it, every
      value is plain text (as vercel.env.list).
    tests:
      - fixture: fixtures/env-list.http
        expect: read
        resource: shop-web
      - fixture: fixtures/env-list-decrypt.http
        expect: credential
        resource: shop-web

  - id: vercel-mcp.env.read
    match: { mcp: { tool: get_project_env } }
    class: credential
    resource: { arg: idOrName, kind: project }
    card: "Read the decrypted value of variable {id} in project {idOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/environment-variables
    tests:
      - fixture: fixtures/env-read.http
        expect: credential
        resource: shop-web

  - id: vercel-mcp.env.create
    match: { mcp: { tool: create_project_env } }
    class: write
    when:
      - if: { arg: requestBody.type, in: [encrypted, sensitive, secret] }
        class: credential
      - if: { arg: requestBody.type, absent: true }
        class: credential
    resource: { arg: idOrName, kind: project }
    card: "Add variables {requestBody.key} to {idOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/environment-variables
    notes: >-
      A write for plain variables; encrypted, sensitive and secret variables are
      secrets, so setting one is credential (as vercel.env.create). A variable
      sent without a type is treated as a secret, since Vercel encrypts
      variables by default. requestBody can be one object or a list; a type on
      any item counts.
    tests:
      - fixture: fixtures/env-create.http
        expect: write
        resource: shop-web
      - fixture: fixtures/env-create-sensitive.http
        expect: credential
        resource: shop-web
      - fixture: fixtures/env-create-batch.http
        expect: credential
        resource: shop-web
      - fixture: fixtures/env-create-untyped.http
        expect: credential
        resource: shop-web

  - id: vercel-mcp.env.update
    match: { mcp: { tool: edit_project_env } }
    class: write
    when:
      - if: { arg: requestBody.type, in: [encrypted, sensitive, secret] }
        class: credential
      - if: { arg: requestBody.type, absent: true }
        class: credential
    resource: { arg: idOrName, kind: project }
    card: "Change variable {id} of {idOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/environment-variables
    notes: >-
      As create_project_env. An edit without a type may change the value of an
      existing secret, which the call does not show, so it is credential unless
      the edit sets type plain.
    tests:
      - fixture: fixtures/env-update.http
        expect: write
        resource: shop-web
      - fixture: fixtures/env-update-encrypted.http
        expect: credential
        resource: shop-web
      - fixture: fixtures/env-update-untyped.http
        expect: credential
        resource: shop-web

  - id: vercel-mcp.env.read-shared
    match: { mcp: { tool: get_shared_env_var } }
    class: credential
    resource: { arg: id, kind: shared-env }
    card: "Read the decrypted value of shared variable {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/environment-variables
    tests:
      - fixture: fixtures/env-read-shared.http
        expect: credential
        resource: env_shared_123
