  - id: vercel-mcp.feature-flag.list-sdk-keys
    match: { mcp: { tool: list_feature_flag_sdk_keys } }
    class: credential
    resource: { arg: projectIdOrName, kind: project }
    card: "List flag SDK keys of {projectIdOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/feature-flags
    notes: >-
      Vercel does not say whether the listing includes key values; SDK keys
      grant read access to flag configuration, so the listing is treated as
      revealing them.
    tests:
      - fixture: fixtures/feature-flag-list-sdk-keys.http
        expect: credential
        resource: prj_shopweb

  - id: vercel-mcp.feature-flag.create-sdk-key
    match: { mcp: { tool: create_sdk_key } }
    class: credential
    resource: { arg: projectIdOrName, kind: project }
    card: "Create a flag SDK key for {projectIdOrName}"
    status: verified
