  - id: vercel-mcp.feature-flag.get
    match: { mcp: { tool: get_flag } }
    class: read
    resource: { arg: projectIdOrName, kind: project }
    card: "Show flag {flagIdOrSlug} of {projectIdOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/feature-flags
    tests:
      - fixture: fixtures/feature-flag-get.http
