# Vercel MCP server (mcp.vercel.com): feature-flag
operations:
  - id: vercel-mcp.feature-flag.list
    match: { mcp: { tool: list_flags } }
    class: read
    resource: { arg: projectIdOrName, kind: project }
    card: "List feature flags of {projectIdOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/feature-flags
    tests:
      - fixture: fixtures/feature-flag-list.http
        expect: read
        resource: prj_shopweb

  - id: vercel-mcp.feature-flag.list-v2
    match: { mcp: { tool: list_flags_v2 } }
    class: read
    resource: { arg: projectIdOrName, kind: project }
    card: "List feature flags of {projectIdOrName}"
