  - id: vercel-mcp.feature-flag.create
    match: { mcp: { tool: create_flag } }
    class: write
    resource: { arg: projectIdOrName, kind: project }
    card: "Create flag {requestBody.slug} in {projectIdOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/feature-flags
    tests:
      - fixture: fixtures/feature-flag-create.http
        expect: write
        resource: prj_shopweb

  - id: vercel-mcp.feature-flag.update
    match: { mcp: { tool: update_flag } }
    class: write
    resource: { arg: projectIdOrName, kind: project }
    card: "Update flag {flagIdOrSlug} in {projectIdOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/feature-flags
    notes: >-
      Changes a flag's rules or archives it; Vercel keeps flag versions
      (list_flag_versions), and only DELETE removes a flag (vercel.feature-
      flag.delete).
    tests:
      - fixture: fixtures/feature-flag-update.http
        expect: write
        resource: prj_shopweb

