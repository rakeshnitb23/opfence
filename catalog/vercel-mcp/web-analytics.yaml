# Vercel MCP server (mcp.vercel.com): web-analytics
operations:
  - id: vercel-mcp.web-analytics.query
    match: { mcp: { tool: get_web_analytics } }
    class: read
    resource: { arg: projectId, kind: project }
    card: "Query Web Analytics of {projectId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/web-analytics
    tests:
      - fixture: fixtures/web-analytics-query.http
        expect: read
        resource: prj_shopweb

