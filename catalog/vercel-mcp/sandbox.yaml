        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.write-files
    match: { mcp: { tool: write_session_files } }
    class: write
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Write files into sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    notes: >-
      Extracting a tarball can overwrite files in the sandbox; the sandbox is
      disposable and its source lives elsewhere, so it is a write.
    tests:
      - fixture: fixtures/sandbox-write-files.http
        expect: write
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.mkdir
    match: { mcp: { tool: create_session_directory } }
    class: write
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Create directory {requestBody.path} in sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-mkdir.http
        expect: write
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.snapshot-v2
    match: { mcp: { tool: create_sandboxes_sessions_by_session_id_snapshot_v2 } }
    class: write
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Snapshot sandbox session {sessionId}"
    status: verified
