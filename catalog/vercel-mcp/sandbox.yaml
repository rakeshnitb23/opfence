  - id: vercel-mcp.sandbox.get-command
    match: { mcp: { tool: get_session_command } }
    class: read
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Show command {cmdId} in sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-get-command.http
        expect: read
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.command-logs
    match: { mcp: { tool: get_session_command_logs } }
