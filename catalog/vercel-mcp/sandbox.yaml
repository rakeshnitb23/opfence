        expect: read
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.read-file
    match: { mcp: { tool: read_session_file } }
    class: read
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Read {requestBody.path} in sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
