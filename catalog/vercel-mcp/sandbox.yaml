# Vercel MCP server (mcp.vercel.com): sandbox
operations:
  - id: vercel-mcp.sandbox.list
    match: { mcp: { tool: list_named_sandboxes } }
    class: read
    resource: { arg: project, kind: project }
    card: "List sandboxes of project {project}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-list.http
        expect: read
        resource: prj_shopweb

  - id: vercel-mcp.sandbox.list-sessions
    match: { mcp: { tool: list_sessions } }
    class: read
    resource: { arg: project, kind: project }
    card: "List sandbox sessions of project {project}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-list-sessions.http
        expect: read
        resource: prj_shopweb

  - id: vercel-mcp.sandbox.list-snapshots
    match: { mcp: { tool: list_session_snapshots } }
    class: read
    resource: { arg: project, kind: project }
    card: "List sandbox snapshots of project {project}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-list-snapshots.http
        expect: read
        resource: prj_shopweb

  - id: vercel-mcp.sandbox.get
    match: { mcp: { tool: get_named_sandbox } }
    class: read
    when:
      - if: { arg: resume, equals: "true" }
        class: write
    resource: { arg: name, kind: sandbox }
    card: "Show sandbox {name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    notes: >-
      With resume=true it starts a new instance of a stopped sandbox from its
      snapshot.
    tests:
      - fixture: fixtures/sandbox-get.http
        expect: read
        resource: shop-dev
      - fixture: fixtures/sandbox-get-resume.http
        expect: write
        resource: shop-dev

  - id: vercel-mcp.sandbox.create-v2
    match: { mcp: { tool: create_sandboxes_v2 } }
    class: write
    card: "Create sandbox {requestBody.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    notes: >-
      Starts a billed sandbox; like other creates of billed compute in this
      catalog (deployments, Railway services) it is a write.
    tests:
      - fixture: fixtures/sandbox-create-v2.http
        expect: write

  - id: vercel-mcp.sandbox.create-v3
    match: { mcp: { tool: create_sandboxes_v3 } }
    class: write
    card: "Create sandbox {requestBody.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-create-v3.http
        expect: write

  - id: vercel-mcp.sandbox.create-v4
    match: { mcp: { tool: create_sandboxes_v4 } }
    class: write
    card: "Create sandbox {requestBody.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-create-v4.http
        expect: write

  - id: vercel-mcp.sandbox.update
    match: { mcp: { tool: update_sandbox } }
    class: write
    resource: { arg: name, kind: sandbox }
    card: "Update sandbox {name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-update.http
        expect: write
        resource: shop-dev

  - id: vercel-mcp.sandbox.get-session
    match: { mcp: { tool: get_session } }
    class: read
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Show sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-get-session.http
        expect: read
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.extend-timeout
    match: { mcp: { tool: extend_session_timeout } }
    class: write
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Extend the timeout of sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
      - fixture: fixtures/sandbox-extend-timeout.http
        expect: write
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.stop
    match: { mcp: { tool: stop_session } }
    class: delete
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Stop sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    notes: >-
      Docs (sandbox persistence): sandboxes save their filesystem when stopped
      and restore it when resumed, so stopping is delete, not irreversible.
    tests:
      - fixture: fixtures/sandbox-stop.http
        expect: delete
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.network-policy
    match: { mcp: { tool: update_session_network_policy } }
    class: access
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Change the network policy of sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    notes: >-
      Opens or closes the sandbox's network access, which decides what code in
      it can reach or send data to.
    tests:
      - fixture: fixtures/sandbox-network-policy.http
        expect: access
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.run
    match: { mcp: { tool: run_session_command } }
    class: irreversible
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Run {requestBody.cmd} {requestBody.args} in sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    notes: >-
      Runs an arbitrary command. The sandbox is isolated from the user's
      machine, but the command can destroy anything in the sandbox, use any
      credentials written into it and reach whatever its network policy allows,
      so it gets the strictest class (the catalog's rule for running arbitrary
      commands).
    tests:
      - fixture: fixtures/sandbox-run.http
        expect: irreversible
        resource: sbx_sess_123

  - id: vercel-mcp.sandbox.kill
    match: { mcp: { tool: kill_session_command } }
    class: write
    resource: { arg: sessionId, kind: sandbox-session }
    card: "Kill command {cmdId} in sandbox session {sessionId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://vercel.com/docs/agent-resources/vercel-mcp/tools/sandboxes
    tests:
