    unlisted: "called by planetscale-go and pscale but missing from PlanetScale's published OpenAPI spec"
    class: irreversible
    resource: { arg: database, kind: database }
    card: "Complete workflow {number} in database {database} and clean up the source"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/workflows.go
    notes: >-
      Completing a table-moving workflow cleans up the source tables and cannot be reversed;
      the SDK does not say what is kept, so assume the source data is dropped. Not in the
      public OpenAPI spec; the endpoint is called by the official planetscale-go SDK.
    tests:
      - fixture: fixtures/workflow-complete.http
        expect: irreversible
        resource: shop-db

