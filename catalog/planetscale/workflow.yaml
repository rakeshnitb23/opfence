# PlanetScale API: workflow
operations:
  - id: planetscale.workflow.create
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/workflows" } }
    unlisted: "called by planetscale-go and pscale but missing from PlanetScale's published OpenAPI spec"
    class: write
    resource: { arg: database, kind: database }
    card: "Create workflow {body.name} moving tables to keyspace {body.target_keyspace} in database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/workflows.go
    notes: >-
      Not in the public OpenAPI spec; the endpoint is called by the official planetscale-go
      SDK.
    tests:
      - fixture: fixtures/workflow-create.http
        expect: write
        resource: shop-db

