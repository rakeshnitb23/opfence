    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/workflows.go
    notes: >-
      Cancelling discards the copy in the target; the source keyspace still has the data. Not
      in the public OpenAPI spec; the endpoint is called by the official planetscale-go SDK.
    tests:
      - fixture: fixtures/workflow-cancel.http
        expect: delete
        resource: shop-db
