# PlanetScale API: password
operations:
  - id: planetscale.password.create
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/passwords" } }
    class: credential
    resource: { arg: database, kind: database }
    card: "Create a {body.role} password for branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      The response holds the plain-text password.
    tests:
      - fixture: fixtures/password-create.http
        expect: credential
        resource: shop-db

  - id: planetscale.password.update
    match: { rest: { method: PATCH, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/passwords/{id}" } }
    class: write
    when:
      - if: { arg: body.cidrs, present: true }
        class: access
    resource: { arg: database, kind: database }
    card: "Change password {id} of branch {branch}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      cidrs is the list of addresses allowed to use the password.
    tests:
      - fixture: fixtures/password-update.http
        expect: write
        resource: shop-db
      - fixture: fixtures/password-update-cidrs.http
        expect: access
        resource: shop-db

  - id: planetscale.password.delete
    match: { rest: { method: DELETE, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/passwords/{id}" } }
    class: irreversible
    resource: { arg: database, kind: database }
    card: "Delete password {id} of branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      A deleted password cannot be put back; clients using it stop connecting.
    tests:
      - fixture: fixtures/password-delete.http
        expect: irreversible
        resource: shop-db

  - id: planetscale.password.renew
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/passwords/{id}/renew" } }
    class: credential
    resource: { arg: database, kind: database }
    card: "Extend password {id} of branch {branch}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Keeps a database credential alive past the expiry it was created with.
    tests:
      - fixture: fixtures/password-renew.http
        expect: credential
        resource: shop-db
