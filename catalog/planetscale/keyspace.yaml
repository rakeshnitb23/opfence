# PlanetScale API: keyspace
operations:
  - id: planetscale.keyspace.create
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces" } }
    class: money
    resource: { arg: database, kind: database }
    card: "Create keyspace {body.name} on branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Each keyspace runs its own billed cluster.
    tests:
      - fixture: fixtures/keyspace-create.http
        expect: money
        resource: shop-db

  - id: planetscale.keyspace.update
    match: { rest: { method: PATCH, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/{keyspace}" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Change settings of keyspace {keyspace} on branch {branch}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    tests:
      - fixture: fixtures/keyspace-update.http
        expect: write
        resource: shop-db

  - id: planetscale.keyspace.delete
    match: { rest: { method: DELETE, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/{keyspace}" } }
    class: irreversible
    resource: { arg: database, kind: database }
    card: "Delete keyspace {keyspace} and its tables on branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    tests:
      - fixture: fixtures/keyspace-delete.http
        expect: irreversible
        resource: shop-db

  - id: planetscale.keyspace.vschema-update
    match: { rest: { method: PATCH, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/{keyspace}/vschema" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Change the VSchema of keyspace {keyspace} on branch {branch}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Decides how rows are routed to shards; can be changed back.
    tests:
      - fixture: fixtures/keyspace-vschema-update.http
        expect: write
        resource: shop-db

  - id: planetscale.keyspace.resize
    match: { rest: { method: PUT, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/{keyspace}/resizes" } }
    class: money
    resource: { arg: database, kind: database }
    card: "Resize keyspace {keyspace} on branch {branch} to {body.cluster_size}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      Cluster size and replicas set what the keyspace bills.
    tests:
      - fixture: fixtures/keyspace-resize.http
        expect: money
        resource: shop-db

  - id: planetscale.keyspace.resize-cancel
    match: { rest: { method: DELETE, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/{keyspace}/resizes" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Cancel the pending resize of keyspace {keyspace}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    tests:
      - fixture: fixtures/keyspace-resize-cancel.http
        expect: write
        resource: shop-db

  - id: planetscale.keyspace.config-change-create
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/{keyspace}/config-changes" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Draft a {body.change_type} parameter change for keyspace {keyspace}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    tests:
      - fixture: fixtures/keyspace-config-change-create.http
        expect: write
        resource: shop-db

  - id: planetscale.keyspace.config-change-cancel
    match: { rest: { method: DELETE, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/{keyspace}/config-changes/{id}" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Cancel parameter change {id} of keyspace {keyspace}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    tests:
      - fixture: fixtures/keyspace-config-change-cancel.http
        expect: write
        resource: shop-db

  - id: planetscale.keyspace.read-only-regions-update
    match: { rest: { method: PUT, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/{keyspace}/read-only-regions" } }
    unlisted: "called by planetscale-go and pscale but missing from PlanetScale's published OpenAPI spec"
    class: money
    resource: { arg: database, kind: database }
    card: "Change the read-only regions of keyspace {keyspace} on branch {branch}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/keyspaces.go
    notes: >-
      Each read-only region adds billed replicas. Not in the public OpenAPI spec; the endpoint
      is called by the official planetscale-go SDK.
    tests:
      - fixture: fixtures/keyspace-read-only-regions-update.http
        expect: money
        resource: shop-db

  - id: planetscale.keyspace.external-create
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/external" } }
    unlisted: "called by planetscale-go and pscale but missing from PlanetScale's published OpenAPI spec"
    class: write
    resource: { arg: database, kind: database }
    card: "Add external keyspace {body.name} to branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/keyspaces.go
    notes: >-
      Not in the public OpenAPI spec; the endpoint is called by the official planetscale-go
      SDK.
    tests:
      - fixture: fixtures/keyspace-external-create.http
        expect: write
        resource: shop-db

  - id: planetscale.keyspace.external-lint
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/keyspaces/external/lint" } }
    unlisted: "called by planetscale-go and pscale but missing from PlanetScale's published OpenAPI spec"
    class: read
    resource: { arg: database, kind: database }
    card: "Check an external keyspace definition for branch {branch}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/keyspaces.go
    notes: >-
      Validates a definition without changing anything. Not in the public OpenAPI spec; the
      endpoint is called by the official planetscale-go SDK.
    tests:
      - fixture: fixtures/keyspace-external-lint.http
        expect: read
        resource: shop-db
