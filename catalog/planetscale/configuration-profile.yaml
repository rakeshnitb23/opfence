    notes: >-
      Each shard runs a billed cluster.
    tests:
      - fixture: fixtures/configuration-profile-shard-create.http
        expect: money
        resource: shop-db

  - id: planetscale.configuration-profile.shard-bulk-create
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/configuration-profiles/{configuration_profile}/shards/bulk" } }
    class: money
    resource: { arg: database, kind: database }
