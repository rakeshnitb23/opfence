  - id: planetscale.configuration-profile.shards-assign
    match: { rest: { method: PATCH, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/configuration-profiles/{configuration_profile}/shards" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Assign shards {body.shard_ids} to configuration profile {configuration_profile}"
    status: verified
