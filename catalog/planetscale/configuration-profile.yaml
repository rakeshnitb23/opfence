  - id: planetscale.configuration-profile.shards-delete
    match: { rest: { method: DELETE, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/configuration-profiles/{configuration_profile}/shards" } }
    class: irreversible
    resource: { arg: database, kind: database }
    card: "Remove shards {query.shard_ids} from configuration profile {configuration_profile}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
    notes: >-
      The API does not say whether removed shards keep their data; assume it is lost.
    tests:
      - fixture: fixtures/configuration-profile-shards-delete.http
        expect: irreversible
        resource: shop-db

  - id: planetscale.configuration-profile.shard-update
    match: { rest: { method: PATCH, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/configuration-profiles/{configuration_profile}/shards/{id}" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Rename shard {id} of configuration profile {configuration_profile}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/terraform-provider-planetscale/blob/main/schemas/openapi.yaml
