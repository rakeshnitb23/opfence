  - id: planetscale.configuration-profile.shard-delete
    match: { rest: { method: DELETE, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/configuration-profiles/{configuration_profile}/shards/{id}" } }
    class: irreversible
    resource: { arg: database, kind: database }
    card: "Remove shard {id} from configuration profile {configuration_profile}"
    status: verified
