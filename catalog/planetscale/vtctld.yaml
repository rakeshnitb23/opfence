    class: write
    resource: { arg: database, kind: database }
    card: "Change tablet control for shard {body.shard} of keyspace {body.keyspace}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/vtctld_general.go
    notes: >-
      Can deny tables or disable the query service on a shard until changed back. Not in the
      public OpenAPI spec; the endpoint is called by the official planetscale-go SDK.
    tests:
      - fixture: fixtures/vtctld-tablet-control-update.http
        expect: write
        resource: shop-db

