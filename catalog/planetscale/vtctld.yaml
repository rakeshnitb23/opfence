# PlanetScale API: vtctld
operations:
  - id: planetscale.vtctld.keyspace-routing-rules-update
    match: { rest: { method: PUT, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/vtctld/keyspace-routing-rules" } }
    unlisted: "called by planetscale-go and pscale but missing from PlanetScale's published OpenAPI spec"
    class: write
    resource: { arg: database, kind: database }
    card: "Replace the keyspace routing rules of branch {branch} of database {database}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/vtctld_general.go
    notes: >-
      Routes whole keyspaces elsewhere; can be changed back. Not in the public OpenAPI spec;
      the endpoint is called by the official planetscale-go SDK.
    tests:
      - fixture: fixtures/vtctld-keyspace-routing-rules-update.http
        expect: write
        resource: shop-db

