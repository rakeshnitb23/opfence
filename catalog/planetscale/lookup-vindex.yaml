# PlanetScale API: lookup-vindex
operations:
  - id: planetscale.lookup-vindex.create
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/lookup-vindex/vindexes" } }
    class: write
    resource: { arg: database, kind: database }
    card: "Create lookup vindex {body.name} on branch {branch}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/vtctld_lookup_vindex.go
    notes: >-
      Not in the public OpenAPI spec; the endpoint is called by the official planetscale-go
      SDK.
    tests:
      - fixture: fixtures/lookup-vindex-create.http
        expect: write
        resource: shop-db

  - id: planetscale.lookup-vindex.externalize
