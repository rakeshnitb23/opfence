  - id: planetscale.lookup-vindex.cancel
    match: { rest: { method: POST, path: "/v1/organizations/{organization}/databases/{database}/branches/{branch}/lookup-vindex/vindexes/{name}/cancel" } }
    class: delete
    resource: { arg: database, kind: database }
    card: "Cancel lookup vindex {name} on branch {branch}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/planetscale/planetscale-go/blob/main/planetscale/vtctld_lookup_vindex.go
    notes: >-
      Stops the backfill workflow; the lookup table is derived data and can be rebuilt. Not in
      the public OpenAPI spec; the endpoint is called by the official planetscale-go SDK.
    tests:
      - fixture: fixtures/lookup-vindex-cancel.http
        expect: delete
        resource: shop-db

