        expect: read

  - id: sentry-mcp.docs.get
    match: { mcp: { tool: get_doc } }
    class: read
    card: "Read Sentry doc {path}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/getsentry/sentry-mcp/blob/0.42.0/packages/mcp-core/src/tools/catalog/get-doc.ts
    tests:
      - fixture: fixtures/docs-get.http
        expect: read
