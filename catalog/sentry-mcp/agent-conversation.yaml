        expect: read
        resource: my-org

  - id: sentry-mcp.agent-conversation.search-legacy
    match: { mcp: { tool: search_ai_conversations } }
    class: read
    resource: { arg: organizationSlug, kind: organization }
    card: "Search agent conversations in organization {organizationSlug}"
