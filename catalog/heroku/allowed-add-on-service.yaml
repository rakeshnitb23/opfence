# Heroku Platform API: allowed-add-on-service
operations:
  - id: heroku.allowed-add-on-service.create
    match: { rest: { method: POST, path: "/teams/{team_name_or_id}/allowed-addon-services" } }
    class: access
    resource: { arg: team_name_or_id, kind: team }
    card: "Allow add-on service {body.addon_service} in team {team_name_or_id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      Team add-on controls decide which services members may install.
    tests:
      - fixture: fixtures/allowed-add-on-service-create.http
        expect: access
        resource: acme

  - id: heroku.allowed-add-on-service.delete
    match: { rest: { method: DELETE, path: "/teams/{team_name_or_id}/allowed-addon-services/{allowed_add_on_service_id_or_name}" } }
    class: access
    resource: { arg: team_name_or_id, kind: team }
    card: "Remove {allowed_add_on_service_id_or_name} from the allowed add-ons of team {team_name_or_id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    tests:
      - fixture: fixtures/allowed-add-on-service-delete.http
        expect: access
        resource: acme
