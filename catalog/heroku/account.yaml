# Heroku Platform API: account
operations:
  - id: heroku.account.update
    match: { rest: { method: PATCH, path: "/account" } }
    class: write
    card: "Change account settings (name, tracking, beta)"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    tests:
      - fixture: fixtures/account-update.http
        expect: write

  - id: heroku.account.delete
    match: { rest: { method: DELETE, path: "/account" } }
    class: irreversible
    card: "Delete your Heroku account"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      The schema says this cannot be undone; apps owned by the account go with it.
    tests:
      - fixture: fixtures/account-delete.http
        expect: irreversible

  - id: heroku.account.update-by-user
    match: { rest: { method: PATCH, path: "/users/{account_email_or_id_or_self}" } }
    class: write
    resource: { arg: account_email_or_id_or_self, kind: account }
    card: "Change settings of account {account_email_or_id_or_self}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    tests:
      - fixture: fixtures/account-update-by-user.http
        expect: write
        resource: "~"

  - id: heroku.account.delete-by-user
    match: { rest: { method: DELETE, path: "/users/{account_email_or_id_or_self}" } }
    class: irreversible
    resource: { arg: account_email_or_id_or_self, kind: account }
    card: "Delete Heroku account {account_email_or_id_or_self}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      The schema says this cannot be undone.
    tests:
      - fixture: fixtures/account-delete-by-user.http
        expect: irreversible
        resource: "~"
