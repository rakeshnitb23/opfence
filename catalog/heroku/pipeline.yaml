# Heroku Platform API: pipeline
operations:
  - id: heroku.pipeline.create
    match: { rest: { method: POST, path: "/pipelines" } }
    class: write
    resource: { arg: body.name, kind: pipeline }
    card: "Create pipeline {body.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    tests:
      - fixture: fixtures/pipeline-create.http
        expect: write
        resource: shop

  - id: heroku.pipeline.update
    match: { rest: { method: PATCH, path: "/pipelines/{pipeline_id}" } }
    class: write
    resource: { arg: pipeline_id, kind: pipeline }
    card: "Rename pipeline {pipeline_id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    tests:
      - fixture: fixtures/pipeline-update.http
        expect: write
        resource: 9c8b7a6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d

  - id: heroku.pipeline.delete
    match: { rest: { method: DELETE, path: "/pipelines/{pipeline_id}" } }
    class: irreversible
    resource: { arg: pipeline_id, kind: pipeline }
    card: "Delete pipeline {pipeline_id} with its review app and CI settings"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      Apps stay, but the pipeline's stage config vars (review app and CI secrets) are lost with no
      copy.
    tests:
      - fixture: fixtures/pipeline-delete.http
        expect: irreversible
        resource: 9c8b7a6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
