# Heroku Data API (api.data.heroku.com), Heroku Postgres (classic tiers): /client/v11 and /postgres/v0.
# Read from the Heroku CLI (heroku/cli at 65ca0bc, heroku-cli-util at 0ec7cba),
# its only published client; the API has no published schema.
operations:
  - id: heroku.data-postgres.list-transfers
    match: { rest: { method: GET, path: "/client/v11/apps/{app_id_or_name}/transfers" } }
    class: credential
    resource: { arg: app_id_or_name, kind: app }
    card: "List Postgres backups and copies of app {app_id_or_name}"
    status: verified
    verified: 2026-10-22
    unlisted: "Heroku Data API on api.data.heroku.com, which no published schema describes; read from the Heroku CLI"
    sources:
      - https://github.com/heroku/cli/blob/main/src/commands/pg/backups/index.ts
    notes: >-
      Transfers carry from_url and to_url: the backup's storage URL and, for pg:copy, the database
      URLs with their passwords. Reading secrets is credential.
    tests:
      - fixture: fixtures/data-postgres-list-transfers.http
        expect: credential
        resource: "shop-api"

  - id: heroku.data-postgres.read-transfer
    match: { rest: { method: GET, path: "/client/v11/apps/{app_id_or_name}/transfers/{transfer}" } }
