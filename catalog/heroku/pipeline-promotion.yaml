# Heroku Platform API: pipeline-promotion
operations:
  - id: heroku.pipeline-promotion.create
    match: { rest: { method: POST, path: "/pipeline-promotions" } }
    class: write
    resource: { arg: body.pipeline.id, kind: pipeline }
    card: "Promote a release to the next stage of pipeline {body.pipeline.id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      Deploys the source app's slug to the target apps (often production); each target keeps its
      earlier releases.
    tests:
      - fixture: fixtures/pipeline-promotion-create.http
        expect: write
        resource: 9c8b7a6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
