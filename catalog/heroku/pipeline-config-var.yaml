# Heroku Platform API: pipeline-config-var
operations:
  - id: heroku.pipeline-config-var.list
    match: { rest: { method: GET, path: "/pipelines/{pipeline_id}/stage/{pipeline_coupling_stage}/config-vars" } }
    class: credential
    resource: { arg: pipeline_id, kind: pipeline }
    card: "Read the config var values of stage {pipeline_coupling_stage} of pipeline {pipeline_id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      Review app and CI config vars, values in plain text.
    tests:
      - fixture: fixtures/pipeline-config-var-list.http
        expect: credential
        resource: 9c8b7a6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d

  - id: heroku.pipeline-config-var.update
    match: { rest: { method: PATCH, path: "/pipelines/{pipeline_id}/stage/{pipeline_coupling_stage}/config-vars" } }
    class: credential
    when:
      - if: { arg: body, present: true }
        class: credential
      - if: { arg: body, present: true }
        class: irreversible
    resource: { arg: pipeline_id, kind: pipeline }
    card: "Set or unset config vars of stage {pipeline_coupling_stage} of pipeline {pipeline_id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      Sets secrets for review apps and CI; a null value deletes a var and no release history keeps
      it.
    tests:
      - fixture: fixtures/pipeline-config-var-update.http
        expect: credential
        resource: 9c8b7a6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
      - fixture: fixtures/pipeline-config-var-update.http
        expect: irreversible
        resource: 9c8b7a6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
