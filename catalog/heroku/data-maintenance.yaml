# Heroku Data API (api.data.heroku.com), database maintenance: /data/maintenances/v1.
# Read from the Heroku CLI (heroku/cli at 65ca0bc, heroku-cli-util at 0ec7cba),
# its only published client; the API has no published schema.
operations:
  - id: heroku.data-maintenance.list-for-app
    match: { rest: { method: GET, path: "/data/maintenances/v1/apps/{app_id_or_name}" } }
    class: read
    resource: { arg: app_id_or_name, kind: app }
    status: verified
    verified: 2026-10-22
    unlisted: "Heroku Data API on api.data.heroku.com, which no published schema describes; read from the Heroku CLI"
    sources:
      - https://github.com/heroku/cli/blob/main/src/commands/data/maintenances/index.ts
    tests:
      - fixture: fixtures/data-maintenance-list-for-app.http
        expect: read
        resource: "shop-api"

  - id: heroku.data-maintenance.read
    match: { rest: { method: GET, path: "/data/maintenances/v1/{add_on_id_or_name}" } }
    class: read
    resource: { arg: add_on_id_or_name, kind: add-on }
    status: verified
    verified: 2026-10-22
    unlisted: "Heroku Data API on api.data.heroku.com, which no published schema describes; read from the Heroku CLI"
    sources:
      - https://github.com/heroku/cli/blob/main/src/commands/data/maintenances/info.ts
    tests:
      - fixture: fixtures/data-maintenance-read.http
        expect: read
        resource: "postgresql-shaped-48213"

  - id: heroku.data-maintenance.history
    match: { rest: { method: GET, path: "/data/maintenances/v1/{add_on_id_or_name}/history" } }
