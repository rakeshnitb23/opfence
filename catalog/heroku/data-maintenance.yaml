        expect: read
        resource: "postgresql-shaped-48213"

  - id: heroku.data-maintenance.run
    match: { rest: { method: POST, path: "/data/maintenances/v1/{add_on_id_or_name}/run" } }
    class: write
    resource: { arg: add_on_id_or_name, kind: add-on }
    card: "Run maintenance on {add_on_id_or_name} now"
    status: verified
    verified: 2026-10-22
    unlisted: "Heroku Data API on api.data.heroku.com, which no published schema describes; read from the Heroku CLI"
    sources:
      - https://github.com/heroku/cli/blob/main/src/commands/data/maintenances/run.ts
    notes: >-
      Restarts or fails over the database now instead of in its window.
    tests:
      - fixture: fixtures/data-maintenance-run.http
        expect: write
        resource: "postgresql-shaped-48213"

