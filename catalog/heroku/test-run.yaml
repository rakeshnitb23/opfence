# Heroku Platform API: test-run
operations:
  - id: heroku.test-run.create
    match: { rest: { method: POST, path: "/test-runs" } }
    class: write
    resource: { arg: body.pipeline, kind: pipeline }
    card: "Start a Heroku CI test run of {body.commit_branch}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      Runs the code in the archive on ephemeral CI dynos, like a build; classed with builds as
      write.
    tests:
      - fixture: fixtures/test-run-create.http
        expect: write
        resource: 9c8b7a6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d

  - id: heroku.test-run.update
    match: { rest: { method: PATCH, path: "/test-runs/{test_run_number}" } }
    class: write
    card: "Set the status of test run {test_run_number}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    tests:
      - fixture: fixtures/test-run-update.http
        expect: write
