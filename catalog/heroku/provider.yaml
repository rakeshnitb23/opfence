provider: heroku
title: Heroku
docs: https://devcenter.heroku.com/articles/platform-api-reference
# api.data.heroku.com is the Data API (Heroku Postgres, Key-Value Store and
# their maintenance), which the Heroku CLI calls with the same token; its
# rules are the data-*.yaml files.
hosts: [api.heroku.com, api.data.heroku.com]
auth:
  - header: Authorization
    scheme: Bearer                 # what the Heroku CLI (@heroku-cli/command) and the MCP server send
  - basic: password                # curl -n / .netrc: email as user name, the token as password
detect:
  env: [HEROKU_API_KEY]            # read by the Heroku CLI and @heroku/mcp-server
  prefixes: [HRKU-]                # the oauth-token token example in Heroku's own schema; older tokens are bare UUIDs
defaults:
  rest_safe_methods: read          # GETs only read, except the ones listed as credential
# Every operation comes from Heroku's JSON Hyper-Schema, vendored in
# heroku/heroku-go (v6/schema.json; v5/schema.json for the outbound ruleset
# that v6 dropped). Paths have no version prefix: Heroku selects the API
# version with the Accept header (application/vnd.heroku+json; version=3).
# Path parameter names follow the Platform API reference (app_id_or_name, ...).
#
# The Data API (api.data.heroku.com) is in no published schema. Its rules
# (data-*.yaml) are read from the Heroku CLI, its only published client, and
# are unlisted. GETs there are not left to rest_safe_methods: many of its reads
# return passwords, so a read the CLI does not make is unknown (data-api.yaml).
# Published schemas the rules were built from; `opfence catalog check-sources`
# compares them nightly.
schemas:
  - kind: heroku
    url: https://raw.githubusercontent.com/heroku/heroku-go/master/v6/schema.json
