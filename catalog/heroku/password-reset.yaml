# Heroku Platform API: password-reset
operations:
  - id: heroku.password-reset.create
    match: { rest: { method: POST, path: "/password-resets" } }
    class: access
    resource: { arg: body.email, kind: account }
    card: "Send a password reset link to {body.email}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      Starts an account recovery flow for the address.
    tests:
      - fixture: fixtures/password-reset-create.http
        expect: access
        resource: dev@example.com

  - id: heroku.password-reset.finalize
    match: { rest: { method: POST, path: "/password-resets/{password_reset_reset_password_token}/actions/finalize" } }
    class: credential
    card: "Set a new account password with a reset token"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-go/blob/master/v6/schema.json
    notes: >-
      Sets the account password.
    tests:
      - fixture: fixtures/password-reset-finalize.http
        expect: credential
