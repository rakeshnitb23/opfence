# Neon MCP server: credential
operations:
  - id: neon-mcp.credential.list
    match: { mcp: { tool: list_credentials } }
    class: read
    resource: { arg: branch_id, kind: branch }
    card: "List credentials on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/mcp-server-neon/blob/main/mcp/tools/generated/operations.ts
      - https://github.com/neondatabase/mcp-server-neon/blob/main/mcp/tools/generated/names.ts
      - https://unpkg.com/@neon/tools@2.2.0/dist/lib/ergonomic/catalog.js
    notes: >-
      Metadata only; the API never includes secrets in the list.
    tests:
      - fixture: fixtures/credential-list.http
        expect: read
        resource: br-shop-main-123456

  - id: neon-mcp.credential.create
    match: { mcp: { tool: create_credential } }
    class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Issue credential {name} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/mcp-server-neon/blob/main/mcp/tools/generated/operations.ts
      - https://github.com/neondatabase/mcp-server-neon/blob/main/mcp/tools/generated/names.ts
      - https://unpkg.com/@neon/tools@2.2.0/dist/lib/ergonomic/catalog.js
    notes: >-
      Returns api_token and s3_secret_access_key.
    tests:
      - fixture: fixtures/credential-create.http
        expect: credential
        resource: br-shop-main-123456

  - id: neon-mcp.credential.revoke
    match: { mcp: { tool: revoke_credential } }
    class: access
    resource: { arg: branch_id, kind: branch }
    card: "Revoke credential {token_id} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/mcp-server-neon/blob/main/mcp/tools/generated/operations.ts
      - https://github.com/neondatabase/mcp-server-neon/blob/main/mcp/tools/generated/names.ts
      - https://unpkg.com/@neon/tools@2.2.0/dist/lib/ergonomic/catalog.js
    tests:
      - fixture: fixtures/credential-revoke.http
        expect: access
        resource: br-shop-main-123456

  - id: neon-mcp.credential.rotate
    match: { mcp: { tool: rotate_credential } }
    class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Rotate the secrets of credential {token_id} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/mcp-server-neon/blob/main/mcp/tools/generated/operations.ts
      - https://github.com/neondatabase/mcp-server-neon/blob/main/mcp/tools/generated/names.ts
      - https://unpkg.com/@neon/tools@2.2.0/dist/lib/ergonomic/catalog.js
    notes: >-
      Returns new secrets and invalidates the old ones.
    tests:
      - fixture: fixtures/credential-rotate.http
        expect: credential
        resource: br-shop-main-123456
