# DigitalOcean MCP server: agent-config
operations:
  - id: digitalocean-mcp.agent-config.list
    match: { mcp: { tool: harness-runtime-list-agent-configs } }
    class: read
    card: "List hosted agent configs"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/harness-runtime/agent_config_tools.go
    tests:
      - fixture: fixtures/agent-config-list.http
        expect: read

  - id: digitalocean-mcp.agent-config.get
    match: { mcp: { tool: harness-runtime-get-agent-config } }
    class: read
    resource: { arg: ConfigID, kind: agent-config }
    card: "Show hosted agent config {ConfigID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/harness-runtime/agent_config_tools.go
    notes: >-
      The tool says credential slots are redacted and secret values are never
      returned.
    tests:
      - fixture: fixtures/agent-config-get.http
        expect: read
        resource: cfg_EXAMPLE01
