    card: "Show action {ID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/account/action_tools.go
    tests:
      - fixture: fixtures/action-get.http
        expect: read
        resource: "36804636"
