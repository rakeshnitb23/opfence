# DigitalOcean MCP server: action
operations:
  - id: digitalocean-mcp.action.list
    match: { mcp: { tool: action-list } }
    class: read
    card: "List account actions"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/account/action_tools.go
    tests:
