# DigitalOcean MCP server: function-key
operations:
  - id: digitalocean-mcp.function-key.list
    match: { mcp: { tool: functions-list-access-keys } }
    class: read
    resource: { arg: NamespaceID, kind: function-namespace }
    card: "List access keys of Functions namespace {NamespaceID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/functions/namespace_tools.go
    notes: >-
      Metadata only; secrets are not returned.
    tests:
      - fixture: fixtures/function-key-list.http
        expect: read
        resource: fn-b90faf52-2b42-49c2-9792-75edfbb6f397

  - id: digitalocean-mcp.function-key.create
    match: { mcp: { tool: functions-create-access-key } }
    class: credential
    resource: { arg: NamespaceID, kind: function-namespace }
    card: "Create access key {Name} for Functions namespace {NamespaceID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/functions/namespace_tools.go
    notes: >-
      The secret is returned once.
    tests:
      - fixture: fixtures/function-key-create.http
        expect: credential
        resource: fn-b90faf52-2b42-49c2-9792-75edfbb6f397

  - id: digitalocean-mcp.function-key.delete
    match: { mcp: { tool: functions-delete-access-key } }
    class: access
    resource: { arg: NamespaceID, kind: function-namespace }
    card: "Delete access key {KeyID} of Functions namespace {NamespaceID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/functions/namespace_tools.go
    notes: >-
      Whoever used the key loses access.
    tests:
      - fixture: fixtures/function-key-delete.http
        expect: access
        resource: fn-b90faf52-2b42-49c2-9792-75edfbb6f397
