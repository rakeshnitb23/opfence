# DigitalOcean MCP server: droplet-action
operations:
  - id: digitalocean-mcp.droplet-action.reboot
    match: { mcp: { tool: reboot-droplet } }
    class: write
    resource: { arg: ID, kind: droplet }
    card: "Reboot Droplet {ID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/droplet/droplet_actions_tools.go
    tests:
      - fixture: fixtures/droplet-action-reboot.http
        expect: write
        resource: "3164444"

