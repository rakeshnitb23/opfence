  - id: digitalocean-mcp.droplet-action.restore
    match: { mcp: { tool: restore-droplet } }
    class: irreversible
    resource: { arg: ID, kind: droplet }
    card: "Restore Droplet {ID} from backup {ImageID}, overwriting its disk"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/droplet/droplet_actions_tools.go
    notes: >-
      Overwrites the disk with the backup; changes since the backup are gone.
    tests:
      - fixture: fixtures/droplet-action-restore.http
        expect: irreversible
        resource: "3164444"

