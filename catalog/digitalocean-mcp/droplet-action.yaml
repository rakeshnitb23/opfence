    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/droplet/droplet_actions_tools.go
    notes: >-
      A bigger size costs more; with ResizeDisk the disk cannot shrink back.
    tests:
      - fixture: fixtures/droplet-action-resize.http
        expect: money
        resource: "3164444"

