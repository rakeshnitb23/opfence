    class: irreversible
    resource: { arg: ID, kind: droplet }
    card: "Disable backups on Droplet {ID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/droplet/droplet_actions_tools.go
    notes: >-
      Turns off the safety net; the API reference does not say existing
      backups survive, so this is treated as losing them.
    tests:
      - fixture: fixtures/droplet-action-disable-backups.http
        expect: irreversible
        resource: "3164444"

  - id: digitalocean-mcp.droplet-action.disable-backups-by-tag
