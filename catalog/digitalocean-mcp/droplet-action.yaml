  - id: digitalocean-mcp.droplet-action.rebuild
    match: { mcp: { tool: rebuild-droplet } }
    class: irreversible
    resource: { arg: ID, kind: droplet }
    card: "Rebuild Droplet {ID} from image {ImageID}, erasing its disk"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/droplet/droplet_actions_tools.go
    notes: >-
      Reinstalls the disk from the image; everything on it is gone.
    tests:
      - fixture: fixtures/droplet-action-rebuild.http
        expect: irreversible
        resource: "3164444"

  - id: digitalocean-mcp.droplet-action.rebuild-by-slug
    match: { mcp: { tool: rebuild-droplet-by-slug } }
    class: irreversible
    resource: { arg: ID, kind: droplet }
    card: "Rebuild Droplet {ID} from {ImageSlug}, erasing its disk"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/droplet/droplet_actions_tools.go
    notes: >-
      Reinstalls the disk from the image; everything on it is gone.
    tests:
