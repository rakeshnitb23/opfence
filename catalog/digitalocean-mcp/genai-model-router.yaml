        expect: write
        resource: support-router

  - id: digitalocean-mcp.genai-model-router.update
    match: { mcp: { tool: genai-inference-router-update } }
    class: write
    resource: { arg: UUID, kind: genai-model-router }
    card: "Change model router {UUID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/genai-inferencerouter/router_tools.go
