        resource: b7f1c2e8-2d6c-4a3b-9f5e-1c0d2e3f4a5b

  - id: digitalocean-mcp.genai-model-router.delete
    match: { mcp: { tool: genai-inference-router-delete } }
    class: delete
    resource: { arg: UUID, kind: genai-model-router }
    card: "Delete model router {UUID}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/genai-inferencerouter/router_tools.go
    notes: >-
      A routing configuration; callers that use it fail until it is recreated.
    tests:
      - fixture: fixtures/genai-model-router-delete.http
        expect: delete
        resource: b7f1c2e8-2d6c-4a3b-9f5e-1c0d2e3f4a5b
