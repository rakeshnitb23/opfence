  - id: digitalocean-mcp.database.upgrade
    match: { mcp: { tool: db-cluster-upgrade-major-version } }
    class: write
    resource: { arg: id, kind: database }
    card: "Upgrade database cluster {id} to version {version}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/dbaas/cluster.go
    notes: >-
      An in-place engine upgrade; DigitalOcean takes a backup first.
    tests:
      - fixture: fixtures/database-upgrade.http
        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean-mcp.database.start-online-migration
    match: { mcp: { tool: db-cluster-start-online-migration } }
    class: irreversible
    when:
      - if: { arg: id, present: true }
        class: irreversible
      - if: { arg: source.password, present: true }
        class: credential
    resource: { arg: id, kind: database }
    card: "Migrate {source.dbname} from {source.host} into database cluster {id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/dbaas/cluster.go
    notes: >-
      Copies the source database over the target cluster's data, which cannot
      be undone; source.password is a secret.
    tests:
      - fixture: fixtures/database-start-online-migration.http
        expect: irreversible
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

