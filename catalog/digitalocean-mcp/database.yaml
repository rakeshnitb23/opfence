  - id: digitalocean-mcp.database.create
    match: { mcp: { tool: db-cluster-create } }
    class: credential
    when:
      - if: { arg: name, present: true }
        class: money
      - if: { arg: name, present: true }
        class: credential
    resource: { arg: name, kind: database }
    card: "Create {engine} database cluster {name} ({size} x{num_nodes}) in {region}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/dbaas/cluster.go
    notes: >-
      A billed cluster (money), and the returned cluster carries the admin
      password and connection URIs (credential).
    tests:
      - fixture: fixtures/database-create.http
        expect: credential
        resource: shop-db

  - id: digitalocean-mcp.database.delete
    match: { mcp: { tool: db-cluster-delete } }
    class: irreversible
    resource: { arg: id, kind: database }
    card: "Destroy database cluster {id} and its data"
    status: verified
    verified: 2026-10-18
    sources:
