# DigitalOcean MCP server: database
operations:
  - id: digitalocean-mcp.database.list
    match: { mcp: { tool: db-cluster-list } }
    class: credential
    card: "List database clusters with their connection details"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/dbaas/cluster.go
    notes: >-
      godo Database objects carry connection.password and the connection URI;
      the server returns them unredacted.
    tests:
      - fixture: fixtures/database-list.http
        expect: credential

  - id: digitalocean-mcp.database.get
    match: { mcp: { tool: db-cluster-get } }
    class: credential
    resource: { arg: id, kind: database }
    card: "Show database cluster {id} with its connection details"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/dbaas/cluster.go
    notes: >-
      Returns connection.password, private_connection.password and the URIs.
    tests:
      - fixture: fixtures/database-get.http
        expect: credential
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean-mcp.database.list-options
