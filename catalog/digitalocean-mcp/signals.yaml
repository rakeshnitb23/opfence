# DigitalOcean MCP server: signals
operations:
  - id: digitalocean-mcp.signals.list-consents
    match: { mcp: { tool: signals-list-consents } }
    class: read
    card: "List Signals consent settings"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/signals/signals_tools.go
    tests:
      - fixture: fixtures/signals-list-consents.http
        expect: read

  - id: digitalocean-mcp.signals.get-agent-consent
