    match: { mcp: { tool: functions-create-trigger } }
    class: write
    resource: { arg: NamespaceID, kind: function-namespace }
    card: "Schedule function {Function} with trigger {Name} ({Cron})"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/functions/trigger_tools.go
    tests:
