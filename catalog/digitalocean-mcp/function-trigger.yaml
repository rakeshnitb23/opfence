    resource: { arg: NamespaceID, kind: function-namespace }
    card: "Delete trigger {TriggerName}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/functions/trigger_tools.go
    notes: >-
      Only the schedule; the function stays.
    tests:
