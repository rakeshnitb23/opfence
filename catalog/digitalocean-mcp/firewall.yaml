# DigitalOcean MCP server: firewall
operations:
  - id: digitalocean-mcp.firewall.list
    match: { mcp: { tool: firewall-list } }
    class: read
    card: "List firewalls"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean-labs/mcp-digitalocean/blob/main/pkg/registry/networking/firewall_tools.go
    tests:
      - fixture: fixtures/firewall-list.http
        expect: read

  - id: digitalocean-mcp.firewall.get
    match: { mcp: { tool: firewall-get } }
    class: read
    resource: { arg: ID, kind: firewall }
    card: "Show firewall {ID}"
    status: verified
    verified: 2026-10-18
    sources:
