      - if: { arg: body.update.desiredAuthenticatorGroupsConfig, present: true }
        class: access
      - if: { arg: body.update.desiredAnonymousAuthenticationConfig, present: true }
        class: access
      - if: { arg: body.update.desiredRbacBindingConfig, present: true }
        class: access
      - if: { arg: body.update.desiredIdentityServiceConfig, present: true }
        class: access
      - if: { arg: body.update.desiredWorkloadIdentityConfig, present: true }
        class: access
      - if: { arg: body.update.desiredBinaryAuthorization, present: true }
        class: access
      - if: { arg: body.update.desiredShieldedNodes, present: true }
        class: access
      - if: { arg: body.update.desiredNodePoolAutoConfigNetworkTags, present: true }
        class: access
      - if: { arg: body.update.desiredNodePoolAutoscaling, present: true }
        class: money
      - if: { arg: body.update.desiredLocations, present: true }
        class: money
    resource: { arg: project, kind: project }
    card: "Change GKE cluster {cluster} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/container/v1/rest
    notes: >-
      Opening the control plane or the nodes to networks, and changing who can authenticate, which
      bindings RBAC allows, what images may run or the nodes' network tags, are access; node
      autoscaling and zones are money.
    tests:
      - fixture: fixtures/clusters-update.http
        expect: write
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when1.http
