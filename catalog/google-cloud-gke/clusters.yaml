      - fixture: fixtures/clusters-update-when6.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when7.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when8.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when9.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when10.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when11.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when12.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when13.http
        expect: access
        resource: "acme-prod"
      - fixture: fixtures/clusters-update-when14.http
