provider: google-cloud-gke
title: Google Kubernetes Engine
docs: https://cloud.google.com/kubernetes-engine/docs/reference/rest
# Clusters and node pools, by location and by the older zone paths. Rules match every API version
# (gcloud beta calls v1beta1). The workloads in a cluster are Kubernetes' own API, which this provider
# does not cover.
# Generated from Google's discovery documents; every method that is not a
# GET has a rule, and so do the GETs that return secrets. The bearer token
# is a short-lived OAuth access token, which Opfence does not swap: there is
# no detect block (see LIMITS.md).
hosts: [container.googleapis.com]
auth:
  - header: Authorization
    scheme: Bearer
defaults:
  rest_safe_methods: read
schemas:
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/container/v1/rest
