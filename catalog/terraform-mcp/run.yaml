  - id: terraform-mcp.run.get-plan-json-output
    match: { mcp: { tool: get_plan_json_output } }
    class: credential
    card: "Read the JSON plan of {plan_id}, with attribute values"
    status: verified
    verified: 2026-10-22
    sources:
      - https://github.com/hashicorp/terraform-mcp-server/blob/main/pkg/tools/tfe/get_plan_json_output.go
    notes: >-
      The JSON plan holds every attribute's before and after values in plain text, those Terraform
      marks sensitive included (it only flags them), so it can return database passwords and keys.
    tests:
      - fixture: fixtures/run-get-plan-json-output.json
        expect: credential

