    match: { rest: { method: POST, path: "/v1/projects/{project}/instances/{instance}/backups:copy" } }
    class: write
    resource: { arg: project, kind: project }
    card: "Copy Spanner backup {instance} in project {project}"
    status: verified
    verified: 2026-10-24
