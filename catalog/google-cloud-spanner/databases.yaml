    when:
      - if: { arg: body.mutationGroups.mutations.delete, present: true }
        class: delete
      - if: { arg: body.mutationGroups.mutations.delete.keySet.all, equals: "true" }
        class: irreversible
      - if: { arg: body.mutationGroups.mutations.delete.keySet.ranges, present: true }
