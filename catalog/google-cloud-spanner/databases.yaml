    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/spanner/v1/rest
    notes: >-
      A delete mutation deletes the rows its keys name; one for every key (keySet.all) or for key
      ranges can reach every row, so it is irreversible.
    tests:
      - fixture: fixtures/databases-sessions-batch-write.http
        expect: write
        resource: "acme-prod"
      - fixture: fixtures/databases-sessions-batch-write-when1.http
        expect: delete
