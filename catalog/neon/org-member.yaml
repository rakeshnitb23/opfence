# Neon API v2: org-member
operations:
  - id: neon.org-member.update
    match: { rest: { method: PATCH, path: "/api/v2/organizations/{org_id}/members/{member_id}" } }
    class: access
    resource: { arg: org_id, kind: organization }
    card: "Change the role of member {member_id} in organization {org_id} to {body.role}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/org-member-update.http
        expect: access
        resource: org-shop-12345678

  - id: neon.org-member.remove
    match: { rest: { method: DELETE, path: "/api/v2/organizations/{org_id}/members/{member_id}" } }
    class: access
    resource: { arg: org_id, kind: organization }
    card: "Remove member {member_id} from organization {org_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/org-member-remove.http
        expect: access
        resource: org-shop-12345678
