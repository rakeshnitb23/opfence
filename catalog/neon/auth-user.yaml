# Neon API v2: auth-user
operations:
  - id: neon.auth-user.create
    match: { rest: { method: POST, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/users" } }
    class: access
    resource: { arg: branch_id, kind: branch }
    card: "Create Neon Auth user {body.email} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/auth-user-create.http
        expect: access
        resource: br-shop-main-123456

  - id: neon.auth-user.delete
    match: { rest: { method: DELETE, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/users/{auth_user_id}" } }
    class: irreversible
    resource: { arg: branch_id, kind: branch }
    card: "Delete Neon Auth user {auth_user_id} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      The spec says this cannot be undone.
    tests:
      - fixture: fixtures/auth-user-delete.http
        expect: irreversible
        resource: br-shop-main-123456

  - id: neon.auth-user.update-role
    match: { rest: { method: PUT, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/users/{auth_user_id}/role" } }
    class: access
    resource: { arg: branch_id, kind: branch }
    card: "Change the role of Neon Auth user {auth_user_id} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/auth-user-update-role.http
        expect: access
        resource: br-shop-main-123456
