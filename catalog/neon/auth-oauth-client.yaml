# Neon API v2: auth-oauth-client
operations:
  - id: neon.auth-oauth-client.create
    match: { rest: { method: POST, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/oauth-provider/clients" } }
    class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Register OAuth client {body.name} with Neon Auth on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      Confidential clients get client_secret in the response, shown once.
    tests:
      - fixture: fixtures/auth-oauth-client-create.http
        expect: credential
        resource: br-shop-main-123456

  - id: neon.auth-oauth-client.update
    match: { rest: { method: PATCH, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/oauth-provider/clients/{client_id}" } }
    class: access
    resource: { arg: branch_id, kind: branch }
    card: "Change OAuth client {client_id} of Neon Auth on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/auth-oauth-client-update.http
        expect: access
        resource: br-shop-main-123456

  - id: neon.auth-oauth-client.delete
    match: { rest: { method: DELETE, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/oauth-provider/clients/{client_id}" } }
    class: access
    resource: { arg: branch_id, kind: branch }
    card: "Delete OAuth client {client_id} of Neon Auth on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/auth-oauth-client-delete.http
        expect: access
        resource: br-shop-main-123456

  - id: neon.auth-oauth-client.rotate-secret
    match: { rest: { method: POST, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/oauth-provider/clients/{client_id}/rotate_secret" } }
    class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Rotate the secret of OAuth client {client_id} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      Returns the new client_secret.
    tests:
      - fixture: fixtures/auth-oauth-client-rotate-secret.http
        expect: credential
        resource: br-shop-main-123456
