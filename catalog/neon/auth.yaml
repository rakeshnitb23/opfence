# Neon API v2: auth
operations:
  - id: neon.auth.enable
    match: { rest: { method: POST, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth" } }
    class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Enable Neon Auth on branch {branch_id} of project {project_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      The response returns secret_server_key.
    tests:
      - fixture: fixtures/auth-enable.http
        expect: credential
        resource: br-shop-main-123456

  - id: neon.auth.disable
    match: { rest: { method: DELETE, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth" } }
    class: access
    when:
      - if: { arg: body.delete_data, equals: "true" }
        class: irreversible
    resource: { arg: branch_id, kind: branch }
    card: "Disable Neon Auth on branch {branch_id} of project {project_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      Disabling stops sign-in for the app; delete_data also drops the
      neon_auth schema with its users.
    tests:
      - fixture: fixtures/auth-disable.http
        expect: access
        resource: br-shop-main-123456
      - fixture: fixtures/auth-disable-delete-data.http
        expect: irreversible
        resource: br-shop-main-123456

  - id: neon.auth.allow-localhost
