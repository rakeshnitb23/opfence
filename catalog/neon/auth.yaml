    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      Callers with credential read permission get the stored SMTP password.
    tests:
      - fixture: fixtures/auth-email-provider.http
        expect: credential
        resource: br-shop-main-123456

  - id: neon.auth.update-email-provider
    match: { rest: { method: PATCH, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/email_provider" } }
    class: access
    when:
      - if: { arg: body.password, present: true }
        class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Change the Neon Auth email provider of branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      Setting the SMTP password stores a secret.
    tests:
      - fixture: fixtures/auth-update-email-provider.http
        expect: access
        resource: br-shop-main-123456
      - fixture: fixtures/auth-update-email-provider-password.http
        expect: credential
        resource: br-shop-main-123456

