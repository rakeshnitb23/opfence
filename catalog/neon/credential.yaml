# Neon API v2: credential
operations:
  - id: neon.credential.create
    match: { rest: { method: POST, path: "/api/v2/projects/{project_id}/branches/{branch_id}/credentials" } }
    class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Issue credential {body.name} on branch {branch_id} of project {project_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      Returns api_token and s3_secret_access_key.
    tests:
      - fixture: fixtures/credential-create.http
        expect: credential
        resource: br-shop-main-123456

  - id: neon.credential.revoke
    match: { rest: { method: DELETE, path: "/api/v2/projects/{project_id}/branches/{branch_id}/credentials/{token_id}" } }
    class: access
    resource: { arg: branch_id, kind: branch }
    card: "Revoke credential {token_id} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/credential-revoke.http
        expect: access
        resource: br-shop-main-123456

  - id: neon.credential.reveal
    match: { rest: { method: POST, path: "/api/v2/projects/{project_id}/branches/{branch_id}/credentials/{token_id}/reveal" } }
    class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Reveal the secrets of credential {token_id} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/credential-reveal.http
        expect: credential
        resource: br-shop-main-123456

  - id: neon.credential.rotate
    match: { rest: { method: POST, path: "/api/v2/projects/{project_id}/branches/{branch_id}/credentials/{token_id}/rotate" } }
    class: credential
    resource: { arg: branch_id, kind: branch }
    card: "Rotate the secrets of credential {token_id} on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    notes: >-
      Returns new secrets and invalidates the old ones.
    tests:
      - fixture: fixtures/credential-rotate.http
        expect: credential
        resource: br-shop-main-123456
