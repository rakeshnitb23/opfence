# Neon API v2: auth-domain
operations:
  - id: neon.auth-domain.add
    match: { rest: { method: POST, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/domains" } }
    class: access
    resource: { arg: branch_id, kind: branch }
    card: "Trust redirect domain {body.domain} for Neon Auth on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/auth-domain-add.http
        expect: access
        resource: br-shop-main-123456

  - id: neon.auth-domain.delete
    match: { rest: { method: DELETE, path: "/api/v2/projects/{project_id}/branches/{branch_id}/auth/domains" } }
    class: access
    resource: { arg: branch_id, kind: branch }
    card: "Remove trusted redirect domains from Neon Auth on branch {branch_id}"
    status: verified
    verified: 2026-10-17
    sources:
      - https://github.com/neondatabase/neon-pkgs/blob/main/packages/sdk/spec/neon-openapi.json
    tests:
      - fixture: fixtures/auth-domain-delete.http
        expect: access
        resource: br-shop-main-123456
