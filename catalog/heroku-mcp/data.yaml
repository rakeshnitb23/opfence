  - id: heroku-mcp.data.pg-upgrade
    match: { mcp: { tool: pg_upgrade } }
    class: irreversible
    resource: { arg: app, kind: app }
    card: "Upgrade the Postgres version of the database of app {app}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/heroku/heroku-mcp-server/blob/main/src/tools/data.ts
      - https://github.com/heroku/heroku-mcp-server/blob/main/src/index.ts
      - https://github.com/heroku/cli/blob/v10.17.0/packages/cli/src/commands/pg/upgrade/index.ts
    notes: >-
      Runs heroku pg:upgrade. The CLI's own warning: 'Destructive action ... You can't undo this
      action' (an Essential database is upgraded in place; a follower stops following its leader).
      Heroku CLI 11 only has the pg:upgrade:* subcommands, so with it the command fails.
    tests:
      - fixture: fixtures/pg-upgrade.json
        expect: irreversible
        resource: shop-api
