# Stripe REST API: payment record
operations:
  - id: stripe.payment-record.report-payment
    match: { rest: { method: POST, path: "/v1/payment_records/report_payment" } }
    class: write
    card: "Record a payment made outside Stripe"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Records a payment made outside Stripe; no money moves through Stripe.
    tests:
      - fixture: fixtures/payment-record-report-payment.http
        expect: write

  - id: stripe.payment-record.report-payment-attempt
    match: { rest: { method: POST, path: "/v1/payment_records/{id}/report_payment_attempt" } }
    class: write
    resource: { arg: id, kind: payment_record }
    card: "Record payment attempt on payment record {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Records what happened outside Stripe; no money moves through Stripe.
    tests:
      - fixture: fixtures/payment-record-report-payment-attempt.http
        expect: write
        resource: pr_ShopOutside01

