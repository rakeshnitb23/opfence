# Stripe REST API: radar value list item
operations:
  - id: stripe.radar-value-list-item.create
    match: { rest: { method: POST, path: "/v1/radar/value_list_items" } }
    class: write
    card: "Add {body.value} to Radar list {body.value_list}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/radar-value-list-item-create.http
        expect: write

  - id: stripe.radar-value-list-item.delete
    match: { rest: { method: DELETE, path: "/v1/radar/value_list_items/{item}" } }
    class: delete
    resource: { arg: item, kind: value_list_item }
    card: "Remove item {item} from its Radar list"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      The value can be added again.
    tests:
      - fixture: fixtures/radar-value-list-item-delete.http
        expect: delete
        resource: rsli_ShopFraud0001
