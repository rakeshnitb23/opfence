# Stripe REST API: billing alert
operations:
  - id: stripe.billing-alert.create
    match: { rest: { method: POST, path: "/v1/billing/alerts" } }
    class: write
    card: "Create billing alert {body.title}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/billing-alert-create.http
        expect: write

  - id: stripe.billing-alert.activate
    match: { rest: { method: POST, path: "/v1/billing/alerts/{id}/activate" } }
    class: write
    resource: { arg: id, kind: billing_alert }
    card: "Activate billing alert {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/billing-alert-activate.http
        expect: write
        resource: alrt_ShopUsage0001

  - id: stripe.billing-alert.archive
    match: { rest: { method: POST, path: "/v1/billing/alerts/{id}/archive" } }
    class: write
    resource: { arg: id, kind: billing_alert }
    card: "Archive billing alert {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/billing-alert-archive.http
        expect: write
        resource: alrt_ShopUsage0001

  - id: stripe.billing-alert.deactivate
    match: { rest: { method: POST, path: "/v1/billing/alerts/{id}/deactivate" } }
    class: write
    resource: { arg: id, kind: billing_alert }
    card: "Deactivate billing alert {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/billing-alert-deactivate.http
        expect: write
        resource: alrt_ShopUsage0001
