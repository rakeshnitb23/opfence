# Stripe REST API: terminal reader
operations:
  - id: stripe.terminal-reader.create
    match: { rest: { method: POST, path: "/v1/terminal/readers" } }
    class: write
    card: "Register Terminal reader {body.label}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/terminal-reader-create.http
        expect: write

  - id: stripe.terminal-reader.delete
    match: { rest: { method: DELETE, path: "/v1/terminal/readers/{reader}" } }
    class: delete
    resource: { arg: reader, kind: reader }
    card: "Delete Terminal reader {reader}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      The reader can be registered again.
    tests:
      - fixture: fixtures/terminal-reader-delete.http
        expect: delete
        resource: tmr_ShopFront0001

