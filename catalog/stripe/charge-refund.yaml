# Stripe REST API: charge refund
operations:
  - id: stripe.charge-refund.create
    match: { rest: { method: POST, path: "/v1/charges/{charge}/refunds" } }
    class: money
    resource: { arg: charge, kind: charge }
    card: "Refund charge {charge}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/charge-refund-create.http
        expect: money
        resource: ch_3ShopCharge0001

  - id: stripe.charge-refund.update
    match: { rest: { method: POST, path: "/v1/charges/{charge}/refunds/{refund}" } }
    class: write
    resource: { arg: refund, kind: refund }
    card: "Update refund {refund}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/charge-refund-update.http
        expect: write
        resource: re_3ShopRefund0001
