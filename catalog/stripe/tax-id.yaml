# Stripe REST API: tax id
operations:
  - id: stripe.tax-id.create
    match: { rest: { method: POST, path: "/v1/tax_ids" } }
    class: write
    card: "Add tax ID {body.value}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/tax-id-create.http
        expect: write

  - id: stripe.tax-id.delete
    match: { rest: { method: DELETE, path: "/v1/tax_ids/{id}" } }
    class: delete
    resource: { arg: id, kind: tax_id }
    card: "Remove tax ID {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      The tax ID can be added again.
    tests:
      - fixture: fixtures/tax-id-delete.http
        expect: delete
        resource: txi_ShopVat0001
