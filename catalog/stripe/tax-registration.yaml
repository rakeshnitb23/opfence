# Stripe REST API: tax registration
operations:
  - id: stripe.tax-registration.create
    match: { rest: { method: POST, path: "/v1/tax/registrations" } }
    class: write
    card: "Register for tax in {body.country}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Stripe starts collecting tax in that jurisdiction.
    tests:
      - fixture: fixtures/tax-registration-create.http
        expect: write

  - id: stripe.tax-registration.update
    match: { rest: { method: POST, path: "/v1/tax/registrations/{id}" } }
    class: write
    resource: { arg: id, kind: tax_registration }
    card: "Change tax registration {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    tests:
      - fixture: fixtures/tax-registration-update.http
        expect: write
        resource: taxreg_ShopDe0001
