# Stripe REST API: customer session
operations:
  - id: stripe.customer-session.create
    match: { rest: { method: POST, path: "/v1/customer_sessions" } }
    class: credential
    card: "Create a client session for customer {body.customer}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      The client_secret lets the browser list and use the customer's saved
      payment methods. The response hands out a secret or URL that gives its
      holder access to the account or customer beyond one payment.
    tests:
      - fixture: fixtures/customer-session-create.http
        expect: credential
