# Stripe REST API: customer subscription discount
operations:
  - id: stripe.customer-subscription-discount.delete
    match: { rest: { method: DELETE, path: "/v1/customers/{customer}/subscriptions/{subscription_exposed_id}/discount" } }
    class: delete
    resource: { arg: subscription_exposed_id, kind: subscription }
    card: "Remove the discount of subscription {subscription_exposed_id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      The coupon can be applied again while it exists.
    tests:
      - fixture: fixtures/customer-subscription-discount-delete.http
        expect: delete
        resource: sub_ShopPro0001
