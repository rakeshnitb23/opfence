# Stripe REST API: app secret
operations:
  - id: stripe.app-secret.set
    match: { rest: { method: POST, path: "/v1/apps/secrets" } }
    class: credential
    card: "Set app secret {body.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      The secret store of Stripe Apps.
    tests:
      - fixture: fixtures/app-secret-set.http
        expect: credential

  - id: stripe.app-secret.delete
    match: { rest: { method: POST, path: "/v1/apps/secrets/delete" } }
    class: irreversible
    card: "Delete app secret {body.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Stripe does not return a deleted secret.
    tests:
      - fixture: fixtures/app-secret-delete.http
        expect: irreversible

  - id: stripe.app-secret.find
    match: { rest: { method: GET, path: "/v1/apps/secrets/find" } }
    class: credential
    card: "Read app secret {query.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Finding a secret with expand[]=payload returns its plain value. Stripe
      sends expand as form keys like expand[]=number or expand[0]=number,
      which conditions cannot address, so the rule assumes the secret is
      requested.
    tests:
      - fixture: fixtures/app-secret-find.http
        expect: credential

  - id: stripe.app-secret.list
    match: { rest: { method: GET, path: "/v1/apps/secrets" } }
    class: credential
    card: "List app secrets"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Values come back with expand[]=data.payload. Stripe sends expand as form
      keys like expand[]=number or expand[0]=number, which conditions cannot
      address, so the rule assumes the secret is requested.
    tests:
      - fixture: fixtures/app-secret-list.http
        expect: credential
