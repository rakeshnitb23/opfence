# Stripe REST API: app secret
operations:
  - id: stripe.app-secret.set
    match: { rest: { method: POST, path: "/v1/apps/secrets" } }
    class: credential
    card: "Set app secret {body.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      The secret store of Stripe Apps.
    tests:
      - fixture: fixtures/app-secret-set.http
        expect: credential

  - id: stripe.app-secret.delete
    match: { rest: { method: POST, path: "/v1/apps/secrets/delete" } }
    class: irreversible
    card: "Delete app secret {body.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Stripe does not return a deleted secret.
    tests:
      - fixture: fixtures/app-secret-delete.http
        expect: irreversible

  - id: stripe.app-secret.find
    match: { rest: { method: GET, path: "/v1/apps/secrets/find" } }
    class: read
    when:
      - if: { arg: query.expand, matches: "(^|\\.)payload$" }
        class: credential
    card: "Read app secret {query.name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Without expand the secret's metadata comes back; expand[]=payload
      returns its plain value. The spec lists no expandable fields for
      apps.secret, but payload is the plaintext value and Stripe's Apps docs
      fetch it with expand[]=payload, so any expand ending in payload counts.
    tests:
      - fixture: fixtures/app-secret-find.http
        expect: read
      - fixture: fixtures/app-secret-find-payload.http
        expect: credential
      - fixture: fixtures/app-secret-find-payload-indexed.http
        expect: credential

  - id: stripe.app-secret.list
    match: { rest: { method: GET, path: "/v1/apps/secrets" } }
    class: read
    when:
      - if: { arg: query.expand, matches: "(^|\\.)payload$" }
        class: credential
    card: "List app secrets"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/stripe/openapi/blob/master/latest/openapi.spec3.json
    notes: >-
      Values come back only with expand[]=data.payload.
    tests:
      - fixture: fixtures/app-secret-list.http
        expect: read
      - fixture: fixtures/app-secret-list-payload.http
        expect: credential
