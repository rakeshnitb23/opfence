provider: upstash-mcp
title: Upstash MCP
docs: https://github.com/upstash/mcp-server
# Upstash's official MCP server (@upstash/mcp-server, source
# github.com/upstash/mcp-server), read from version 0.3.0. It runs locally,
# over stdio or (with --transport http) on a local port, and calls the
# Upstash management API (api.upstash.com) with UPSTASH_EMAIL and
# UPSTASH_API_KEY, each Redis database's REST endpoint, QStash
# (qstash-*.upstash.io) and Upstash Box (us-east-1.box.upstash.com).
# Upstash hosts no remote MCP server, so there are no hosts and the agent hook
# sees the tool calls. With a read-only API key the server hides every tool
# it does not mark readonly. The README names the server "upstash" in every
# client config.
# No detect or auth block: the keys are the management API's (a future
# catalog/upstash would own UPSTASH_API_KEY), and swapping them for
# placeholders would break a local server no proxy rule re-injects them for.
# Fixtures are .json tool calls (tool + arguments).
mcp:
  names: [upstash, upstash-mcp, upstash-mcp-server]
  package: "@upstash/mcp-server"
