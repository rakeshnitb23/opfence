# Atlas App Services Admin API v3: services.
# Generated from the published OpenAPI file (see provider.yaml); classes reviewed by hand.
operations:
  - id: atlas-app-services.services.link-multi-data-sources
    match: { rest: { method: POST, path: "/api/admin/v3.0/groups/{groupId}/apps/{appId}/multi_data_sources" } }
    class: access
    resource: { arg: appId, kind: app }
    card: "Link multiple data sources in app {appId}"
    status: verified
    verified: 2026-10-22
    sources:
      - https://github.com/mongodb/docs/blob/main/content/app-services/source/openapi-admin-v3.yaml
    notes: >-
      Linking a cluster gives the app, and through its rules the app's users, access to its data.
    tests:
      - fixture: fixtures/services-link-multi-data-sources.http
        expect: access
        resource: "64b0c1d2e3f4a5b6c7d8e9f0"

  - id: atlas-app-services.services.create-service
    match: { rest: { method: POST, path: "/api/admin/v3.0/groups/{groupId}/apps/{appId}/services" } }
    class: access
    resource: { arg: appId, kind: app }
    card: "Create a data source or third-party service in app {appId}"
    status: verified
    verified: 2026-10-22
    sources:
      - https://github.com/mongodb/docs/blob/main/content/app-services/source/openapi-admin-v3.yaml
    notes: >-
      Linking a cluster or a third-party service gives the app access to it.
    tests:
      - fixture: fixtures/services-create-service.http
        expect: access
        resource: "64b0c1d2e3f4a5b6c7d8e9f0"

  - id: atlas-app-services.services.delete-service
    match: { rest: { method: DELETE, path: "/api/admin/v3.0/groups/{groupId}/apps/{appId}/services/{serviceId}" } }
