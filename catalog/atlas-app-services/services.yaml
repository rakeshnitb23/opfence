    resource: { arg: appId, kind: app }
    card: "Delete a data source or third-party service {serviceId} in app {appId}"
    status: verified
    verified: 2026-10-22
    sources:
      - https://github.com/mongodb/docs/blob/main/content/app-services/source/openapi-admin-v3.yaml
    notes: >-
      Unlinks the data source or service; its data stays where it is.
    tests:
      - fixture: fixtures/services-delete-service.http
        expect: delete
        resource: "64b0c1d2e3f4a5b6c7d8e9f0"

  - id: atlas-app-services.services.update-service
