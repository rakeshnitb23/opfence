# DigitalOcean REST API: app
operations:
  - id: digitalocean.app.create
    match: { rest: { method: POST, path: /v2/apps } }
    class: money
    when:
      - if: { arg: body.spec, present: true }
        class: money
      - if: { arg: body.spec.services.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.workers.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.jobs.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.functions.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.static_sites.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.services.log_destinations, present: true }
        class: credential
      - if: { arg: body.spec.workers.log_destinations, present: true }
        class: credential
      - if: { arg: body.spec.jobs.log_destinations, present: true }
        class: credential
      - if: { arg: body.spec.functions.log_destinations, present: true }
        class: credential
      - if: { arg: body.spec.services.image.registry_credentials, present: true }
        class: credential
      - if: { arg: body.spec.workers.image.registry_credentials, present: true }
        class: credential
      - if: { arg: body.spec.jobs.image.registry_credentials, present: true }
        class: credential
      - if: { arg: body.spec.domains, present: true }
        class: access
    resource: { arg: body.spec.name, kind: app }
    card: "Create App Platform app {body.spec.name} in {body.spec.region}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/apps/apps_create.yml
    notes: >-
      The spec sets instance sizes and counts and can add dev databases, so
      any change can change the bill. SECRET env vars, log-destination keys
      and image registry credentials store secrets; domains put the app on a
      public name.
    tests:
      - fixture: fixtures/app-create.http
        expect: money
        resource: shop-web
      - fixture: fixtures/app-create-secret.http
        expect: credential
        resource: shop-web
      - fixture: fixtures/app-create-domain.http
        expect: money
        resource: shop-web
      - fixture: fixtures/app-create-log-destination.http
        expect: credential
        resource: shop-web

  - id: digitalocean.app.delete
    match: { rest: { method: DELETE, path: "/v2/apps/{id}" } }
    class: irreversible
    resource: { arg: id, kind: app }
    card: "Delete App Platform app {id} with its dev databases and secrets"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/apps/apps_delete.yml
    notes: >-
      Dev databases and SECRET env values go with the app.
    tests:
      - fixture: fixtures/app-delete.http
        expect: irreversible
        resource: "4f6c71e2-1e90-4762-9fee-6cc4a0a9f2cf"

  - id: digitalocean.app.update
    match: { rest: { method: PUT, path: "/v2/apps/{id}" } }
    class: money
    when:
      - if: { arg: body.spec, present: true }
        class: money
      - if: { arg: body.spec.services.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.workers.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.jobs.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.functions.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.static_sites.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.envs.type, equals: "SECRET" }
        class: credential
      - if: { arg: body.spec.services.log_destinations, present: true }
        class: credential
      - if: { arg: body.spec.workers.log_destinations, present: true }
        class: credential
      - if: { arg: body.spec.jobs.log_destinations, present: true }
        class: credential
      - if: { arg: body.spec.functions.log_destinations, present: true }
        class: credential
      - if: { arg: body.spec.services.image.registry_credentials, present: true }
        class: credential
      - if: { arg: body.spec.workers.image.registry_credentials, present: true }
        class: credential
      - if: { arg: body.spec.jobs.image.registry_credentials, present: true }
        class: credential
      - if: { arg: body.spec.domains, present: true }
        class: access
    resource: { arg: id, kind: app }
    card: "Replace the spec of App Platform app {id} ({body.spec.name})"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/apps/apps_update.yml
    notes: >-
      The spec sets instance sizes and counts and can add dev databases, so
      any change can change the bill. SECRET env vars, log-destination keys
      and image registry credentials store secrets; domains put the app on a
      public name.
    tests:
      - fixture: fixtures/app-update.http
        expect: money
        resource: "4f6c71e2-1e90-4762-9fee-6cc4a0a9f2cf"
      - fixture: fixtures/app-update-secret.http
        expect: credential
        resource: "4f6c71e2-1e90-4762-9fee-6cc4a0a9f2cf"
      - fixture: fixtures/app-update-domain.http
        expect: money
        resource: "4f6c71e2-1e90-4762-9fee-6cc4a0a9f2cf"

