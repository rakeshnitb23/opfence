    resource: { arg: session_id, kind: agent-session }
    card: "Fork hosted agent session {session_id} into {body.count} new sessions"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_create_session_fork.yml
    notes: >-
      Each child is a new billed sandbox.
    tests:
      - fixture: fixtures/agent-session-fork.http
        expect: money
        resource: a1b2c3d4-e5f6-7890-abcd-ef1234567890

  - id: digitalocean.agent-session.resolve-approval
    match: { rest: { method: POST, path: "/v2/agents/sessions/{session_id}/hitl/{request_id}" } }
    class: access
    resource: { arg: session_id, kind: agent-session }
    card: "Answer approval request {request_id} of hosted agent session {session_id} with {body.outcome}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_post_session_hitl.yml
    notes: >-
      Approves or rejects a tool call the hosted agent is waiting on: a
      permission decision made for the human.
    tests:
      - fixture: fixtures/agent-session-resolve-approval.http
        expect: access
        resource: a1b2c3d4-e5f6-7890-abcd-ef1234567890

  - id: digitalocean.agent-session.send-input
    match: { rest: { method: POST, path: "/v2/agents/sessions/{session_id}/input" } }
