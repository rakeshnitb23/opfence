# DigitalOcean REST API: agent-session
operations:
  - id: digitalocean.agent-session.create
    match: { rest: { method: POST, path: /v2/agents/sessions } }
    class: money
    resource: { arg: body.name, kind: agent-session }
    card: "Start a hosted agent session {body.name} from config {body.config_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_create_session.yml
    notes: >-
      Provisions a billed microVM sandbox.
    tests:
      - fixture: fixtures/agent-session-create.http
        expect: money
        resource: demo-agent

  - id: digitalocean.agent-session.validate-policy
    match: { rest: { method: POST, path: /v2/agents/sessions/policy/validate } }
    class: read
    card: "Check a hosted agent tool-permission policy"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_validate_session_policy.yml
    notes: >-
      Validates a manifest without creating anything.
    tests:
      - fixture: fixtures/agent-session-validate-policy.http
        expect: read

  - id: digitalocean.agent-session.delete
    match: { rest: { method: DELETE, path: "/v2/agents/sessions/{session_id}" } }
    class: irreversible
    resource: { arg: session_id, kind: agent-session }
    card: "Destroy hosted agent session {session_id} and its sandbox"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_delete_session.yml
    notes: >-
      The schema says workspace contents are kept only per tenant policy,
      which the request does not show; assume the sandbox state is gone.
    tests:
      - fixture: fixtures/agent-session-delete.http
        expect: irreversible
        resource: a1b2c3d4-e5f6-7890-abcd-ef1234567890

  - id: digitalocean.agent-session.update
    match: { rest: { method: PATCH, path: "/v2/agents/sessions/{session_id}" } }
    class: write
    resource: { arg: session_id, kind: agent-session }
    card: "Change settings of hosted agent session {session_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_update_session.yml
    tests:
      - fixture: fixtures/agent-session-update.http
        expect: write
        resource: a1b2c3d4-e5f6-7890-abcd-ef1234567890

  - id: digitalocean.agent-session.checkpoint
    match: { rest: { method: POST, path: "/v2/agents/sessions/{session_id}/checkpoints" } }
    class: write
    resource: { arg: session_id, kind: agent-session }
    card: "Checkpoint hosted agent session {session_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_create_session_checkpoint.yml
    tests:
      - fixture: fixtures/agent-session-checkpoint.http
        expect: write
        resource: a1b2c3d4-e5f6-7890-abcd-ef1234567890

  - id: digitalocean.agent-session.delete-checkpoint
    match: { rest: { method: DELETE, path: "/v2/agents/sessions/{session_id}/checkpoints/{checkpoint_id}" } }
    class: irreversible
    resource: { arg: session_id, kind: agent-session }
    card: "Delete checkpoint {checkpoint_id} of hosted agent session {session_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_delete_session_checkpoint.yml
    notes: >-
      Removes the checkpoint and its machine-state capture.
    tests:
      - fixture: fixtures/agent-session-delete-checkpoint.http
        expect: irreversible
        resource: a1b2c3d4-e5f6-7890-abcd-ef1234567890

  - id: digitalocean.agent-session.rollback
    match: { rest: { method: POST, path: "/v2/agents/sessions/{session_id}/checkpoints/{checkpoint_id}/rollback" } }
    class: irreversible
    resource: { arg: session_id, kind: agent-session }
    card: "Roll hosted agent session {session_id} back to checkpoint {checkpoint_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_revert_session_checkpoint.yml
    notes: >-
      Rewinds the sandbox; state written after the checkpoint is discarded.
    tests:
      - fixture: fixtures/agent-session-rollback.http
        expect: irreversible
        resource: a1b2c3d4-e5f6-7890-abcd-ef1234567890

  - id: digitalocean.agent-session.fork
    match: { rest: { method: POST, path: "/v2/agents/sessions/{session_id}/fork" } }
