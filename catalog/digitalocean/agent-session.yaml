    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/agents/agents_create_session_input.yml
    notes: >-
      The hosted agent acts on the message with its own tools and credentials,
      including shell commands in its sandbox.
    tests:
      - fixture: fixtures/agent-session-send-input.http
        expect: irreversible
        resource: a1b2c3d4-e5f6-7890-abcd-ef1234567890

