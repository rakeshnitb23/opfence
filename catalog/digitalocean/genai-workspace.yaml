# DigitalOcean REST API: genai-workspace
operations:
  - id: digitalocean.genai-workspace.create
    match: { rest: { method: POST, path: /v2/gen-ai/workspaces } }
    class: credential
    resource: { arg: body.name, kind: genai-workspace }
    card: "Create GenAI workspace {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_create_workspace.yml
    response:
      redact: [workspace.agents.api_key_infos.secret_key, workspace.agents.api_keys.api_key, workspace.agents.functions.api_key, workspace.agents.mcp_servers.authorization, workspace.agents.mcp_servers.headers, workspace.agents.child_agents, workspace.agents.parent_agents, workspace.agents.workspace.agents]
      class: write
    notes: >-
      The workspace lists its agents. The response is a GenAI agent object,
      which carries its API keys (api_keys[].api_key,
      api_key_infos[].secret_key), function route keys (functions[].api_key)
      and MCP server authorization and headers, plus nested child_agents,
      parent_agents and workspace.agents with the same fields; the schema does
      not say any of them are masked. The nested agent lists are redacted
      whole because they can nest without limit. Under opfence run the proxy
      redacts those fields and the call is write; anywhere else it is
      credential.
    tests:
      - fixture: fixtures/genai-workspace-create.http
        expect: credential
        response: fixtures/genai-workspace-create-response.json
        resource: "example name"

