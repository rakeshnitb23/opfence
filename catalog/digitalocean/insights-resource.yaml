# DigitalOcean REST API: insights-resource
operations:
  - id: digitalocean.insights-resource.signals-update
    match: { rest: { method: PUT, path: "/v2/insights/resources/{resource_urn}/signals" } }
    class: write
    when:
      - if: { arg: body.metrics, equals: "false" }
        class: delete
      - if: { arg: body.logs, equals: "false" }
        class: delete
      - if: { arg: body.traces, equals: "false" }
        class: delete
    resource: { arg: resource_urn, kind: resource }
    card: "Change which telemetry signals Insights collects for {resource_urn}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/insights/insights_update_resourceSignals.yml
    notes: >-
      Turns metrics, logs or traces collection on or off (merge semantics).
      Turning a signal off stops collecting it, which hides what happens on
      the resource from then on, so it is a delete.
    tests:
      - fixture: fixtures/insights-resource-signals-enable.http
        expect: write
        resource: "do:droplet:12345"
      - fixture: fixtures/insights-resource-signals-disable.http
        expect: delete
        resource: "do:droplet:12345"
