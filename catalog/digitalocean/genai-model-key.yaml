# DigitalOcean REST API: genai-model-key
operations:
  - id: digitalocean.genai-model-key.create
    match: { rest: { method: POST, path: /v2/gen-ai/models/api_keys } }
    class: credential
    resource: { arg: body.name, kind: genai-model-key }
    card: "Create model access key {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_create_model_api_key.yml
    notes: >-
      The key is returned in the response.
    tests:
      - fixture: fixtures/genai-model-key-create.http
        expect: credential
        resource: "Production Key"

  - id: digitalocean.genai-model-key.rename
    match: { rest: { method: PUT, path: "/v2/gen-ai/models/api_keys/{api_key_uuid}" } }
    class: credential
    resource: { arg: api_key_uuid, kind: genai-model-key }
    card: "Rename model access key {api_key_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_update_model_api_key.yml
    response:
      redact: [api_key_info.secret_key]
      class: write
    notes: >-
      The response returns the key object with its secret_key. Under opfence
      run the proxy redacts those fields and the call is write; anywhere else
      it is credential.
    tests:
      - fixture: fixtures/genai-model-key-rename.http
        expect: credential
        response: fixtures/genai-model-key-rename-response.json
        resource: "5d8c1a2e-b7d6-11ef-bf8f-4e013e2ddde4"

  - id: digitalocean.genai-model-key.delete
    match: { rest: { method: DELETE, path: "/v2/gen-ai/models/api_keys/{api_key_uuid}" } }
    class: credential
    resource: { arg: api_key_uuid, kind: genai-model-key }
    card: "Revoke model access key {api_key_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_delete_model_api_key.yml
    response:
      redact: [api_key_info.secret_key]
      class: access
    notes: >-
      The response returns the key object with its secret_key. Under opfence
      run the proxy redacts those fields and the call is access; anywhere else
      it is credential.
    tests:
      - fixture: fixtures/genai-model-key-delete.http
        expect: credential
        response: fixtures/genai-model-key-delete-response.json
        resource: "5d8c1a2e-b7d6-11ef-bf8f-4e013e2ddde4"

  - id: digitalocean.genai-model-key.regenerate
    match: { rest: { method: PUT, path: "/v2/gen-ai/models/api_keys/{api_key_uuid}/regenerate" } }
    class: credential
    resource: { arg: api_key_uuid, kind: genai-model-key }
    card: "Regenerate model access key {api_key_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_regenerate_model_api_key.yml
    notes: >-
      Returns the new key; the old one stops working.
    tests:
      - fixture: fixtures/genai-model-key-regenerate.http
        expect: credential
        resource: "5d8c1a2e-b7d6-11ef-bf8f-4e013e2ddde4"

  - id: digitalocean.genai-model-key.list
    match: { rest: { method: GET, path: /v2/gen-ai/models/api_keys } }
    class: credential
    card: "List model access keys"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_list_model_api_keys.yml
    response:
      redact: [api_key_infos.secret_key]
      class: read
    notes: >-
      The key objects carry secret_key, and the schema does not say it is
      masked. Under opfence run the proxy redacts those fields and the call is
      just a read; anywhere else it is credential.
    tests:
      - fixture: fixtures/genai-model-key-list.http
        expect: credential
        response: fixtures/genai-model-key-list-response.json
