# DigitalOcean REST API: genai-simulation
operations:
  - id: digitalocean.genai-simulation.create-scenario-set-from-library
    match: { rest: { method: POST, path: "/v2/gen-ai/scenario_library/{library_scenario_uuid}/create_scenario_set" } }
    class: write
    resource: { arg: library_scenario_uuid, kind: genai-scenario-library }
    card: "Create scenario set {body.name} from library entry {library_scenario_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_create_scenario_set_from_library.yml
    tests:
      - fixture: fixtures/genai-simulation-create-scenario-set-from-library.http
        expect: write
        resource: e115a317-b7d6-11ef-bf8f-4e013e2ddde4

  - id: digitalocean.genai-simulation.create-scenario-set
    match: { rest: { method: POST, path: /v2/gen-ai/scenario_sets } }
    class: write
    resource: { arg: body.name, kind: genai-simulation }
    card: "Create scenario set {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_create_scenario_set.yml
    tests:
      - fixture: fixtures/genai-simulation-create-scenario-set.http
        expect: write
        resource: support-agent-scenarios

  - id: digitalocean.genai-simulation.scenario-set-upload-urls
    match: { rest: { method: POST, path: /v2/gen-ai/scenario_sets/file_upload_presigned_urls } }
    class: write
    card: "Get upload URLs for scenario set files"
