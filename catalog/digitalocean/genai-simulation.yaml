  - id: digitalocean.genai-simulation.generate-scenario-set
    match: { rest: { method: POST, path: /v2/gen-ai/scenario_sets/generate } }
    class: money
    resource: { arg: body.name, kind: genai-simulation }
    card: "Generate {body.num_scenarios} scenarios as {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_generate_scenario_set.yml
    notes: >-
      Generation runs billed inference.
    tests:
      - fixture: fixtures/genai-simulation-generate-scenario-set.http
        expect: money
        resource: billing-support-generated

  - id: digitalocean.genai-simulation.update-scenario-set
    match: { rest: { method: PUT, path: "/v2/gen-ai/scenario_sets/{scenario_set_uuid}" } }
    class: write
