# DigitalOcean REST API: insights-query
operations:
  - id: digitalocean.insights-query.query
    match: { rest: { method: POST, path: "/v2/insights/query/{region}/prom/api/v1/query" } }
    class: read
    card: "Run a PromQL query in {region}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/insights/insights_post_promQuery.yml
    notes: >-
      A query sent as POST; it reads metrics.
    tests:
      - fixture: fixtures/insights-query-query.http
        expect: read

