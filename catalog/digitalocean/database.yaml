  - id: digitalocean.database.set-autoscale
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/autoscale" } }
    class: write
    when:
      - if: { arg: body.storage.enabled, equals: "true" }
        class: money
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Configure storage autoscaling of cluster {database_cluster_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_autoscale.yml
    notes: >-
      Enabled storage autoscaling adds billed storage without asking.
    tests:
      - fixture: fixtures/database-set-autoscale.http
        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"
      - fixture: fixtures/database-set-autoscale-enable.http
        expect: money
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.set-metrics-credentials
    match: { rest: { method: PUT, path: /v2/databases/metrics/credentials } }
    class: credential
    card: "Set the metrics endpoint credentials of all database clusters"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_cluster_metrics_credentials.yml
    tests:
