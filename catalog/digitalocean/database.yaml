# DigitalOcean REST API: database
operations:
  - id: digitalocean.database.create
    match: { rest: { method: POST, path: /v2/databases } }
    class: credential
    when:
      - if: { arg: body.name, present: true }
        class: money
      - if: { arg: body.name, present: true }
        class: credential
    resource: { arg: body.name, kind: database }
    card: "Create {body.engine} database cluster {body.name} ({body.size} x{body.num_nodes}) in {body.region}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_create_cluster.yml
    notes: >-
      A billed cluster (money), and the response carries the admin user's
      password and connection strings (credential).
    tests:
      - fixture: fixtures/database-create.http
        expect: credential
        resource: backend

  - id: digitalocean.database.delete
    match: { rest: { method: DELETE, path: "/v2/databases/{database_cluster_uuid}" } }
    class: irreversible
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Destroy database cluster {database_cluster_uuid} and its data"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_destroy_cluster.yml
    tests:
      - fixture: fixtures/database-delete.http
        expect: irreversible
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.update-config
    match: { rest: { method: PATCH, path: "/v2/databases/{database_cluster_uuid}/config" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Change engine settings of database cluster {database_cluster_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_patch_config.yml
    tests:
      - fixture: fixtures/database-update-config.http
        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.start-migration
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/online-migration" } }
    class: irreversible
    when:
      - if: { arg: body.source, present: true }
        class: irreversible
      - if: { arg: body.source.password, present: true }
        class: credential
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Start replicating {body.source.host} into database cluster {database_cluster_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_onlineMigration.yml
    notes: >-
      Replicates an external database into this cluster, replacing what is
      there; the body carries the source database password.
    tests:
      - fixture: fixtures/database-start-migration.http
        expect: irreversible
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.stop-migration
    match: { rest: { method: DELETE, path: "/v2/databases/{database_cluster_uuid}/online-migration/{migration_id}" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Stop online migration {migration_id} into database cluster {database_cluster_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_delete_onlineMigration.yml
    tests:
      - fixture: fixtures/database-stop-migration.http
        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.migrate-region
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/migrate" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Move database cluster {database_cluster_uuid} to region {body.region}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_region.yml
    tests:
      - fixture: fixtures/database-migrate-region.http
        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.resize
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/resize" } }
    class: money
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Resize database cluster {database_cluster_uuid} to {body.size} x{body.num_nodes}"
    status: verified
    verified: 2026-10-18
    sources:
