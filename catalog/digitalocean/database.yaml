    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_maintenanceWindow.yml
    tests:
      - fixture: fixtures/database-set-maintenance-window.http
        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.install-update
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/install_update" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Start maintenance on database cluster {database_cluster_uuid} now"
