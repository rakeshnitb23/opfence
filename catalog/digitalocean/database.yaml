        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.upgrade-version
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/upgrade" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Upgrade database cluster {database_cluster_uuid} to version {body.version}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_upgrade_major_version.yml
