    notes: >-
      Database cluster objects carry connection strings with the admin
      password and each user's password.
    tests:
      - fixture: fixtures/database-read.http
        expect: credential
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.read-metrics-credentials
    match: { rest: { method: GET, path: /v2/databases/metrics/credentials } }
    class: credential
    card: "Read the metrics endpoint password of database clusters"
    status: verified
    verified: 2026-10-18
