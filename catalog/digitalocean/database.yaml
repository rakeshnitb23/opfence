  - id: digitalocean.database.set-eviction-policy
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/eviction_policy" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Set the eviction policy of cluster {database_cluster_uuid} to {body.eviction_policy}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_evictionPolicy.yml
    tests:
      - fixture: fixtures/database-set-eviction-policy.http
        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.set-sql-mode
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/sql_mode" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Set the SQL mode of MySQL cluster {database_cluster_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_sql_mode.yml
    tests:
