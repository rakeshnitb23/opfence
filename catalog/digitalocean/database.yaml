      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_delete_opensearch_index.yml
    tests:
      - fixture: fixtures/database-delete-index.http
        expect: irreversible
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.list
    match: { rest: { method: GET, path: /v2/databases } }
    class: credential
    card: "List database clusters with their passwords"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_list_clusters.yml
    notes: >-
      Database cluster objects carry connection strings with the admin
      password and each user's password.
    tests:
      - fixture: fixtures/database-list.http
        expect: credential

  - id: digitalocean.database.list-options
    match: { rest: { method: GET, path: /v2/databases/options } }
    class: read
    card: "List database engines, versions and sizes"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_list_options.yml
    notes: >-
      Listed so that /v2/databases/{database_cluster_uuid} does not claim it.
    tests:
      - fixture: fixtures/database-list-options.http
