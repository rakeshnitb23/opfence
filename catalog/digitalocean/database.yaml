        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.update-firewall
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/firewall" } }
    class: access
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Replace the trusted sources of database cluster {database_cluster_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_firewall_rules.yml
    notes: >-
      Trusted sources decide who can connect; an empty list opens the cluster
      to any address.
    tests:
      - fixture: fixtures/database-update-firewall.http
        expect: access
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.update-do-settings
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/do_settings" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Change service CNAMEs of database cluster {database_cluster_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/databases/databases_update_do_settings.yml
    tests:
      - fixture: fixtures/database-update-do-settings.http
        expect: write
        resource: "9cc10173-e9ea-4176-9dbc-a4cee4c4ff30"

  - id: digitalocean.database.set-maintenance-window
    match: { rest: { method: PUT, path: "/v2/databases/{database_cluster_uuid}/maintenance" } }
    class: write
    resource: { arg: database_cluster_uuid, kind: database }
    card: "Set the maintenance window of database cluster {database_cluster_uuid} to {body.day} {body.hour}"
