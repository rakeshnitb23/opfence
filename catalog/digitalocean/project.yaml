# DigitalOcean REST API: project
operations:
  - id: digitalocean.project.create
    match: { rest: { method: POST, path: /v2/projects } }
    class: write
    resource: { arg: body.name, kind: project }
    card: "Create project {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/projects/projects_create.yml
    tests:
      - fixture: fixtures/project-create.http
        expect: write
        resource: my-web-api

