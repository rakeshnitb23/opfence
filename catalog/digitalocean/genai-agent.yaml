  - id: digitalocean.genai-agent.update
    match: { rest: { method: PUT, path: "/v2/gen-ai/agents/{uuid}" } }
    class: write
    when:
      - if: { arg: body.mcp_servers.authorization, present: true }
        class: credential
      - if: { arg: body.mcp_servers.headers, present: true }
        class: credential
    resource: { arg: uuid, kind: genai-agent }
    card: "Change GenAI agent {uuid}"
    status: verified
