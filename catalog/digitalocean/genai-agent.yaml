    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_get_agent.yml
    notes: >-
      Agent objects include their API keys (api_keys[].api_key,
      api_key_infos[].secret_key); the schema does not say they are masked.
    tests:
      - fixture: fixtures/genai-agent-read.http
        expect: credential
        resource: "1b418231-b7d6-11ef-bf8f-4e013e2ddde4"

