# DigitalOcean REST API: genai-agent
operations:
  - id: digitalocean.genai-agent.create
    match: { rest: { method: POST, path: /v2/gen-ai/agents } }
    class: credential
    when:
      - if: { arg: body.mcp_servers.authorization, present: true }
        class: credential
      - if: { arg: body.mcp_servers.headers, present: true }
        class: credential
    resource: { arg: body.name, kind: genai-agent }
    card: "Create GenAI agent {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_create_agent.yml
    response:
      redact: [agent.api_key_infos.secret_key, agent.api_keys.api_key, agent.functions.api_key, agent.mcp_servers.authorization, agent.mcp_servers.headers, agent.child_agents, agent.parent_agents, agent.workspace.agents]
      class: write
    notes: >-
      MCP server authorization and headers store credentials for those
      servers. Inference is billed per use, not on creation. The response is a
      GenAI agent object, which carries its API keys (api_keys[].api_key,
      api_key_infos[].secret_key), function route keys (functions[].api_key)
      and MCP server authorization and headers, plus nested child_agents,
      parent_agents and workspace.agents with the same fields; the schema does
      not say any of them are masked. The nested agent lists are redacted
      whole because they can nest without limit. Under opfence run the proxy
      redacts those fields and the call is write; anywhere else it is
      credential.
    tests:
      - fixture: fixtures/genai-agent-create.http
        expect: credential
        response: fixtures/genai-agent-create-response.json
        resource: support-bot
      - fixture: fixtures/genai-agent-create-mcp-auth.http
        expect: credential
        resource: support-bot

