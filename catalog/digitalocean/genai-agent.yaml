# DigitalOcean REST API: genai-agent
operations:
  - id: digitalocean.genai-agent.create
    match: { rest: { method: POST, path: /v2/gen-ai/agents } }
    class: write
    when:
      - if: { arg: body.mcp_servers.authorization, present: true }
        class: credential
      - if: { arg: body.mcp_servers.headers, present: true }
        class: credential
    resource: { arg: body.name, kind: genai-agent }
    card: "Create GenAI agent {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_create_agent.yml
    notes: >-
      MCP server authorization and headers store credentials for those
      servers. Inference is billed per use, not on creation.
    tests:
      - fixture: fixtures/genai-agent-create.http
        expect: write
        resource: support-bot
      - fixture: fixtures/genai-agent-create-mcp-auth.http
        expect: credential
        resource: support-bot

  - id: digitalocean.genai-agent.create-api-key
    match: { rest: { method: POST, path: "/v2/gen-ai/agents/{agent_uuid}/api_keys" } }
    class: credential
    resource: { arg: agent_uuid, kind: genai-agent }
    card: "Create API key {body.name} for agent {agent_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_create_agent_api_key.yml
    notes: >-
      The key is returned in the response.
    tests:
      - fixture: fixtures/genai-agent-create-api-key.http
        expect: credential
        resource: "1b418231-b7d6-11ef-bf8f-4e013e2ddde4"

