    tests:
      - fixture: fixtures/genai-agent-delete.http
        expect: irreversible
        resource: "1b418231-b7d6-11ef-bf8f-4e013e2ddde4"

  - id: digitalocean.genai-agent.set-visibility
    match: { rest: { method: PUT, path: "/v2/gen-ai/agents/{uuid}/deployment_visibility" } }
    class: write
    when:
      - if: { arg: body.visibility, equals: "VISIBILITY_PUBLIC" }
        class: access
    resource: { arg: uuid, kind: genai-agent }
    card: "Set visibility of agent {uuid} to {body.visibility}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_update_agent_deployment_visibility.yml
    notes: >-
      VISIBILITY_PUBLIC lets anyone on the internet call the agent without a
      key.
    tests:
      - fixture: fixtures/genai-agent-set-visibility.http
        expect: write
        resource: "1b418231-b7d6-11ef-bf8f-4e013e2ddde4"
      - fixture: fixtures/genai-agent-set-visibility-public.http
        expect: access
        resource: "1b418231-b7d6-11ef-bf8f-4e013e2ddde4"

