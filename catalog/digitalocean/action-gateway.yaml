    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/sessions_create.yml
    notes: >-
      A session carries the allow/ask/deny policy for an agent's tool calls.
    tests:
      - fixture: fixtures/action-gateway-create-session.http
        expect: access
        resource: support-bot-alice

