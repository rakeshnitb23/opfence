# DigitalOcean REST API: action-gateway
operations:
  - id: digitalocean.action-gateway.clear-limits
    match: { rest: { method: POST, path: "/v2/action-gateway/actors/{actor_id}/limits:clear" } }
    class: write
    resource: { arg: actor_id, kind: action-gateway-actor }
    card: "Clear rate-limit overrides of actor {actor_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/actorLimits_delete.yml
    tests:
      - fixture: fixtures/action-gateway-clear-limits.http
        expect: write
        resource: team-user-1234

  - id: digitalocean.action-gateway.set-limits
    match: { rest: { method: POST, path: "/v2/action-gateway/actors/{actor_id}/limits:set" } }
    class: write
    resource: { arg: actor_id, kind: action-gateway-actor }
    card: "Set rate-limit overrides of actor {actor_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/actorLimits_update.yml
    tests:
      - fixture: fixtures/action-gateway-set-limits.http
        expect: write
        resource: team-user-1234

  - id: digitalocean.action-gateway.create-connection
    match: { rest: { method: POST, path: /v2/action-gateway/connections } }
    class: access
    resource: { arg: body.provider, kind: action-gateway-provider }
    card: "Connect user {body.user_id} to tool provider {body.provider}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/connections_create.yml
    notes: >-
      Authorizes an end user to use a provider's tools with a stored
      credential or OAuth grant.
    tests:
      - fixture: fixtures/action-gateway-create-connection.http
        expect: access
        resource: jira

  - id: digitalocean.action-gateway.delete-connection
    match: { rest: { method: DELETE, path: "/v2/action-gateway/connections/{id}" } }
    class: access
    resource: { arg: id, kind: action-gateway-connection }
    card: "Delete tool connection {id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/connections_delete.yml
    tests:
      - fixture: fixtures/action-gateway-delete-connection.http
        expect: access
        resource: conn-9d2e41

  - id: digitalocean.action-gateway.register-mcp-server
    match: { rest: { method: POST, path: /v2/action-gateway/mcp-servers } }
    class: write
    when:
      - if: { arg: body.api_key, present: true }
        class: credential
      - if: { arg: body.oauth_client_secret, present: true }
        class: credential
    resource: { arg: body.serverRef, kind: action-gateway-mcp-server }
    card: "Register MCP server {body.serverRef} at {body.endpoint}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/mcpServers_create.yml
    notes: >-
      api_key and oauth_client_secret store secrets for the server.
    tests:
      - fixture: fixtures/action-gateway-register-mcp-server.http
        expect: write
        resource: jira-cloud
      - fixture: fixtures/action-gateway-register-mcp-server-api-key.http
        expect: credential
        resource: jira-cloud

  - id: digitalocean.action-gateway.update-mcp-server
    match: { rest: { method: PATCH, path: "/v2/action-gateway/mcp-servers/{server_ref}" } }
    class: write
    resource: { arg: server_ref, kind: action-gateway-mcp-server }
    card: "Change the description of MCP server {server_ref}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/mcpServers_patch.yml
    tests:
      - fixture: fixtures/action-gateway-update-mcp-server.http
        expect: write
        resource: jira-cloud

  - id: digitalocean.action-gateway.delete-mcp-server
    match: { rest: { method: DELETE, path: "/v2/action-gateway/mcp-servers/{server_ref}" } }
    class: delete
    resource: { arg: server_ref, kind: action-gateway-mcp-server }
    card: "Remove MCP server {server_ref}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/mcpServers_delete.yml
    tests:
      - fixture: fixtures/action-gateway-delete-mcp-server.http
        expect: delete
        resource: jira-cloud

  - id: digitalocean.action-gateway.resync-mcp-server
    match: { rest: { method: POST, path: "/v2/action-gateway/mcp-servers/{server_ref}/resync" } }
    class: write
    resource: { arg: server_ref, kind: action-gateway-mcp-server }
    card: "Rediscover the tools of MCP server {server_ref}"
    status: verified
