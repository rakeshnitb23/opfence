        expect: write
        resource: jira-cloud

  - id: digitalocean.action-gateway.set-mcp-server-tools
    match: { rest: { method: PUT, path: "/v2/action-gateway/mcp-servers/{server_ref}/tools" } }
    class: access
    resource: { arg: server_ref, kind: action-gateway-mcp-server }
    card: "Choose which tools of MCP server {server_ref} are enabled"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/action_gateway/mcpServers_update_tools.yml
    notes: >-
      Decides which tools agents may call.
    tests:
      - fixture: fixtures/action-gateway-set-mcp-server-tools.http
        expect: access
        resource: jira-cloud

