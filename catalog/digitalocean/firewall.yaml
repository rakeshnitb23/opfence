# DigitalOcean REST API: firewall
operations:
  - id: digitalocean.firewall.create
    match: { rest: { method: POST, path: /v2/firewalls } }
    class: access
    resource: { arg: body.name, kind: firewall }
    card: "Create firewall {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/firewalls/firewalls_create.yml
    notes: >-
      Cloud firewalls decide which traffic reaches Droplets.
    tests:
      - fixture: fixtures/firewall-create.http
        expect: access
        resource: firewall

  - id: digitalocean.firewall.update
    match: { rest: { method: PUT, path: "/v2/firewalls/{firewall_id}" } }
    class: access
    resource: { arg: firewall_id, kind: firewall }
    card: "Replace the rules of firewall {firewall_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/firewalls/firewalls_update.yml
    notes: >-
      Cloud firewalls decide which traffic reaches Droplets.
    tests:
      - fixture: fixtures/firewall-update.http
        expect: access
        resource: bb4b2611-3d72-467b-8602-280330ecd65c

  - id: digitalocean.firewall.delete
    match: { rest: { method: DELETE, path: "/v2/firewalls/{firewall_id}" } }
    class: access
    resource: { arg: firewall_id, kind: firewall }
    card: "Delete firewall {firewall_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/firewalls/firewalls_delete.yml
    notes: >-
      Droplets it protected are open to whatever their other firewalls allow.
    tests:
      - fixture: fixtures/firewall-delete.http
        expect: access
        resource: bb4b2611-3d72-467b-8602-280330ecd65c

  - id: digitalocean.firewall.add-droplets
