        resource: bb4b2611-3d72-467b-8602-280330ecd65c

  - id: digitalocean.firewall.remove-droplets
    match: { rest: { method: DELETE, path: "/v2/firewalls/{firewall_id}/droplets" } }
    class: access
    resource: { arg: firewall_id, kind: firewall }
    card: "Remove Droplets {body.droplet_ids} from firewall {firewall_id}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/firewalls/firewalls_delete_droplets.yml
    notes: >-
      The Droplets lose its protection.
    tests:
      - fixture: fixtures/firewall-remove-droplets.http
        expect: access
        resource: bb4b2611-3d72-467b-8602-280330ecd65c

