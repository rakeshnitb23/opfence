  - id: digitalocean.registry.delete-manifest
    match: { rest: { method: DELETE, path: "/v2/registries/{registry_name}/repositories/{repository_name}/digests/{manifest_digest}" } }
    class: irreversible
    resource: { arg: registry_name, kind: registry }
    card: "Delete manifest {manifest_digest} of {repository_name} from {registry_name}"
    status: verified
    verified: 2026-10-18
    sources:
