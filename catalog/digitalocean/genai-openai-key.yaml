# DigitalOcean REST API: genai-openai-key
operations:
  - id: digitalocean.genai-openai-key.create
    match: { rest: { method: POST, path: /v2/gen-ai/openai/keys } }
    class: credential
    resource: { arg: body.name, kind: genai-openai-key }
    card: "Store OpenAI API key {body.name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_create_openai_api_key.yml
    tests:
      - fixture: fixtures/genai-openai-key-create.http
        expect: credential
        resource: "\"Production Key\""

  - id: digitalocean.genai-openai-key.update
    match: { rest: { method: PUT, path: "/v2/gen-ai/openai/keys/{api_key_uuid}" } }
    class: write
    when:
      - if: { arg: body.api_key, present: true }
        class: credential
    resource: { arg: api_key_uuid, kind: genai-openai-key }
    card: "Change OpenAI API key {api_key_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_update_openai_api_key.yml
    notes: >-
      api_key replaces the stored secret.
    tests:
      - fixture: fixtures/genai-openai-key-update.http
        expect: write
        resource: "5d8c1a2e-b7d6-11ef-bf8f-4e013e2ddde4"
      - fixture: fixtures/genai-openai-key-update-key.http
        expect: credential
        resource: "5d8c1a2e-b7d6-11ef-bf8f-4e013e2ddde4"

  - id: digitalocean.genai-openai-key.delete
    match: { rest: { method: DELETE, path: "/v2/gen-ai/openai/keys/{api_key_uuid}" } }
    class: irreversible
    resource: { arg: api_key_uuid, kind: genai-openai-key }
    card: "Delete stored OpenAI API key {api_key_uuid}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_delete_openai_api_key.yml
    notes: >-
      The stored secret cannot be read back, so it cannot be put back; agents
      using it stop working.
    tests:
      - fixture: fixtures/genai-openai-key-delete.http
        expect: irreversible
        resource: "5d8c1a2e-b7d6-11ef-bf8f-4e013e2ddde4"

  - id: digitalocean.genai-openai-key.list-agents
    match: { rest: { method: GET, path: "/v2/gen-ai/openai/keys/{uuid}/agents" } }
    class: credential
    resource: { arg: uuid, kind: genai-openai-key }
    card: "List agents using OpenAI key {uuid}, with their API keys"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/digitalocean/openapi/blob/main/specification/resources/gen-ai/genai_list_agents_by_openai_key.yml
    notes: >-
      Agent objects include their API keys (api_keys[].api_key,
      api_key_infos[].secret_key); the schema does not say they are masked.
    tests:
      - fixture: fixtures/genai-openai-key-list-agents.http
        expect: credential
        resource: "1b418231-b7d6-11ef-bf8f-4e013e2ddde4"
