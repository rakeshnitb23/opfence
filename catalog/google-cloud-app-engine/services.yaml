# Google App Engine Admin API: services.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-app-engine.services.delete
    match: { rest: { method: DELETE, path: "/v1/apps/{project}/services/{service}" } }
    class: delete
    response: { hold: ["**.buildEnvVariables", "**.envVariables"], class: delete }
    resource: { arg: project, kind: project }
    card: "Delete App Engine service {service} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/appengine/v1/rest
    notes: >-
      Deletes the service with its versions, which can be deployed again from their source.
    tests:
      - fixture: fixtures/services-delete.http
        expect: delete
        response: fixtures/services-delete.json
        resource: "acme-prod"

