# Google App Engine Admin API: apps.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-app-engine.apps.create
    match: { rest: { method: POST, path: "/v1/apps" } }
    class: write
    response: { hold: ["**.buildEnvVariables", "**.envVariables"], class: write }
    card: "Create App Engine application"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/appengine/v1/rest
    notes: >-
      An App Engine application cannot be deleted, and its region cannot be changed.
    tests:
      - fixture: fixtures/apps-create.http
        expect: write
        response: fixtures/apps-create.json

  - id: google-cloud-app-engine.apps.patch
    match: { rest: { method: PATCH, path: "/v1/apps/{project}" } }
    class: write
    response: { hold: ["**.buildEnvVariables", "**.envVariables"], class: write }
    resource: { arg: project, kind: project }
    card: "Change App Engine application in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/appengine/v1/rest
    tests:
      - fixture: fixtures/apps-patch.http
        expect: write
        response: fixtures/apps-patch.json
        resource: "acme-prod"

  - id: google-cloud-app-engine.apps.repair
    match: { rest: { method: POST, path: "/v1/apps/{project}:repair" } }
    class: write
    response: { hold: ["**.buildEnvVariables", "**.envVariables"], class: write }
    resource: { arg: project, kind: project }
    card: "Repair App Engine application in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/appengine/v1/rest
    tests:
      - fixture: fixtures/apps-repair.http
        expect: write
        response: fixtures/apps-repair.json
        resource: "acme-prod"
