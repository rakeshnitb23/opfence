provider: google-cloud-kms
title: Google Cloud Key Management Service
docs: https://cloud.google.com/kms/docs/reference/rest
# Key rings, keys and their versions, and the operations that use them: decrypting and signing are
# credential, destroying a version irreversible.
# Generated from Google's discovery documents; every method that is not a
# GET has a rule, and so do the GETs that return secrets. The bearer token
# is a short-lived OAuth access token, which Opfence does not swap: there is
# no detect block (see LIMITS.md).
hosts: [cloudkms.googleapis.com]
auth:
  - header: Authorization
    scheme: Bearer
defaults:
  rest_safe_methods: read
schemas:
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/cloudkms/v1/rest
