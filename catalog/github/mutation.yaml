# GitHub REST and GraphQL APIs: mutation
operations:
  - id: github.mutation.delete-ref
    match: { graphql: { type: mutation, field: deleteRef } }
    class: delete
    card: "Delete ref {input.refId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/octokit/graphql-schema/blob/main/schema.graphql
    tests:
      - fixture: fixtures/mutation-delete-ref.http
        expect: delete

  - id: github.mutation.update-ref
    match: { graphql: { type: mutation, field: updateRef } }
    class: write
    when:
      - if: { arg: input.force, equals: "true" }
        class: irreversible
    card: "Move ref {input.refId} to {input.oid}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/octokit/graphql-schema/blob/main/schema.graphql
    tests:
      - fixture: fixtures/mutation-update-ref.http
        expect: write
      - fixture: fixtures/mutation-update-ref-force.http
        expect: irreversible

  - id: github.mutation.update-refs
    match: { graphql: { type: mutation, field: updateRefs } }
    class: write
    when:
      - if: { arg: input.refUpdates.force, equals: "true" }
        class: irreversible
    card: "Update refs of {input.repositoryId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/octokit/graphql-schema/blob/main/schema.graphql
    notes: >-
      Any forced update in the batch makes the whole request irreversible.
    tests:
      - fixture: fixtures/mutation-update-refs.http
        expect: write
      - fixture: fixtures/mutation-update-refs-force.http
        expect: irreversible

