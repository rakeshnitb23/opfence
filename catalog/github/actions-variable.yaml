    match: { rest: { method: POST, path: "/repos/{owner}/{repo}/actions/variables" } }
    class: write
    resource: { arg: repo, kind: repository }
    card: "Create variable {body.name} in {owner}/{repo}"
    status: verified
    verified: 2026-10-16
