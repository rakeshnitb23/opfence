# GitHub REST and GraphQL APIs: org-membership
operations:
  - id: github.org-membership.set
    match: { rest: { method: PUT, path: "/orgs/{org}/memberships/{username}" } }
    class: access
    resource: { arg: org, kind: organization }
    card: "Make {username} {body.role} of {org}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/github/rest-api-description/blob/main/descriptions/api.github.com/api.github.com.json
    tests:
      - fixture: fixtures/org-membership-set.http
        expect: access
        resource: acme

  - id: github.org-membership.remove
    match: { rest: { method: DELETE, path: "/orgs/{org}/memberships/{username}" } }
    class: access
    resource: { arg: org, kind: organization }
    card: "Remove {username}'s membership of {org}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/github/rest-api-description/blob/main/descriptions/api.github.com/api.github.com.json
    tests:
      - fixture: fixtures/org-membership-remove.http
        expect: access
        resource: acme
