provider: github
title: GitHub
docs: https://docs.github.com/en/rest
hosts: [api.github.com, github.com]
git: [github.com]                  # git over HTTPS and Git LFS
graphql: [/graphql]
auth:
  - header: Authorization          # "Bearer <token>" and the older "token <token>"
  - basic: password                # git over HTTPS: any user name, the token as password
detect:
  env: [GITHUB_TOKEN, GH_TOKEN]
  prefixes: [ghp_, gho_, ghu_, ghs_, ghr_, github_pat_]
defaults:
  graphql_query: read
  rest_safe_methods: read
# Published schemas the rules were built from; `opfence catalog check-sources`
# compares them nightly.
schemas:
  - kind: openapi
    url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
    coverage: partial
  - kind: graphql
    url: https://raw.githubusercontent.com/octokit/graphql-schema/main/schema.graphql
    coverage: partial
