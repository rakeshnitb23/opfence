# GitHub REST and GraphQL APIs: branch-protection
operations:
  - id: github.branch-protection.update
    match: { rest: { method: PUT, path: "/repos/{owner}/{repo}/branches/{branch}/protection" } }
    class: access
    resource: { arg: repo, kind: repository }
    card: "Replace branch protection on {branch} of {owner}/{repo}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/github/rest-api-description/blob/main/descriptions/api.github.com/api.github.com.json
    tests:
      - fixture: fixtures/branch-protection-update.http
