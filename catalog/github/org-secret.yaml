# GitHub REST and GraphQL APIs: org-secret
operations:
  - id: github.org-secret.set
    match: { rest: { method: PUT, path: "/orgs/{org}/actions/secrets/{secret_name}" } }
    class: credential
    resource: { arg: org, kind: organization }
    card: "Set secret {secret_name} in organization {org}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/github/rest-api-description/blob/main/descriptions/api.github.com/api.github.com.json
    tests:
      - fixture: fixtures/org-secret-set.http
        expect: credential
        resource: acme

  - id: github.org-secret.delete
    match: { rest: { method: DELETE, path: "/orgs/{org}/actions/secrets/{secret_name}" } }
    class: irreversible
    resource: { arg: org, kind: organization }
    card: "Delete secret {secret_name} in organization {org}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/github/rest-api-description/blob/main/descriptions/api.github.com/api.github.com.json
    notes: >-
      GitHub never returns a secret's value, so a deleted secret cannot be
      recovered.
    tests:
      - fixture: fixtures/org-secret-delete.http
        expect: irreversible
        resource: acme
