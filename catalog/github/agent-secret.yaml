# GitHub REST and GraphQL APIs: agent-secret
operations:
  - id: github.agent-secret.set
    match: { rest: { method: PUT, path: "/repos/{owner}/{repo}/agents/secrets/{secret_name}" } }
    class: credential
    resource: { arg: repo, kind: repository }
    card: "Set secret {secret_name} for agents in {owner}/{repo}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/github/rest-api-description/blob/main/descriptions/api.github.com/api.github.com.json
    tests:
      - fixture: fixtures/agent-secret-set.http
        expect: credential
        resource: shop

  - id: github.agent-secret.delete
    match: { rest: { method: DELETE, path: "/repos/{owner}/{repo}/agents/secrets/{secret_name}" } }
    class: irreversible
    resource: { arg: repo, kind: repository }
    card: "Delete secret {secret_name} for agents in {owner}/{repo}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/github/rest-api-description/blob/main/descriptions/api.github.com/api.github.com.json
    notes: >-
      GitHub never returns a secret's value, so a deleted secret cannot be
      recovered.
    tests:
      - fixture: fixtures/agent-secret-delete.http
        expect: irreversible
        resource: shop
