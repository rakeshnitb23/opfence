# Fly.io Machines API: secret-key
operations:
  - id: flyio.secret-key.set
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/secretkeys/{secret_name}" } }
    class: credential
    resource: { arg: app_name, kind: app }
    card: "Store key material as secret key {secret_name} in app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    tests:
      - fixture: fixtures/secret-key-set.http
        expect: credential
        resource: shop-api

  - id: flyio.secret-key.generate
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/secretkeys/{secret_name}/generate" } }
    class: credential
    resource: { arg: app_name, kind: app }
    card: "Generate a new secret key {secret_name} in app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Creates new key material the app can use to sign or decrypt.
    tests:
      - fixture: fixtures/secret-key-generate.http
        expect: credential
        resource: shop-api

  - id: flyio.secret-key.delete
    match: { rest: { method: DELETE, path: "/v1/apps/{app_name}/secretkeys/{secret_name}" } }
    class: irreversible
    resource: { arg: app_name, kind: app }
    card: "Delete secret key {secret_name} from app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      The key material is gone, and so is anything only it could
      decrypt.
    tests:
      - fixture: fixtures/secret-key-delete.http
        expect: irreversible
        resource: shop-api

  - id: flyio.secret-key.decrypt
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/secretkeys/{secret_name}/decrypt" } }
    class: credential
    resource: { arg: app_name, kind: app }
    card: "Decrypt data with secret key {secret_name} of app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Returns plaintext that the key protects.
    tests:
      - fixture: fixtures/secret-key-decrypt.http
        expect: credential
        resource: shop-api

  - id: flyio.secret-key.sign
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/secretkeys/{secret_name}/sign" } }
    class: credential
    resource: { arg: app_name, kind: app }
    card: "Sign data with secret key {secret_name} of app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Lets the caller produce signatures (tokens, webhooks) that others
      trust as the app's.
    tests:
      - fixture: fixtures/secret-key-sign.http
        expect: credential
        resource: shop-api

  - id: flyio.secret-key.encrypt
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/secretkeys/{secret_name}/encrypt" } }
    class: read
    resource: { arg: app_name, kind: app }
    card: "Encrypt data with secret key {secret_name} of app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Changes nothing and reveals no key material.
    tests:
      - fixture: fixtures/secret-key-encrypt.http
        expect: read
        resource: shop-api

  - id: flyio.secret-key.verify
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/secretkeys/{secret_name}/verify" } }
    class: read
    resource: { arg: app_name, kind: app }
    card: "Verify a signature with secret key {secret_name} of app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Changes nothing and reveals no key material.
    tests:
      - fixture: fixtures/secret-key-verify.http
        expect: read
        resource: shop-api
