# Fly.io Machines and GraphQL APIs: secret
operations:
  - id: flyio.secret.list
    match: { rest: { method: GET, path: "/v1/apps/{app_name}/secrets" } }
    class: read
    when:
      - if: { arg: query.show_secrets, present: true }
        class: credential
    resource: { arg: app_name, kind: app }
    card: "List the secrets of app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Without show_secrets only names and digests come back; with it,
      every value in plain text. Any show_secrets parameter counts,
      since Go parses 1, t and TRUE as true.
    tests:
      - fixture: fixtures/secret-list.http
        expect: read
        resource: shop-api
      - fixture: fixtures/secret-list-show.http
        expect: credential
        resource: shop-api
      - fixture: fixtures/secret-list-show-1.http
        expect: credential
        resource: shop-api

  - id: flyio.secret.get
    match: { rest: { method: GET, path: "/v1/apps/{app_name}/secrets/{secret_name}" } }
    class: read
    when:
      - if: { arg: query.show_secrets, present: true }
        class: credential
    resource: { arg: app_name, kind: app }
    card: "Read secret {secret_name} of app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Returns the value only with show_secrets.
    tests:
      - fixture: fixtures/secret-get.http
        expect: read
        resource: shop-api
      - fixture: fixtures/secret-get-show.http
        expect: credential
        resource: shop-api

  - id: flyio.secret.update
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/secrets" } }
    class: credential
    when:
      - if: { arg: body.values, present: true }
        class: credential
      - if: { arg: body.values, present: true }
        class: irreversible
    resource: { arg: app_name, kind: app }
    card: "Set or unset several secrets of app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
      - https://github.com/superfly/fly-go/blob/main/flaps/flaps_secrets.go
    notes: >-
      Sets secrets (credential) and deletes every secret whose value is
      null (fly-go UpdateAppSecrets), and a deleted secret value cannot
      be recovered. The keys are arbitrary, so every request with values
      is treated as both.
    tests:
      - fixture: fixtures/secret-update.http
        expect: credential
        resource: shop-api
      - fixture: fixtures/secret-update.http
        expect: irreversible
        resource: shop-api

  - id: flyio.secret.set
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/secrets/{secret_name}" } }
    class: credential
    resource: { arg: app_name, kind: app }
    card: "Set secret {secret_name} on app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Fly secrets are a store meant for secrets; overwriting loses the
      old value.
    tests:
      - fixture: fixtures/secret-set.http
        expect: credential
        resource: shop-api

  - id: flyio.secret.delete
    match: { rest: { method: DELETE, path: "/v1/apps/{app_name}/secrets/{secret_name}" } }
    class: irreversible
    resource: { arg: app_name, kind: app }
    card: "Delete secret {secret_name} from app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Fly keeps no copy of a deleted secret value.
    tests:
      - fixture: fixtures/secret-delete.http
        expect: irreversible
        resource: shop-api

  - id: flyio.secret.set-secrets
    match: { graphql: { type: mutation, field: setSecrets } }
    class: credential
    when:
      - if: { arg: input.replaceAll, equals: "true" }
        class: credential
      - if: { arg: input.replaceAll, equals: "true" }
        class: irreversible
    resource: { arg: input.appId, kind: app }
    card: "Set secrets on app {input.appId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/fly-go/blob/main/schema.graphql
    notes: >-
      Setting a secret is credential; with replaceAll every secret not
      in the request is deleted.
    tests:
      - fixture: fixtures/secret-set-secrets.http
        expect: credential
        resource: shop-api
      - fixture: fixtures/secret-set-secrets-replace-all.http
        expect: irreversible
        resource: shop-api
      - fixture: fixtures/secret-set-secrets-replace-all.http
        expect: credential
        resource: shop-api

  - id: flyio.secret.unset-secrets
    match: { graphql: { type: mutation, field: unsetSecrets } }
    class: irreversible
    resource: { arg: input.appId, kind: app }
    card: "Delete secrets {input.keys} from app {input.appId}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/fly-go/blob/main/schema.graphql
    notes: >-
      Fly keeps no copy of deleted secret values.
    tests:
      - fixture: fixtures/secret-unset-secrets.http
        expect: irreversible
        resource: shop-api
