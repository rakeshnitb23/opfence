  - id: flyio.app.delete-app
    match: { graphql: { type: mutation, field: deleteApp } }
    class: irreversible
    resource: { arg: appId, kind: app }
    card: "Delete Fly app {appId} with all its Machines, volumes and secrets"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/fly-go/blob/main/schema.graphql
      - https://github.com/superfly/flyctl/blob/master/internal/command/apps/destroy.go
    notes: >-
      Deletes the app with its Machines, volumes and their data, secrets
      and IPs; flyctl calls it permanent.
    tests:
      - fixture: fixtures/app-delete-app.http
        expect: irreversible
        resource: shop-api

  - id: flyio.app.move-app
