# Fly.io Machines and GraphQL APIs: app
operations:
  - id: flyio.app.create
    match: { rest: { method: POST, path: "/v1/apps" } }
    class: write
    resource: { arg: body.name, kind: app }
    card: "Create Fly app {body.name} in organization {body.org_slug}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      An empty app costs nothing; Machines and volumes created in it are
      classified on their own.
    tests:
      - fixture: fixtures/app-create.http
        expect: write
        resource: shop-api

  - id: flyio.app.destroy
    match: { rest: { method: DELETE, path: "/v1/apps/{app_name}" } }
    class: irreversible
    resource: { arg: app_name, kind: app }
    card: "Destroy Fly app {app_name} with all its Machines, volumes and secrets"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
      - https://github.com/superfly/flyctl/blob/master/internal/command/apps/destroy.go
    notes: >-
      Destroying an app destroys its Machines, volumes (and the data on
      them), secrets, certificates and IP addresses; flyctl calls it
      permanent. The API has no undo.
    tests:
      - fixture: fixtures/app-destroy.http
        expect: irreversible
        resource: shop-api

  - id: flyio.app.create-deploy-token
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/deploy_token" } }
    class: credential
    resource: { arg: app_name, kind: app }
    card: "Create a deploy token for app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Returns a new token that can deploy and manage the app.
    tests:
      - fixture: fixtures/app-create-deploy-token.http
        expect: credential
        resource: shop-api

  - id: flyio.app.create-app
    match: { graphql: { type: mutation, field: createApp } }
    class: write
    resource: { arg: input.name, kind: app }
    card: "Create Fly app {input.name}"
    status: verified
    verified: 2026-10-18
    sources:
