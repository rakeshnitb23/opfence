        expect: write
        resource: shop-api

  - id: flyio.app.create-machine-app
    match: { graphql: { type: mutation, field: createMachineApp } }
    class: write
    resource: { arg: input.appName, kind: app }
    card: "Create Fly app {input.appName} in {input.organizationSlug}"
    status: verified
    verified: 2026-10-18
    sources:
