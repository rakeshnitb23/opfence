# Fly.io Machines and GraphQL APIs: machine
operations:
  - id: flyio.machine.create
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/machines" } }
    class: money
    resource: { arg: app_name, kind: app }
    card: "Create a Machine in app {app_name} from image {body.config.image} in {body.region}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      A new Machine is billed while it runs and for its root file
      system.
    tests:
      - fixture: fixtures/machine-create.http
        expect: money
        resource: shop-api

  - id: flyio.machine.update
    match: { rest: { method: POST, path: "/v1/apps/{app_name}/machines/{machine_id}" } }
    class: write
    when:
      - if: { arg: body.config.guest, present: true }
        class: money
      - if: { arg: body.config.guest, present: true }
        class: write
    resource: { arg: app_name, kind: app }
    card: "Update the configuration of Machine {machine_id} in app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      Changing the guest (CPU, memory, GPU) changes what the Machine
      bills, so a request that sets it is also money.
    tests:
      - fixture: fixtures/machine-update.http
        expect: write
        resource: shop-api
      - fixture: fixtures/machine-update-guest.http
        expect: money
        resource: shop-api
      - fixture: fixtures/machine-update-guest.http
        expect: write
        resource: shop-api

  - id: flyio.machine.destroy
    match: { rest: { method: DELETE, path: "/v1/apps/{app_name}/machines/{machine_id}" } }
    class: delete
    resource: { arg: app_name, kind: app }
    card: "Destroy Machine {machine_id} in app {app_name}"
    status: verified
    verified: 2026-10-18
    sources:
      - https://github.com/superfly/docs/blob/main/api/machines/openapi.json
    notes: >-
      A Machine's root file system is ephemeral by design and volumes
      survive the Machine, so the Machine can be recreated from the
      app's image and config (fly deploy). Data kept on the root file
      system against Fly's advice is lost.
    tests:
      - fixture: fixtures/machine-destroy.http
        expect: delete
        resource: shop-api
      - fixture: fixtures/machine-destroy-force.http
        expect: delete
        resource: shop-api

