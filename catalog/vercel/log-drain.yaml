# Vercel REST API: log-drain
operations:
  - id: vercel.log-drain.delete
    match: { rest: { method: DELETE, path: "/{version}/log-drains/{id}" } }
    class: delete
    card: "Delete log drain {id}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/log-drain-delete.http
        expect: delete

  - id: vercel.log-drain.create
    match: { rest: { method: POST, path: "/{version}/log-drains" } }
    class: credential
    card: "Create log drain {body.name} to {body.url}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Sends logs to an outside URL with the given signing secret and headers.
    tests:
      - fixture: fixtures/log-drain-create.http
        expect: credential

  - id: vercel.log-drain.list
    match: { rest: { method: GET, path: "/{version}/log-drains" } }
    class: credential
    card: "List log drains"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    response:
      redact: [drains.delivery.secret, drains.delivery.headers]
      class: read
    notes: >-
      Each drain's delivery settings include its signing secret and custom
      headers, which often carry an Authorization value. Under opfence run the
      proxy redacts both and the call is read; anywhere else it is credential.
    tests:
      - fixture: fixtures/log-drain-list.http
        expect: credential
        response: fixtures/log-drain-list-response.json
