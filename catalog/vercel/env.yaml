# Vercel REST API: env
operations:
  - id: vercel.env.list
    match: { rest: { method: GET, path: "/{version}/projects/{idOrName}/env" } }
    class: read
    when:
      - if: { arg: query.decrypt, equals: "true" }
        class: credential
    resource: { arg: idOrName, kind: project }
    card: "List environment variables of {idOrName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Without decrypt=true, encrypted values come back encrypted; with it,
      every value is plain text.
    tests:
      - fixture: fixtures/env-list.http
        expect: read
        resource: shop-web
      - fixture: fixtures/env-list-decrypt.http
        expect: credential
        resource: shop-web
      - fixture: fixtures/env-list-decrypt-repeated.http
        expect: credential
        resource: shop-web

  - id: vercel.env.read
    match: { rest: { method: GET, path: "/{version}/projects/{idOrName}/env/{id}" } }
    class: credential
    resource: { arg: idOrName, kind: project }
    card: "Read the decrypted value of variable {id} in project {idOrName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/env-read.http
        expect: credential
        resource: shop-web

  - id: vercel.env.create
    match: { rest: { method: POST, path: "/{version}/projects/{idOrName}/env" } }
    class: write
    when:
      - if: { arg: body.type, in: [encrypted, sensitive, secret] }
        class: credential
    resource: { arg: idOrName, kind: project }
    card: "Add variable {body.key} to {idOrName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      A write for plain variables; encrypted, sensitive and secret variables
      are secrets, so setting one is credential.
    tests:
      - fixture: fixtures/env-create.http
        expect: write
        resource: shop-web
      - fixture: fixtures/env-create-sensitive.http
        expect: credential
        resource: shop-web
      - fixture: fixtures/env-create-batch.http
        expect: credential
        resource: shop-web

  - id: vercel.env.update
    match: { rest: { method: PATCH, path: "/{version}/projects/{idOrName}/env/{id}" } }
    class: write
    when:
      - if: { arg: body.type, in: [encrypted, sensitive, secret] }
        class: credential
    resource: { arg: idOrName, kind: project }
    card: "Change variable {id} of {idOrName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      A write for plain variables; encrypted, sensitive and secret variables
      are secrets, so setting one is credential.
    tests:
      - fixture: fixtures/env-update.http
        expect: write
        resource: shop-web
      - fixture: fixtures/env-update-encrypted.http
        expect: credential
        resource: shop-web

  - id: vercel.env.delete
    match: { rest: { method: DELETE, path: "/{version}/projects/{idOrName}/env/{id}" } }
    class: irreversible
    resource: { arg: idOrName, kind: project }
    card: "Delete variable {id} from project {idOrName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Vercel keeps no copy of a deleted value.
    tests:
      - fixture: fixtures/env-delete.http
        expect: irreversible
        resource: shop-web

  - id: vercel.env.batch-delete
    match: { rest: { method: DELETE, path: "/{version}/projects/{idOrName}/env" } }
    class: irreversible
    resource: { arg: idOrName, kind: project }
    card: "Delete variables {body.ids} from project {idOrName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/env-batch-delete.http
        expect: irreversible
        resource: shop-web
