# Vercel REST API: alias
operations:
  - id: vercel.alias.delete
    match: { rest: { method: DELETE, path: "/{version}/aliases/{aliasId}" } }
    class: delete
    card: "Delete alias {aliasId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/alias-delete.http
        expect: delete

  - id: vercel.alias.assign
    match: { rest: { method: POST, path: "/{version}/deployments/{id}/aliases" } }
    class: access
    resource: { arg: id, kind: deployment }
    card: "Point alias {body.alias} at deployment {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Serves the deployment, possibly a preview, on the alias; production custom
      domains are exempt from Standard Deployment Protection, and the alias is
      taken from whichever deployment had it.
    tests:
      - fixture: fixtures/alias-assign.http
        expect: access
        resource: dpl_123

  - id: vercel.alias.protection-bypass
    match: { rest: { method: PATCH, path: "/aliases/{id}/protection-bypass" } }
    class: credential
    card: "Change the protection bypass of URL {id}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Creates or revokes shareable-link secrets and user access that skip Vercel
      Authentication on that URL.
    tests:
      - fixture: fixtures/alias-protection-bypass.http
        expect: credential

  - id: vercel.alias.list
    match: { rest: { method: GET, path: "/{version}/aliases" } }
    class: credential
    card: "List aliases with their shareable-link secrets"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Each alias's protectionBypass map is keyed by its shareable-link secrets,
      which skip Vercel Authentication. Map keys cannot be redacted, so the read
      stays credential.
    tests:
      - fixture: fixtures/alias-list.http
        expect: credential

  - id: vercel.alias.read
    match: { rest: { method: GET, path: "/{version}/aliases/{idOrAlias}" } }
    class: credential
    card: "Read alias {idOrAlias} with its shareable-link secrets"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Each alias's protectionBypass map is keyed by its shareable-link secrets,
      which skip Vercel Authentication. Map keys cannot be redacted, so the read
      stays credential.
    tests:
      - fixture: fixtures/alias-read.http
        expect: credential

  - id: vercel.alias.deployment-list
    match: { rest: { method: GET, path: "/{version}/deployments/{id}/aliases" } }
    class: credential
    resource: { arg: id, kind: deployment }
    card: "List aliases of deployment {id} with their shareable-link secrets"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Each alias's protectionBypass map is keyed by its shareable-link secrets,
      which skip Vercel Authentication. Map keys cannot be redacted, so the read
      stays credential.
    tests:
      - fixture: fixtures/alias-deployment-list.http
        expect: credential
        resource: dpl_123
