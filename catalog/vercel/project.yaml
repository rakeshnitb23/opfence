# Vercel REST API: project
operations:
  - id: vercel.project.delete
    match: { rest: { method: DELETE, path: "/{version}/projects/{idOrName}" } }
    class: irreversible
    resource: { arg: idOrName, kind: project }
    card: "Delete Vercel project {idOrName} with its deployments, domains and variables"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-delete.http
        expect: irreversible
        resource: shop-web

  - id: vercel.project.create
    match: { rest: { method: POST, path: "/{version}/projects" } }
    class: write
    card: "Create Vercel project {body.name}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-create.http
        expect: write

  - id: vercel.project.update
    match: { rest: { method: PATCH, path: "/{version}/projects/{idOrName}" } }
    class: write
    when:
      - if: { arg: body.ssoProtection, present: true }
        class: access
      - if: { arg: body.passwordProtection, present: true }
        class: access
      - if: { arg: body.trustedIps, present: true }
        class: access
      - if: { arg: body.publicSource, present: true }
        class: access
      - if: { arg: body.oidcTokenConfig, present: true }
        class: access
      - if: { arg: body.optionsAllowlist, present: true }
        class: access
    resource: { arg: idOrName, kind: project }
    card: "Change settings of project {idOrName}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Deployment protection, trusted IPs, public source and OIDC settings
      change who can reach the project or its source. Setting ssoProtection to
      null turns protection off.
    tests:
      - fixture: fixtures/project-update.http
        expect: write
        resource: shop-web
      - fixture: fixtures/project-update-protection-off.http
        expect: access
        resource: shop-web
      - fixture: fixtures/project-update-password.http
        expect: access
        resource: shop-web
      - fixture: fixtures/project-update-public-source.http
        expect: access
        resource: shop-web

  - id: vercel.project.pause
    match: { rest: { method: POST, path: "/{version}/projects/{projectId}/pause" } }
    class: write
    resource: { arg: projectId, kind: project }
    card: "Pause Vercel project {projectId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Pausing takes the production deployment offline until unpaused.
    tests:
      - fixture: fixtures/project-pause.http
        expect: write
        resource: prj_shop

  - id: vercel.project.unpause
    match: { rest: { method: POST, path: "/{version}/projects/{projectId}/unpause" } }
    class: write
    resource: { arg: projectId, kind: project }
    card: "Unpause Vercel project {projectId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-unpause.http
        expect: write
        resource: prj_shop

  - id: vercel.project.promote
    match: { rest: { method: POST, path: "/{version}/projects/{projectId}/promote/{deploymentId}" } }
    class: write
    resource: { arg: projectId, kind: project }
    card: "Promote deployment {deploymentId} to production for project {projectId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-promote.http
        expect: write
        resource: prj_shop

  - id: vercel.project.rollback
    match: { rest: { method: POST, path: "/{version}/projects/{projectId}/rollback/{deploymentId}" } }
    class: write
    resource: { arg: projectId, kind: project }
    card: "Roll project {projectId} back to deployment {deploymentId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-rollback.http
        expect: write
        resource: prj_shop

  - id: vercel.project.transfer
    match: { rest: { method: POST, path: "/projects/{idOrName}/transfer-request" } }
    class: access
    resource: { arg: idOrName, kind: project }
    card: "Start transferring project {idOrName} to another team"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-transfer.http
        expect: access
        resource: shop-web

  - id: vercel.project.transfer-accept
    match: { rest: { method: PUT, path: "/projects/transfer-request/{code}" } }
    class: access
    card: "Accept project transfer {code}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-transfer-accept.http
        expect: access

  - id: vercel.project.read
    match: { rest: { method: GET, path: "/{version}/projects/{idOrName}" } }
    class: credential
    resource: { arg: idOrName, kind: project }
    card: "Read project {idOrName} with its bypass secrets"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Each project's protectionBypass map is keyed by its Protection Bypass for
      Automation secrets (the VERCEL_AUTOMATION_BYPASS_SECRET value). The secrets
      are map keys, which a response redact cannot hide, so the read stays
      credential.
    tests:
      - fixture: fixtures/project-read.http
        expect: credential
        resource: shop-web

  - id: vercel.project.list
    match: { rest: { method: GET, path: "/{version}/projects" } }
    class: credential
    card: "List projects with their bypass secrets"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Each project's protectionBypass map is keyed by its Protection Bypass for
      Automation secrets (the VERCEL_AUTOMATION_BYPASS_SECRET value). The secrets
      are map keys, which a response redact cannot hide, so the read stays
      credential.
    tests:
      - fixture: fixtures/project-list.http
        expect: credential

  - id: vercel.project.trace-read
    match: { rest: { method: GET, path: "/{version}/projects/traces" } }
    class: read
    card: "Read a request trace"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Listed so the project read rule does not claim this path.
    tests:
      - fixture: fixtures/project-trace-read.http
        expect: read

  - id: vercel.project.trace-session
    match: { rest: { method: POST, path: "/{version}/projects/traces/session" } }
    class: credential
    card: "Mint a trace session token for {body.hostname}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Returns a short-lived JWT that the Vercel proxy accepts for that
      deployment.
    tests:
      - fixture: fixtures/project-trace-session.http
        expect: credential

  - id: vercel.project.avatar-upload
    match: { rest: { method: POST, path: "/{version}/projects/{idOrName}/avatar" } }
    class: write
    resource: { arg: idOrName, kind: project }
    card: "Upload an avatar for project {idOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-avatar-upload.http
        expect: write
        resource: shop-web

  - id: vercel.project.avatar-delete
    match: { rest: { method: DELETE, path: "/{version}/projects/{idOrName}/avatar" } }
    class: write
    resource: { arg: idOrName, kind: project }
    card: "Remove the avatar of project {idOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Clears the chosen avatar; the stored image is kept.
    tests:
      - fixture: fixtures/project-avatar-delete.http
        expect: write
        resource: shop-web

  - id: vercel.project.static-ips
    match: { rest: { method: PATCH, path: "/{version}/projects/{idOrName}/shared-connect-links" } }
    class: money
    resource: { arg: idOrName, kind: project }
    card: "Configure Static IPs for project {idOrName}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Static IPs are a paid add-on.
    tests:
      - fixture: fixtures/project-static-ips.http
        expect: money
        resource: shop-web

  - id: vercel.project.rollback-description
    match: { rest: { method: PATCH, path: "/{version}/projects/{projectId}/rollback/{deploymentId}/update-description" } }
    class: write
    resource: { arg: projectId, kind: project }
    card: "Change the reason given for rolling project {projectId} back to {deploymentId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/project-rollback-description.http
        expect: write
        resource: prj_shop
