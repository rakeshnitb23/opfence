    response:
      clear: [protectionBypass]
      class: write
    notes: >-
      Clears the chosen avatar; the stored image is kept. The response is the
      project, whose protectionBypass map is keyed by its Protection Bypass for
      Automation secrets; under opfence run the proxy empties the map and the
      call is write, anywhere else it is credential.
    tests:
      - fixture: fixtures/project-avatar-delete.http
        expect: credential
        response: fixtures/project-avatar-delete-response.json
        resource: shop-web

  - id: vercel.project.static-ips
    match: { rest: { method: PATCH, path: "/{version}/projects/{idOrName}/shared-connect-links" } }
    class: money
    resource: { arg: idOrName, kind: project }
    card: "Configure Static IPs for project {idOrName}"
    status: verified
    verified: 2026-10-19
    sources:
