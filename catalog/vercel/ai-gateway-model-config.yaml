# Vercel REST API: ai-gateway-model-config
operations:
  - id: vercel.ai-gateway-model-config.create
    match: { rest: { method: POST, path: "/ai-gateway/virtual-model-configs" } }
    class: access
    card: "Create an AI Gateway virtual model config"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      A virtual model config can relay requests to any baseUrl, pick the BYOK
      credentials it uses and relax provider privacy settings
      (disallowPromptTraining). The spec publishes no request body, so creating
      or changing one is access.
    tests:
      - fixture: fixtures/ai-gateway-model-config-create.http
        expect: access

