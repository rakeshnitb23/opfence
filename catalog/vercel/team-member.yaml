# Vercel REST API: team-member
operations:
  - id: vercel.team-member.invite
    match: { rest: { method: POST, path: "/{version}/teams/{teamId}/members" } }
    class: access
    resource: { arg: teamId, kind: team }
    card: "Invite someone to team {teamId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/team-member-invite.http
        expect: access
        resource: team_acme

  - id: vercel.team-member.remove
    match: { rest: { method: DELETE, path: "/{version}/teams/{teamId}/members/{uid}" } }
    class: access
    resource: { arg: teamId, kind: team }
    card: "Remove member {uid} from team {teamId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/team-member-remove.http
        expect: access
        resource: team_acme

  - id: vercel.team-member.update
    match: { rest: { method: PATCH, path: "/{version}/teams/{teamId}/members/{uid}" } }
    class: access
    resource: { arg: teamId, kind: team }
    card: "Change the role of {uid} in team {teamId}"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/team-member-update.http
        expect: access
        resource: team_acme

  - id: vercel.team-member.request-access
    match: { rest: { method: POST, path: "/{version}/teams/{teamId}/request" } }
    class: access
    resource: { arg: teamId, kind: team }
    card: "Request to join team {teamId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/team-member-request-access.http
        expect: access
        resource: team_acme

  - id: vercel.team-member.join
    match: { rest: { method: POST, path: "/{version}/teams/{teamId}/members/teams/join" } }
    class: access
    resource: { arg: teamId, kind: team }
    card: "Join team {teamId}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/team-member-join.http
        expect: access
        resource: team_acme
