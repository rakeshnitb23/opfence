# Vercel REST API: artifacts
operations:
  - id: vercel.artifacts.delete-all
    match: { rest: { method: DELETE, path: "/{version}/artifacts" } }
    class: delete
    card: "Delete every Remote Cache artifact"
    status: verified
    verified: 2026-10-16
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Build caches regenerate, at the cost of slower builds.
    tests:
      - fixture: fixtures/artifacts-delete-all.http
        expect: delete

  - id: vercel.artifacts.query
    match: { rest: { method: POST, path: "/{version}/artifacts" } }
    class: read
    card: "Look up Remote Cache artifacts"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      A lookup sent as POST; it changes nothing.
    tests:
      - fixture: fixtures/artifacts-query.http
        expect: read

  - id: vercel.artifacts.record-events
    match: { rest: { method: POST, path: "/{version}/artifacts/events" } }
    class: write
    card: "Record Remote Cache usage events"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    tests:
      - fixture: fixtures/artifacts-record-events.http
        expect: write

  - id: vercel.artifacts.upload
    match: { rest: { method: PUT, path: "/{version}/artifacts/{hash}" } }
    class: write
    card: "Upload Remote Cache artifact {hash}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/vercel/sdk/blob/main/vercel-spec.json
    notes: >-
      Later builds restore the artifact instead of building, so a bad one reaches
      deployments.
    tests:
      - fixture: fixtures/artifacts-upload.http
        expect: write
