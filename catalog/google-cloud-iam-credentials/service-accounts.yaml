# Google Cloud IAM Service Account Credentials: service accounts.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-iam-credentials.service-accounts.generate-access-token
    match: { rest: { method: POST, path: "/v1/projects/{project}/serviceAccounts/{serviceAccount}:generateAccessToken" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Get an access token for service account {serviceAccount}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/iamcredentials/v1/rest
    notes: >-
      Returns an access token that acts as the service account.
    tests:
      - fixture: fixtures/service-accounts-generate-access-token.http
        expect: credential
        resource: "acme-prod"

  - id: google-cloud-iam-credentials.service-accounts.generate-id-token
    match: { rest: { method: POST, path: "/v1/projects/{project}/serviceAccounts/{serviceAccount}:generateIdToken" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Get an ID token for service account {serviceAccount}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/iamcredentials/v1/rest
    notes: >-
      Returns an ID token that identifies as the service account.
    tests:
      - fixture: fixtures/service-accounts-generate-id-token.http
        expect: credential
        resource: "acme-prod"

  - id: google-cloud-iam-credentials.service-accounts.sign-blob
    match: { rest: { method: POST, path: "/v1/projects/{project}/serviceAccounts/{serviceAccount}:signBlob" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Sign data as service account {serviceAccount}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/iamcredentials/v1/rest
    notes: >-
      Signs as the service account.
    tests:
      - fixture: fixtures/service-accounts-sign-blob.http
        expect: credential
        resource: "acme-prod"

  - id: google-cloud-iam-credentials.service-accounts.sign-jwt
    match: { rest: { method: POST, path: "/v1/projects/{project}/serviceAccounts/{serviceAccount}:signJwt" } }
    class: credential
    resource: { arg: project, kind: project }
    card: "Sign a JWT as service account {serviceAccount}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/iamcredentials/v1/rest
    notes: >-
      Signs a JWT as the service account, which can be exchanged for its access token.
    tests:
      - fixture: fixtures/service-accounts-sign-jwt.http
        expect: credential
        resource: "acme-prod"
