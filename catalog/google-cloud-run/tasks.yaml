# Google Cloud Run: tasks.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-run.tasks.get-v1
    match: { rest: { method: GET, path: "/apis/run.googleapis.com/v1/namespaces/{project}/tasks/{task}" } }
    class: credential
    response: { hold: ["**.env.value"], class: read }
    resource: { arg: project, kind: project }
    card: "Read Cloud Run task {task} in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/run/v1/rest
    notes: >-
      Returns the containers' environment variables. The proxy holds their values: the agent sees
      tokens, which a write of the same object may carry back.
    tests:
      - fixture: fixtures/tasks-get-v1.http
        expect: credential
        response: fixtures/tasks-get-v1.json
        resource: "acme-prod"

  - id: google-cloud-run.tasks.list-v1
    match: { rest: { method: GET, path: "/apis/run.googleapis.com/v1/namespaces/{project}/tasks" } }
    class: credential
    response: { hold: ["**.env.value"], class: read }
    resource: { arg: project, kind: project }
    card: "List Cloud Run tasks in project {project}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://www.googleapis.com/discovery/v1/apis/run/v1/rest
    notes: >-
      Returns the containers' environment variables. The proxy holds their values: the agent sees
      tokens, which a write of the same object may carry back.
    tests:
      - fixture: fixtures/tasks-list-v1.http
        expect: credential
        response: fixtures/tasks-list-v1.json
        resource: "acme-prod"
