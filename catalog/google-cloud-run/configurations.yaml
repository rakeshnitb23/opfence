# Google Cloud Run: configurations.
# Generated from Google's discovery documents (see provider.yaml); classes reviewed by hand.
operations:
  - id: google-cloud-run.configurations.get-v1
    match: { rest: { method: GET, path: "/apis/serving.knative.dev/v1/namespaces/{project}/configurations/{configuration}" } }
    class: credential
    response: { hold: ["**.env.value"], class: read }
    resource: { arg: project, kind: project }
    card: "Read Cloud Run configuration {configuration} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://www.googleapis.com/discovery/v1/apis/run/v1/rest
    notes: >-
      Returns the containers' environment variables. The proxy holds their values: the agent sees
      tokens, which a write of the same object may carry back.
    tests:
      - fixture: fixtures/configurations-get-v1.http
        expect: credential
        response: fixtures/configurations-get-v1.json
        resource: "acme-prod"

