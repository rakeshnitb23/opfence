    card: "Delete Cloud Run operation {operation} in project {project}"
    status: verified
    verified: 2026-10-23
    sources:
      - https://run.googleapis.com/$discovery/rest?version=v2
    notes: >-
      Deletes the record of an operation, not what it did.
    tests:
      - fixture: fixtures/operations-delete.http
